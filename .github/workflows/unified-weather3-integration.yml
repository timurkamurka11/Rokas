name: Unified Weather3 Evidence-Only Finalizer

on:
  push:
    branches:
      - ci/unified-weather3-integration
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTED_SHA: af541032cd1dd492d9895c5a9c8e92a1e2342745
      TESTED_TREE: c0003c877acc637deff0f58dabc94bbb6f0a3214
      UNIFIED_PARENT: 8a65c318420e3727aa9de0cc973e6d507362ec6d
      WEATHER_PARENT: cf97f4ebcb68e6a3a9cf5bf73bab2270654e1c62
      KNOWN_DEVELOPMENT_BASELINE: 5e494f188b90bdb6916e8e78e35ac38509bd0bce
      TECH_ARTIFACT_ID: "10123293023"
      REMAINING_ARTIFACT_ID: "10127076916"
      APPROVED_BASELINE_ARTIFACT_ID: "10109251262"
    steps:
      - name: Checkout exact immutable candidate
        uses: actions/checkout@v7
        with:
          ref: af541032cd1dd492d9895c5a9c8e92a1e2342745
          fetch-depth: 0

      - name: Fresh checkout hard gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rokas-unified-weather3-finalizer"
          mkdir -p "$OUT"
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          p1="$(git rev-parse HEAD^1)"
          p2="$(git rev-parse HEAD^2)"
          test "$sha" = "$TESTED_SHA"
          test "$tree" = "$TESTED_TREE"
          test "$p1" = "$UNIFIED_PARENT"
          test "$p2" = "$WEATHER_PARENT"
          git merge-base --is-ancestor "$UNIFIED_PARENT" HEAD
          git merge-base --is-ancestor "$WEATHER_PARENT" HEAD

          git fetch origin integration/weather3-candidate integration/rokas-unified development
          candidate_remote="$(git rev-parse origin/integration/weather3-candidate)"
          unified_remote="$(git rev-parse origin/integration/rokas-unified)"
          development_remote="$(git rev-parse origin/development)"
          test "$candidate_remote" = "$TESTED_SHA"
          test "$unified_remote" = "$UNIFIED_PARENT"

          git status --short > "$OUT/git-status-initial.txt"
          test ! -s "$OUT/git-status-initial.txt"
          git diff > "$OUT/git-diff-initial.txt"
          test ! -s "$OUT/git-diff-initial.txt"
          git diff --check > "$OUT/git-diff-check-initial.txt"
          test ! -s "$OUT/git-diff-check-initial.txt"

          {
            echo "TESTED_SHA=$sha"
            echo "TESTED_TREE=$tree"
            echo "UNIFIED_PARENT=$p1"
            echo "WEATHER_PARENT=$p2"
            echo "CANDIDATE_REMOTE=$candidate_remote"
            echo "UNIFIED_REMOTE_BEFORE=$unified_remote"
            echo "DEVELOPMENT_REMOTE_BEFORE=$development_remote"
            echo "KNOWN_DEVELOPMENT_BASELINE=$KNOWN_DEVELOPMENT_BASELINE"
            echo "INITIAL_TRACKED_CHANGES=0"
          } > "$OUT/exact-tree.txt"

          {
            git show -s --format='COMMIT=%H%nTREE=%T%nPARENTS=%P%nSUBJECT=%s' HEAD
            echo "MERGE_BASE_UNIFIED=$(git merge-base "$UNIFIED_PARENT" HEAD)"
            echo "MERGE_BASE_WEATHER=$(git merge-base "$WEATHER_PARENT" HEAD)"
          } > "$OUT/ancestry.txt"

      - name: Download authoritative existing evidence outside repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMP="$RUNNER_TEMP/imported-weather3-evidence"
          OUT="$RUNNER_TEMP/rokas-unified-weather3-finalizer"
          mkdir -p "$IMP/technical" "$IMP/remaining" "$IMP/approved-baseline"
          download_artifact() {
            id="$1"; dest="$2"; zip="$RUNNER_TEMP/artifact-$id.zip"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$zip"
            test -s "$zip"
            unzip -q "$zip" -d "$dest"
            sha256sum "$zip" >> "$OUT/imported-artifact-zip-sha256.txt"
          }
          download_artifact "$TECH_ARTIFACT_ID" "$IMP/technical"
          download_artifact "$REMAINING_ARTIFACT_ID" "$IMP/remaining"
          download_artifact "$APPROVED_BASELINE_ARTIFACT_ID" "$IMP/approved-baseline"
          {
            echo "TECH_ARTIFACT_ID=$TECH_ARTIFACT_ID"
            echo "REMAINING_ARTIFACT_ID=$REMAINING_ARTIFACT_ID"
            echo "APPROVED_BASELINE_ARTIFACT_ID=$APPROVED_BASELINE_ARTIFACT_ID"
          } > "$OUT/imported-artifacts.txt"

      - name: Parse actual evidence and build factual matrix
        shell: bash
        run: |
          set -euo pipefail
          IMP="$RUNNER_TEMP/imported-weather3-evidence"
          OUT="$RUNNER_TEMP/rokas-unified-weather3-finalizer"
          export IMP OUT TESTED_SHA TESTED_TREE UNIFIED_PARENT WEATHER_PARENT
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import xml.etree.ElementTree as ET
          from pathlib import Path

          imp = Path(os.environ["IMP"])
          out = Path(os.environ["OUT"])
          tech = imp / "technical"
          rem = imp / "remaining"
          baseline = imp / "approved-baseline"
          tested_sha = os.environ["TESTED_SHA"]
          tested_tree = os.environ["TESTED_TREE"]
          unified_parent = os.environ["UNIFIED_PARENT"]
          weather_parent = os.environ["WEATHER_PARENT"]

          def kv(path):
              data = {}
              for line in Path(path).read_text(errors="replace").splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      data[k.strip()] = v.strip()
              return data

          def parse_xml(path):
              root = ET.parse(path).getroot()
              vals = {
                  k: int(root.attrib.get(k, "0") or 0)
                  for k in ("total", "passed", "failed", "skipped", "inconclusive")
              }
              cases = root.findall(".//test-case")
              return root, vals, cases

          tech_meta = kv(tech / "exact-tree.txt")
          rem_meta = kv(rem / "exact-tree.txt")
          for meta, label in ((tech_meta, "technical"), (rem_meta, "remaining")):
              if meta.get("TESTED_SHA") != tested_sha:
                  raise SystemExit(f"{label} TESTED_SHA mismatch: {meta.get('TESTED_SHA')}")
              if meta.get("TESTED_TREE") != tested_tree:
                  raise SystemExit(f"{label} TESTED_TREE mismatch: {meta.get('TESTED_TREE')}")
          if tech_meta.get("UNIFIED_PARENT") != unified_parent:
              raise SystemExit("technical UNIFIED_PARENT mismatch")
          if tech_meta.get("WEATHER_PARENT") != weather_parent:
              raise SystemExit("technical WEATHER_PARENT mismatch")

          core = (tech / "core/core-output.txt").read_text(errors="replace")
          if "PASS: all Rokas.Core behavior tests" not in core:
              raise SystemExit("Core final PASS marker missing")
          combat_core = sum(1 for x in core.splitlines() if x.startswith("PASS Combat2:"))
          retirement_markers = [
              "PASS: idle attacks removed",
              "PASS: spam blocked before combo recovery",
              "PASS: timed third strike rewards combo",
              "PASS: old timed seal button retired",
          ]
          if combat_core != 23 or any(x not in core for x in retirement_markers):
              raise SystemExit("Combat Core evidence mismatch")

          _, edit, edit_cases = parse_xml(tech / "editmode/editmode-results.xml")
          _, play, play_cases = parse_xml(tech / "playmode/playmode-results.xml")
          _, weather, weather_cases = parse_xml(tech / "weather/playmode-results.xml")
          _, home, home_cases = parse_xml(tech / "home/playmode-results.xml")
          for label, vals in (("EditMode", edit), ("PlayMode", play), ("Weather", weather), ("Home", home)):
              if vals["failed"] or vals["skipped"] or vals["inconclusive"] or vals["passed"] != vals["total"]:
                  raise SystemExit(f"{label} not completely green: {vals}")

          messages_yarn = [c for c in edit_cases if "MessagesYarnTests." in c.attrib.get("fullname", "")]
          combat_edit = [c for c in edit_cases if "CombatFoundationTests.ApprovedCombatBehavior" in c.attrib.get("fullname", "")]
          messages_play = [
              c for c in play_cases
              if any(name in c.attrib.get("fullname", "") for name in
                     ("LiveMessenger", "Messages", "ContractAttachment", "CoordinateAttachment"))
          ]
          combat_play = [c for c in play_cases if "CombatFoundationPlayModeTests." in c.attrib.get("fullname", "")]
          if len(messages_yarn) != 5:
              raise SystemExit(f"Messages Yarn expected 5 actual {len(messages_yarn)}")
          if len(combat_edit) != 23:
              raise SystemExit(f"Combat edit expected 23 actual {len(combat_edit)}")
          if len(messages_play) != 22:
              raise SystemExit(f"Messages play expected 22 actual {len(messages_play)}")
          if len(combat_play) != 16:
              raise SystemExit(f"Combat play expected 16 actual {len(combat_play)}")
          if weather != dict(total=5, passed=5, failed=0, skipped=0, inconclusive=0):
              raise SystemExit(f"Weather exact inventory mismatch: {weather}")
          if home != dict(total=5, passed=5, failed=0, skipped=0, inconclusive=0):
              raise SystemExit(f"Home exact inventory mismatch: {home}")

          _, transition, transition_cases = parse_xml(rem / "transition/gameci-artifacts/playmode-results.xml")
          _, first_loop, first_loop_cases = parse_xml(rem / "runtime-flow/playmode-results.xml")
          _, visual, visual_cases = parse_xml(rem / "visual-test/playmode-results.xml")
          expected_transition = "Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn"
          expected_first = "Rokas.Tests.FirstLoopTests.IllustratedHomeCanAcceptFightReturnAndClaimExactlyOnce"
          expected_visual = "Rokas.Tests.HomeWeather3VisualQaPlayModeTests.CaptureWeather3VisualQaMatrix"
          def require_single(vals, cases, fullname, label):
              if vals != dict(total=1, passed=1, failed=0, skipped=0, inconclusive=0):
                  raise SystemExit(f"{label} not 1/1 green: {vals}")
              if len(cases) != 1 or cases[0].attrib.get("fullname") != fullname or cases[0].attrib.get("result") not in ("Passed", "Success"):
                  raise SystemExit(f"{label} identity mismatch")
          require_single(transition, transition_cases, expected_transition, "transition")
          require_single(first_loop, first_loop_cases, expected_first, "first-loop")
          require_single(visual, visual_cases, expected_visual, "visual")

          validator = kv(tech / "validator-summary.txt")
          if validator.get("HISTORICAL_FINDINGS") != "13" or validator.get("NEW_RELEVANT_FINDINGS") != "0":
              raise SystemExit("validator evidence mismatch")
          logs = kv(rem / "log-summary.txt")
          if logs.get("UNITY_LOG_FILES_DISCOVERED") != "3" or logs.get("UNITY_LOG_FILES_SCANNED") != "3" or logs.get("RELEVANT_ERRORS") != "0":
              raise SystemExit("aggregate Unity log evidence mismatch")

          names = [
              ("01-unified-weather3-light-on.png", "01-weather3-light-on.png"),
              ("02-unified-weather3-light-off.png", "02-weather3-light-off.png"),
              ("03-unified-weather3-normal-rain.png", "03-weather3-normal-rain.png"),
              ("04-unified-weather3-wet-glass.png", "04-weather3-wet-glass.png"),
              ("05-unified-weather3-lightning-on.png", "05-weather3-lightning-on.png"),
              ("06-unified-weather3-lightning-off.png", "06-weather3-lightning-off.png"),
              ("07-unified-weather3-idle-depth.png", "07-weather3-idle-depth.png"),
          ]
          capdir = rem / "weather-captures"
          baseline_candidates = list(baseline.rglob("TestResults/HomeWeather3VisualQa"))
          if len(baseline_candidates) != 1:
              raise SystemExit(f"approved baseline capture directory count={len(baseline_candidates)}")
          basedir = baseline_candidates[0]
          comparison = []
          for integrated_name, baseline_name in names:
              a = capdir / integrated_name
              b = basedir / baseline_name
              if not a.is_file() or not b.is_file():
                  raise SystemExit(f"missing capture pair {integrated_name} / {baseline_name}")
              ab = a.read_bytes()
              bb = b.read_bytes()
              ah = hashlib.sha256(ab).hexdigest()
              bh = hashlib.sha256(bb).hexdigest()
              same = ab == bb
              comparison.append(f"{integrated_name} integrated_sha256={ah} baseline_sha256={bh} byte_identical={'YES' if same else 'NO'}")
              if not same:
                  raise SystemExit(f"approved baseline mismatch: {integrated_name}")
          (out / "visual-comparison.txt").write_text(
              "APPROVED_BASELINE_ARTIFACT=10109251262\n"
              "BYTE_IDENTICAL=7/7\n" + "\n".join(comparison) + "\n"
          )

          evidence_out = out / "evidence"
          shutil.copytree(tech, evidence_out / "technical", dirs_exist_ok=True)
          shutil.copytree(rem, evidence_out / "remaining", dirs_exist_ok=True)
          shutil.copytree(basedir, evidence_out / "approved-baseline-captures", dirs_exist_ok=True)

          matrix = [
              "CORE=PASS",
              f"EDITMODE={edit['passed']}/{edit['total']}",
              f"PLAYMODE={play['passed']}/{play['total']}",
              f"WEATHER={weather['passed']}/{weather['total']}",
              f"HOME={home['passed']}/{home['total']}",
              f"MESSAGES_PLAYMODE={len(messages_play)}/22",
              f"MESSAGES_YARN_EDITMODE={len(messages_yarn)}/5",
              f"COMBAT_SCENARIOS={combat_core}/23",
              "COMBAT_RETIREMENT=4/4",
              f"COMBAT_PLAYMODE={len(combat_play)}/16",
              "TRANSITION=1/1",
              "FIRST_LOOP=1/1",
              "VALIDATOR_HISTORICAL=13",
              "VALIDATOR_NEW_RELEVANT=0",
              "UNITY_LOGS_DISCOVERED=3",
              "UNITY_LOGS_SCANNED=3",
              "UNITY_LOG_RELEVANT_ERRORS=0",
              "VISUAL_TEST=1/1",
              "VISUAL_CAPTURES=7/7",
              "VISUAL_APPROVED_BASELINE_BYTE_IDENTICAL=7/7",
              "HANDOFF_EDITMODE_EXPECTED=38/38",
              f"ACTUAL_EDITMODE_XML={edit['passed']}/{edit['total']}",
              "EDITMODE_EXPECTATION_MATCH=NO",
          ]
          (out / "test-matrix.txt").write_text("\n".join(matrix) + "\n")

          old_integrity = (rem / "final-integrity.txt").read_text(errors="replace")
          old_diffcheck = (rem / "final-working-diff-check.txt").read_text(errors="replace")
          if "TRACKED_CHANGES=2" not in old_integrity:
              raise SystemExit("historical TRACKED_CHANGES=2 marker missing")
          if old_diffcheck.strip():
              raise SystemExit("historical git diff --check was not empty")
          rca = [
              "RUN=34410386283",
              "TRACKED_CHANGES=2",
              "TRACKED_FILE_1=UNRECOVERABLE_FROM_PRESERVED_EVIDENCE",
              "TRACKED_FILE_2=UNRECOVERABLE_FROM_PRESERVED_EVIDENCE",
              "EXACT_DIFF=UNRECOVERABLE_FROM_PRESERVED_EVIDENCE",
              "CLASSIFICATION=E_UNKNOWN",
              "CANDIDATE_COMMIT_TREE_AFFECTED=NO",
              "HISTORICAL_DIFF_CHECK=PASS_EMPTY",
              "CI_VISUAL_PROBE_CS_TRACKED_IN_CANDIDATE=NO",
              "CI_VISUAL_PROBE_META_TRACKED_IN_CANDIDATE=NO",
              "PACKAGES_LOCK_TRACKED_IN_CANDIDATE=NO",
              "NOTE=The historical workflow recorded only the tracked-change count, not git status/diff paths; Unity rerun is intentionally not performed.",
          ]
          (out / "tracked-changes-RCA.txt").write_text("\n".join(rca) + "\n")
          PY

          ! git ls-files --error-unmatch Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs >/dev/null 2>&1
          ! git ls-files --error-unmatch Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs.meta >/dev/null 2>&1
          ! git ls-files --error-unmatch Packages/packages-lock.json >/dev/null 2>&1

      - name: Final clean-tree and protected-ref proof
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rokas-unified-weather3-finalizer"

          git status --short > "$OUT/git-status.txt"
          git diff > "$OUT/git-diff.txt"
          git diff --check > "$OUT/git-diff-check.txt"
          test ! -s "$OUT/git-status.txt"
          test ! -s "$OUT/git-diff.txt"
          test ! -s "$OUT/git-diff-check.txt"

          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TESTED_TREE"

          git fetch origin integration/weather3-candidate integration/rokas-unified development
          candidate_final="$(git rev-parse origin/integration/weather3-candidate)"
          unified_final="$(git rev-parse origin/integration/rokas-unified)"
          development_final="$(git rev-parse origin/development)"
          test "$candidate_final" = "$TESTED_SHA"
          test "$unified_final" = "$UNIFIED_PARENT"

          {
            echo "FINAL_TRACKED_CHANGES=0"
            echo "FINAL_SHA=$(git rev-parse HEAD)"
            echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
            echo "CANDIDATE_REMOTE_FINAL=$candidate_final"
            echo "UNIFIED_REMOTE_FINAL=$unified_final"
            echo "DEVELOPMENT_REMOTE_FINAL=$development_final"
            if [ "$development_final" = "$KNOWN_DEVELOPMENT_BASELINE" ]; then
              echo "DEVELOPMENT_BASELINE_UNCHANGED=YES"
            else
              echo "DEVELOPMENT_BASELINE_UNCHANGED=NO"
            fi
            echo "EVIDENCE_FINALIZER=PASS"
            echo "RCA_CLASSIFICATION=E_UNKNOWN"
            echo "CHECKPOINT_ALLOWED=NO_UNTIL_RCA_PATHS_ARE_PROVEN"
          } > "$OUT/verification-summary.txt"

      - name: Upload evidence-only finalizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rokas-unified-weather3-finalizer
          path: ${{ runner.temp }}/rokas-unified-weather3-finalizer
          if-no-files-found: error
          retention-days: 90

      - name: Finalizer verdict
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rokas-unified-weather3-finalizer"
          grep -Fxq 'FINAL_TRACKED_CHANGES=0' "$OUT/verification-summary.txt"
          grep -Fxq 'EVIDENCE_FINALIZER=PASS' "$OUT/verification-summary.txt"
          grep -Fxq 'VISUAL_APPROVED_BASELINE_BYTE_IDENTICAL=7/7' "$OUT/test-matrix.txt"
          echo "EVIDENCE_ONLY_FINALIZER=PASS"
