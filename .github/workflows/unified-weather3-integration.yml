name: Unified Weather3 Remaining Gates

on:
  push:
    branches:
      - ci/unified-weather3-integration
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  remaining-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable integration candidate
        uses: actions/checkout@v7
        with:
          ref: af541032cd1dd492d9895c5a9c8e92a1e2342745
          fetch-depth: 0

      - name: Prove exact candidate and snapshot protected refs
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          test "$tested_sha" = "af541032cd1dd492d9895c5a9c8e92a1e2342745"
          test "$tested_tree" = "c0003c877acc637deff0f58dabc94bbb6f0a3214"
          test "$(git rev-parse HEAD^1)" = "8a65c318420e3727aa9de0cc973e6d507362ec6d"
          test "$(git rev-parse HEAD^2)" = "cf97f4ebcb68e6a3a9cf5bf73bab2270654e1c62"
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          test "$project_version" = "6000.3.19f1"
          git fetch origin integration/weather3-candidate integration/rokas-unified development
          test "$(git rev-parse origin/integration/weather3-candidate)" = "$tested_sha"
          test "$(git rev-parse origin/integration/rokas-unified)" = "8a65c318420e3727aa9de0cc973e6d507362ec6d"
          mkdir -p /tmp/unified-remaining
          {
            echo "TESTED_SHA=$tested_sha"
            echo "TESTED_TREE=$tested_tree"
            echo "CI_HEAD=$GITHUB_SHA"
            echo "PROJECT_VERSION=$project_version"
            echo "CANDIDATE_REMOTE=$(git rev-parse origin/integration/weather3-candidate)"
            echo "UNIFIED_REMOTE_BEFORE=$(git rev-parse origin/integration/rokas-unified)"
            echo "DEVELOPMENT_REMOTE_BEFORE=$(git rev-parse origin/development)"
            echo "TRANSITION_GREEN_RUN=34408368570"
            echo "TRANSITION_ARTIFACT=10126332140"
            echo "WEATHER_FINAL_REFERENCE_ARTIFACT=10121663621"
            echo "WEATHER_APPROVED_BASELINE_ARTIFACT=10109251262"
          } | tee /tmp/unified-remaining/exact-tree.txt

      - name: Download already-green transition evidence
        uses: actions/download-artifact@v5
        with:
          name: unified-weather3-transition-diagnostic
          path: /tmp/unified-remaining/transition
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34408368570

      - name: Prove imported transition evidence
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/unified-remaining/transition
          test -f "$root/exact-tree.txt"
          test -f "$root/transition-step-status.txt"
          grep -Fxq 'TESTED_SHA=af541032cd1dd492d9895c5a9c8e92a1e2342745' "$root/exact-tree.txt"
          grep -Fxq 'TESTED_TREE=c0003c877acc637deff0f58dabc94bbb6f0a3214' "$root/exact-tree.txt"
          grep -Fxq 'outcome=success' "$root/transition-step-status.txt"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/unified-remaining/transition')
          xmls=list(root.rglob('*results.xml')) or list(root.rglob('*.xml'))
          if not xmls: raise SystemExit('NO_TRANSITION_XML')
          x=ET.parse(xmls[0]).getroot()
          total=int(x.attrib.get('total',x.attrib.get('testcasecount',0)) or 0)
          passed=int(x.attrib.get('passed',0) or 0)
          failed=int(x.attrib.get('failed',0) or 0)
          skipped=int(x.attrib.get('skipped',0) or 0)
          inc=int(x.attrib.get('inconclusive',0) or 0)
          if (total,passed,failed,skipped,inc)!=(1,1,0,0,0):
              raise SystemExit(f'BAD_TRANSITION_RESULT total={total} passed={passed} failed={failed} skipped={skipped} inconclusive={inc}')
          cases=x.findall('.//test-case')
          expected='Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn'
          if len(cases)!=1 or cases[0].attrib.get('fullname')!=expected or cases[0].attrib.get('result') not in ('Passed','Success'):
              raise SystemExit('TRANSITION_IDENTITY_MISMATCH')
          Path('/tmp/unified-remaining/transition-proof.txt').write_text(f'transition: passed=1 total=1 full={expected}\n')
          PY

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Unified-Weather3-Remaining-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unified-Weather3-Final-${{ runner.os }}-
            Unified-Weather3-Focused-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run exact unified whole-product first-loop
        id: flow
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ROKAS_COMBAT_CAPTURE_DIR: TestResults/UnifiedRuntimeFlow
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-flow
          customParameters: -testFilter Rokas.Tests.FirstLoopTests.IllustratedHomeCanAcceptFightReturnAndClaimExactlyOnce
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unified Whole-Product First Loop

      - name: Preserve and prove unified first-loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unified-remaining/runtime-flow /tmp/unified-remaining/runtime-captures
          sudo cp -a "${{ steps.flow.outputs.artifactsPath }}/." /tmp/unified-remaining/runtime-flow/
          sudo chown -R "$(id -u):$(id -g)" /tmp/unified-remaining/runtime-flow
          test -d TestResults/UnifiedRuntimeFlow
          cp TestResults/UnifiedRuntimeFlow/*.png /tmp/unified-remaining/runtime-captures/
          for f in integration-home.png integration-messages.png integration-combat.png integration-payment.png; do
            test -s "/tmp/unified-remaining/runtime-captures/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/unified-remaining/runtime-flow')
          xmls=list(root.rglob('*results.xml')) or list(root.rglob('*.xml'))
          if not xmls: raise SystemExit('NO_FIRST_LOOP_XML')
          x=ET.parse(xmls[0]).getroot()
          total=int(x.attrib.get('total',x.attrib.get('testcasecount',0)) or 0)
          passed=int(x.attrib.get('passed',0) or 0)
          failed=int(x.attrib.get('failed',0) or 0)
          skipped=int(x.attrib.get('skipped',0) or 0)
          inc=int(x.attrib.get('inconclusive',0) or 0)
          expected='Rokas.Tests.FirstLoopTests.IllustratedHomeCanAcceptFightReturnAndClaimExactlyOnce'
          cases=x.findall('.//test-case')
          if (total,passed,failed,skipped,inc)!=(1,1,0,0,0): raise SystemExit('FIRST_LOOP_NOT_1_OF_1_PASS')
          if len(cases)!=1 or cases[0].attrib.get('fullname')!=expected: raise SystemExit('FIRST_LOOP_IDENTITY_MISMATCH')
          Path('/tmp/unified-remaining/first-loop-summary.txt').write_text(f'first-loop: passed=1 total=1 full={expected}\n')
          PY

      - name: Overlay pinned seven-state Weather visual probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ce9a24ff95a4b8803a6b95137cbc84550565d5b8
          git show ce9a24ff95a4b8803a6b95137cbc84550565d5b8:Tools/CI/HomeWeather3VisualQaPlayModeTests.cs.txt > Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'CaptureWeather3VisualQaMatrix' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'captureCamera.Render' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'RenderTexture.active' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'ReadPixels' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          printf '%s\n' 'VISUAL_PROBE_SOURCE=ce9a24ff95a4b8803a6b95137cbc84550565d5b8:Tools/CI/HomeWeather3VisualQaPlayModeTests.cs.txt' > /tmp/unified-remaining/visual-probe-source.txt

      - name: Capture seven Weather states from exact unified candidate
        id: visual
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-visual
          customParameters: -testFilter Rokas.Tests.HomeWeather3VisualQaPlayModeTests.CaptureWeather3VisualQaMatrix
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unified Weather3 Seven-State Visual

      - name: Preserve seven Weather captures and remove CI-only probe
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/unified-remaining/visual-test /tmp/unified-remaining/weather-captures
          if [ -d "${{ steps.visual.outputs.artifactsPath }}" ]; then
            sudo cp -a "${{ steps.visual.outputs.artifactsPath }}/." /tmp/unified-remaining/visual-test/
            sudo chown -R "$(id -u):$(id -g)" /tmp/unified-remaining/visual-test
          fi
          src=TestResults/HomeWeather3VisualQa
          if [ -d "$src" ]; then
            cp "$src/01-weather3-light-on.png" /tmp/unified-remaining/weather-captures/01-unified-weather3-light-on.png
            cp "$src/02-weather3-light-off.png" /tmp/unified-remaining/weather-captures/02-unified-weather3-light-off.png
            cp "$src/03-weather3-normal-rain.png" /tmp/unified-remaining/weather-captures/03-unified-weather3-normal-rain.png
            cp "$src/04-weather3-wet-glass.png" /tmp/unified-remaining/weather-captures/04-unified-weather3-wet-glass.png
            cp "$src/05-weather3-lightning-on.png" /tmp/unified-remaining/weather-captures/05-unified-weather3-lightning-on.png
            cp "$src/06-weather3-lightning-off.png" /tmp/unified-remaining/weather-captures/06-unified-weather3-lightning-off.png
            cp "$src/07-weather3-idle-depth.png" /tmp/unified-remaining/weather-captures/07-unified-weather3-idle-depth.png
          fi
          sudo rm -f Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs.meta

      - name: Prove seven-state visual test and capture inventory
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            01-unified-weather3-light-on.png \
            02-unified-weather3-light-off.png \
            03-unified-weather3-normal-rain.png \
            04-unified-weather3-wet-glass.png \
            05-unified-weather3-lightning-on.png \
            06-unified-weather3-lightning-off.png \
            07-unified-weather3-idle-depth.png; do
            test -s "/tmp/unified-remaining/weather-captures/$f"
          done
          sha256sum /tmp/unified-remaining/weather-captures/*.png > /tmp/unified-remaining/weather-capture-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/unified-remaining/visual-test')
          xmls=list(root.rglob('*results.xml')) or list(root.rglob('*.xml'))
          if not xmls: raise SystemExit('NO_VISUAL_XML')
          x=ET.parse(xmls[0]).getroot()
          vals=(int(x.attrib.get('total',x.attrib.get('testcasecount',0)) or 0),int(x.attrib.get('passed',0) or 0),int(x.attrib.get('failed',0) or 0),int(x.attrib.get('skipped',0) or 0),int(x.attrib.get('inconclusive',0) or 0))
          if vals!=(1,1,0,0,0): raise SystemExit(f'VISUAL_TEST_NOT_1_OF_1_PASS {vals}')
          Path('/tmp/unified-remaining/visual-summary.txt').write_text('visual: passed=1 total=1 captures=7\n')
          PY

      - name: Aggregate Unity log scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/unified-remaining')
          logs=sorted(set(root.rglob('*.log')) | set(root.rglob('*_RuntimeTestLog.txt')))
          if not logs: raise SystemExit('ZERO_UNITY_LOGS')
          strong=[
            re.compile(r'\bNullReferenceException\b'),
            re.compile(r'\bMissingReferenceException\b'),
            re.compile(r'\bMissingComponentException\b'),
            re.compile(r'\berror CS\d{4}\s*:',re.I),
            re.compile(r'\bScripts have compiler errors\b',re.I),
            re.compile(r'\bCompilation failed\b',re.I),
            re.compile(r'\bUnhandled Exception\b',re.I),
            re.compile(r'\bAborting batchmode due to failure\b',re.I)
          ]
          findings=[]
          for p in logs:
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(rx.search(line) for rx in strong): findings.append(f'{p}:{i}:{line}')
          out=f'UNITY_LOG_FILES_DISCOVERED={len(logs)}\nUNITY_LOG_FILES_SCANNED={len(logs)}\nRELEVANT_ERRORS={len(findings)}\n'
          Path('/tmp/unified-remaining/log-summary.txt').write_text(out+'\n'.join(findings))
          print(out,end='')
          if findings: raise SystemExit('\n'.join(findings))
          PY

      - name: Final exact-tree integrity proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "af541032cd1dd492d9895c5a9c8e92a1e2342745"
          test "$(git rev-parse HEAD^{tree})" = "c0003c877acc637deff0f58dabc94bbb6f0a3214"
          git diff --check | tee /tmp/unified-remaining/final-working-diff-check.txt
          test ! -s /tmp/unified-remaining/final-working-diff-check.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin integration/weather3-candidate integration/rokas-unified development
          test "$(git rev-parse origin/integration/weather3-candidate)" = "af541032cd1dd492d9895c5a9c8e92a1e2342745"
          test "$(git rev-parse origin/integration/rokas-unified)" = "8a65c318420e3727aa9de0cc973e6d507362ec6d"
          {
            echo "CANDIDATE_REMOTE_FINAL=$(git rev-parse origin/integration/weather3-candidate)"
            echo "UNIFIED_REMOTE_FINAL=$(git rev-parse origin/integration/rokas-unified)"
            echo "DEVELOPMENT_REMOTE_FINAL=$(git rev-parse origin/development)"
            echo "WORKTREE_TRACKED_CHANGES=$(git status --porcelain --untracked-files=no | wc -l)"
          } | tee /tmp/unified-remaining/final-integrity.txt

      - name: Upload remaining unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-weather3-remaining-results
          path: /tmp/unified-remaining
          if-no-files-found: error
          retention-days: 14
