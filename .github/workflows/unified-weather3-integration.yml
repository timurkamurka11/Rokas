name: Unified Weather3 Transition Diagnostic

on:
  push:
    branches:
      - ci/unified-weather3-integration
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  transition-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable integration candidate
        uses: actions/checkout@v7
        with:
          ref: af541032cd1dd492d9895c5a9c8e92a1e2342745
          fetch-depth: 0

      - name: Prove exact candidate SHA and tree
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          test "$tested_sha" = "af541032cd1dd492d9895c5a9c8e92a1e2342745"
          test "$tested_tree" = "c0003c877acc637deff0f58dabc94bbb6f0a3214"
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          project_revision="$(sed -n 's/^m_EditorVersionWithRevision: //p' ProjectSettings/ProjectVersion.txt)"
          test "$project_version" = "6000.3.19f1"
          mkdir -p /tmp/unified-weather3-transition-diagnostic
          {
            echo "TESTED_SHA=$tested_sha"
            echo "TESTED_TREE=$tested_tree"
            echo "CI_HEAD=$GITHUB_SHA"
            echo "PROJECT_VERSION=$project_version"
            echo "PROJECT_VERSION_WITH_REVISION=$project_revision"
          } | tee /tmp/unified-weather3-transition-diagnostic/exact-tree.txt

      - name: Overlay unchanged CI-only active-lightning transition probe
        shell: bash
        run: |
          set -euo pipefail
          cat > Assets/Rokas/Tests/PlayMode/UnifiedWeather3IntegrationTransitionPlayModeTests.cs <<'CS'
          using System;
          using System.Collections;
          using System.IO;
          using System.Reflection;
          using NUnit.Framework;
          using Rokas.Core;
          using Rokas.Presentation;
          using UnityEngine;
          using UnityEngine.EventSystems;
          using UnityEngine.TestTools;
          using UnityEngine.UI;
          namespace Rokas.Tests
          {
              public sealed class UnifiedWeather3IntegrationTransitionPlayModeTests
              {
                  private GameObject root; private string directory; private RokasBootstrap boot;
                  [UnityTest]
                  public IEnumerator ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn()
                  {
                      directory=Path.Combine(Path.GetTempPath(),"rokas-unified-weather-transition-"+Guid.NewGuid().ToString("N"));
                      root=new GameObject("UnifiedWeatherTransitionFixture"); boot=root.AddComponent<RokasBootstrap>(); boot.Initialize(directory); yield return null;
                      object effects=typeof(RokasView).GetField("effects",BindingFlags.Instance|BindingFlags.NonPublic)?.GetValue(boot.View); Assert.That(effects,Is.Not.Null);
                      RawImage storm=Find("HomeStormFlash").GetComponent<RawImage>(); GameObject weatherRuntime=Find("HomeWeatherRuntime"); Assert.That(storm,Is.Not.Null); Assert.That(weatherRuntime,Is.Not.Null);
                      effects.GetType().GetMethod("ForceLightning",BindingFlags.Instance|BindingFlags.Public).Invoke(effects,null); boot.View.Tick(.03f); yield return null;
                      Assert.That(storm.color.a,Is.GreaterThan(.001f)); Assert.That(ReadFloat(effects,"thunderCountdown"),Is.GreaterThan(0f));
                      Press("LaptopHotspot"); Press("LaptopContracts"); Press("AcceptContract"); Press("ClosePanel"); Press("DoorHotspot");
                      yield return new WaitForSecondsRealtime(1.6f); Assert.That(boot.Session.State.phase,Is.EqualTo(RunPhase.Portal)); Press("EnterPortal"); yield return new WaitForSecondsRealtime(1.6f); Assert.That(boot.Session.State.phase,Is.EqualTo(RunPhase.Combat));
                      Assert.That(storm.gameObject.activeInHierarchy,Is.False,"Home storm flash must not leak into Combat"); Assert.That(weatherRuntime.activeInHierarchy,Is.False,"Home weather runtime must not remain active in Combat");
                      Assert.That(ReadFloat(effects,"thunderCountdown"),Is.LessThan(0f),"pending Home thunder must be cancelled on transition"); Assert.That(ReadFloat(effects,"lightningAge"),Is.LessThan(0f));
                      for(int i=0;i<80;i++) boot.View.Tick(.05f); Assert.That(ReadFloat(effects,"thunderCountdown"),Is.LessThan(0f),"cancelled thunder must stay cancelled in Combat");
                      for(int i=0;i<200 && boot.Session.State.phase==RunPhase.Combat;i++){boot.Session.Tick(.48f);if(boot.Session.State.phase!=RunPhase.Combat)break;if(boot.Session.Combat.Stage==CombatStage.Ritual)TraceRitual();else if(boot.Session.Combat.Stage==CombatStage.Fighting)TapEnemy();}
                      Assert.That(boot.Session.State.phase,Is.EqualTo(RunPhase.Sealed)); Press("ReturnHome"); yield return new WaitForSecondsRealtime(1.6f); Assert.That(boot.Session.State.phase,Is.EqualTo(RunPhase.Payment));
                      float scheduled=ReadFloat(effects,"nextLightning"); Assert.That(scheduled,Is.GreaterThan(0f),"Home re-entry must receive a normal future lightning schedule"); Assert.That(ReadFloat(effects,"lightningAge"),Is.LessThan(0f)); Assert.That(ReadFloat(effects,"thunderCountdown"),Is.LessThan(0f));
                      boot.View.Tick(.02f); yield return null; Assert.That(storm.color.a,Is.LessThanOrEqualTo(.001f),"re-entry must not force immediate lightning");
                      bool observed=false; for(int i=0;i<700 && !observed;i++){boot.View.Tick(.05f);observed=storm.color.a>.001f;} Assert.That(observed,Is.True,"randomized future lightning must still occur after integrated Combat transition");
                      Assert.That(Count<Camera>("HomeWeatherCamera"),Is.EqualTo(1)); Assert.That(Count<RawImage>("HomeWeatherComposite"),Is.EqualTo(1)); Assert.That(Count<ParticleSystem>("HomeRainFar"),Is.EqualTo(1)); Assert.That(Count<ParticleSystem>("HomeRainMid"),Is.EqualTo(1)); Assert.That(Count<ParticleSystem>("HomeRainNear"),Is.EqualTo(1)); LogAssert.NoUnexpectedReceived();
                  }
                  private float ReadFloat(object o,string name)=>(float)o.GetType().GetField(name,BindingFlags.Instance|BindingFlags.NonPublic).GetValue(o);
                  private GameObject Find(string name){foreach(var t in root.GetComponentsInChildren<Transform>(true))if(t.name==name)return t.gameObject;return null;}
                  private Button FindButton(string name){foreach(var b in root.GetComponentsInChildren<Button>(true))if(b.name==name)return b;return null;}
                  private void Press(string name){var b=FindButton(name);Assert.That(b,Is.Not.Null,name);Assert.That(b.IsInteractable(),Is.True,name);var p=new PointerEventData(EventSystem.current){button=PointerEventData.InputButton.Left};Assert.That(ExecuteEvents.Execute(b.gameObject,p,ExecuteEvents.pointerClickHandler),Is.True,name);}
                  private void TapEnemy(){var target=FindButton("EnemyAttack").gameObject;var p=new PointerEventData(EventSystem.current){button=PointerEventData.InputButton.Left};ExecuteEvents.Execute(target,p,ExecuteEvents.pointerDownHandler);ExecuteEvents.Execute(target,p,ExecuteEvents.pointerUpHandler);}
                  private void TraceRitual(){var target=FindButton("EnemyAttack").gameObject;var p=new PointerEventData(EventSystem.current){button=PointerEventData.InputButton.Left};for(int i=1;i<=3;i++){RectTransform point=null;foreach(var r in root.GetComponentsInChildren<RectTransform>())if(r.name=="RitualPoint"+i)point=r;Assert.That(point,Is.Not.Null);p.position=RectTransformUtility.WorldToScreenPoint(null,point.TransformPoint(point.rect.center));if(i==1)ExecuteEvents.Execute(target,p,ExecuteEvents.pointerDownHandler);else ExecuteEvents.Execute(target,p,ExecuteEvents.dragHandler);}ExecuteEvents.Execute(target,p,ExecuteEvents.pointerUpHandler);}
                  private int Count<T>(string name) where T:Component{int n=0;foreach(var x in root.GetComponentsInChildren<T>(true))if(x.name==name)n++;return n;}
                  [UnityTearDown] public IEnumerator Cleanup(){if(root!=null)UnityEngine.Object.Destroy(root);root=null;yield return null;if(!string.IsNullOrEmpty(directory)&&Directory.Exists(directory))Directory.Delete(directory,true);}
              }
          }
          CS
          grep -q 'class UnifiedWeather3IntegrationTransitionPlayModeTests' Assets/Rokas/Tests/PlayMode/UnifiedWeather3IntegrationTransitionPlayModeTests.cs
          grep -q 'ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn' Assets/Rokas/Tests/PlayMode/UnifiedWeather3IntegrationTransitionPlayModeTests.cs

      - name: Record diagnostic identity and environment
        shell: bash
        run: |
          set -euo pipefail
          dest=/tmp/unified-weather3-transition-diagnostic
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          {
            echo "TESTED_SHA=$(git rev-parse HEAD)"
            echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
            echo "CI_HEAD=$GITHUB_SHA"
            echo "PROJECT_VERSION=$project_version"
            echo "UNITY_VERSION_REQUESTED=auto"
            echo "UNITY_VERSION_ACTUAL=UNOBSERVED_BEFORE_TEST"
            echo "GAMECI_RUNNER_VERSION=0ff419b913a3630032cbe0de48a0099b5a9f0ed9"
            echo "TEST_NAMESPACE=Rokas.Tests"
            echo "TEST_CLASS=UnifiedWeather3IntegrationTransitionPlayModeTests"
            echo "TEST_METHOD=ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn"
            echo "FULL_TEST_NAME=Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn"
            echo "FILTER=Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "PWD=$PWD"
            echo "artifactsPath=artifacts-transition"
            echo "testResults_path=artifacts-transition/TestResults (actual files discovered after run)"
            echo "runtime_log_paths=artifacts-transition/** and known Editor/Player log locations (actual files discovered after run)"
          } | tee "$dest/diagnostic-environment.txt"
          printf '%s\n' 'Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn' > "$dest/test-filter.txt"

      - name: Run single integrated lightning transition diagnostic
        id: transition
        continue-on-error: true
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-transition
          customParameters: -testFilter Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unified Weather3 Transition Diagnostic

      - name: Preserve transition diagnostic evidence
        if: always()
        shell: bash
        env:
          TRANSITION_OUTCOME: ${{ steps.transition.outcome }}
          TRANSITION_CONCLUSION: ${{ steps.transition.conclusion }}
        run: |
          set -u
          dest=/tmp/unified-weather3-transition-diagnostic
          mkdir -p "$dest"
          {
            echo "outcome=${TRANSITION_OUTCOME:-UNAVAILABLE}"
            echo "conclusion=${TRANSITION_CONCLUSION:-UNAVAILABLE}"
          } | tee "$dest/transition-step-status.txt"

          {
            echo "# artifacts-transition"
            if [ -d artifacts-transition ]; then
              sudo find artifacts-transition -maxdepth 12 -type f -print | sort
            else
              echo "ARTIFACTS_TRANSITION_DIRECTORY_MISSING"
            fi
            echo "# TestResults"
            if [ -d TestResults ]; then
              sudo find TestResults -maxdepth 12 -type f -print | sort
            else
              echo "TESTRESULTS_DIRECTORY_MISSING"
            fi
            echo "# relevant repository-local result/log files"
            sudo find . -maxdepth 8 -type f \( -iname '*.xml' -o -iname '*.log' -o -iname '*_RuntimeTestLog.txt' -o -iname '*TestResults*' -o -iname 'Editor*' -o -iname 'Player*' \) \
              -not -path './.git/*' -not -path './Library/*' -not -path './Temp/*' -print 2>/dev/null | sort || true
          } | tee "$dest/transition-files.txt"

          if [ -d artifacts-transition ]; then
            sudo cp -a artifacts-transition "$dest/gameci-artifacts"
          else
            echo "No artifacts-transition directory was produced." > "$dest/no-gameci-artifacts.txt"
          fi
          if [ -d TestResults ]; then
            sudo cp -a TestResults "$dest/repository-TestResults"
          fi

          for p in "$HOME/.config/unity3d/Editor.log" "$HOME/Library/Logs/Unity/Editor.log" /root/.config/unity3d/Editor.log /root/.config/unity3d/Player.log; do
            if sudo test -f "$p"; then
              base="$(basename "$p")"
              sudo cp -a "$p" "$dest/host-$base" || true
            fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$dest" 2>/dev/null || true

          actual=""
          if [ -d "$dest/gameci-artifacts" ]; then
            actual="$(grep -RhoE '6000\.[0-9]+\.[0-9]+f[0-9]+' "$dest/gameci-artifacts" 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$actual" ]; then
            for p in "$dest"/host-Editor.log "$dest"/host-Player.log; do
              if [ -f "$p" ]; then
                actual="$(grep -hoE '6000\.[0-9]+\.[0-9]+f[0-9]+' "$p" 2>/dev/null | head -n 1 || true)"
                [ -n "$actual" ] && break
              fi
            done
          fi
          [ -n "$actual" ] || actual="UNOBSERVED_IN_DURABLE_FILES"
          {
            echo "UNITY_VERSION_ACTUAL=$actual"
            echo "transition_step_outcome=${TRANSITION_OUTCOME:-UNAVAILABLE}"
            echo "transition_step_conclusion=${TRANSITION_CONCLUSION:-UNAVAILABLE}"
          } >> "$dest/diagnostic-environment.txt"

      - name: Upload transition diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-weather3-transition-diagnostic
          path: /tmp/unified-weather3-transition-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: Restore transition diagnostic verdict
        if: always()
        shell: bash
        env:
          TRANSITION_OUTCOME: ${{ steps.transition.outcome }}
        run: |
          set -euo pipefail
          echo "transition outcome=${TRANSITION_OUTCOME:-UNAVAILABLE}"
          if [ "${TRANSITION_OUTCOME:-UNAVAILABLE}" != "success" ]; then
            echo "Transition diagnostic did not succeed; evidence was preserved above."
            exit 1
          fi
