name: Unified Weather3 Remaining Gates

on:
  push:
    branches:
      - ci/unified-weather3-integration
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  remaining-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable integration candidate
        uses: actions/checkout@v7
        with:
          ref: af541032cd1dd492d9895c5a9c8e92a1e2342745
          fetch-depth: 0

      - name: Prove exact candidate and snapshot protected refs
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          test "$tested_sha" = "af541032cd1dd492d9895c5a9c8e92a1e2342745"
          test "$tested_tree" = "c0003c877acc637deff0f58dabc94bbb6f0a3214"
          test "$(git rev-parse HEAD^1)" = "8a65c318420e3727aa9de0cc973e6d507362ec6d"
          test "$(git rev-parse HEAD^2)" = "cf97f4ebcb68e6a3a9cf5bf73bab2270654e1c62"
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          test "$project_version" = "6000.3.19f1"
          git fetch origin integration/weather3-candidate integration/rokas-unified development
          test "$(git rev-parse origin/integration/weather3-candidate)" = "$tested_sha"
          mkdir -p /tmp/unified-remaining
          {
            echo "TESTED_SHA=$tested_sha"
            echo "TESTED_TREE=$tested_tree"
            echo "CI_HEAD=$GITHUB_SHA"
            echo "PROJECT_VERSION=$project_version"
            echo "CANDIDATE_REMOTE=$(git rev-parse origin/integration/weather3-candidate)"
            echo "UNIFIED_REMOTE_BEFORE=$(git rev-parse origin/integration/rokas-unified)"
            echo "DEVELOPMENT_REMOTE_BEFORE=$(git rev-parse origin/development)"
            echo "TRANSITION_GREEN_RUN=34408368570"
            echo "TRANSITION_ARTIFACT=10126332140"
            echo "FIRST_LOOP_GREEN_RUN=34409767129"
            echo "FIRST_LOOP_EVIDENCE_ARTIFACT=10126843273"
            echo "WEATHER_FINAL_REFERENCE_ARTIFACT=10121663621"
            echo "WEATHER_APPROVED_BASELINE_ARTIFACT=10109251262"
          } | tee /tmp/unified-remaining/exact-tree.txt

      - name: Download already-green transition and first-loop evidence
        uses: actions/download-artifact@v5
        with:
          name: unified-weather3-remaining-results
          path: /tmp/imported-green
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34409767129

      - name: Prove imported transition and first-loop evidence
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/imported-green
          test -f "$root/exact-tree.txt"
          grep -Fxq 'TESTED_SHA=af541032cd1dd492d9895c5a9c8e92a1e2342745' "$root/exact-tree.txt"
          grep -Fxq 'TESTED_TREE=c0003c877acc637deff0f58dabc94bbb6f0a3214' "$root/exact-tree.txt"
          test -f "$root/transition/transition-step-status.txt"
          grep -Fxq 'outcome=success' "$root/transition/transition-step-status.txt"
          python3 - <<'PY'
          from pathlib import Path
          import shutil, xml.etree.ElementTree as ET
          root=Path('/tmp/imported-green')
          out=Path('/tmp/unified-remaining')

          transition_xml=root/'transition/gameci-artifacts/playmode-results.xml'
          if not transition_xml.exists(): raise SystemExit('NO_TRANSITION_XML')
          x=ET.parse(transition_xml).getroot()
          vals=tuple(int(x.attrib.get(k,0) or 0) for k in ('total','passed','failed','skipped','inconclusive'))
          expected='Rokas.Tests.UnifiedWeather3IntegrationTransitionPlayModeTests.ActiveLightningCombatTransitionCleansUpAndReschedulesAfterReturn'
          cases=x.findall('.//test-case')
          if vals!=(1,1,0,0,0): raise SystemExit(f'BAD_TRANSITION_RESULT {vals}')
          if len(cases)!=1 or cases[0].attrib.get('fullname')!=expected or cases[0].attrib.get('result') not in ('Passed','Success'):
              raise SystemExit('TRANSITION_IDENTITY_MISMATCH')
          (out/'transition-proof.txt').write_text(f'transition: passed=1 total=1 full={expected}\n')
          shutil.copytree(root/'transition', out/'transition', dirs_exist_ok=True)

          flow_xml=root/'runtime-flow/playmode-results.xml'
          if not flow_xml.exists(): raise SystemExit('NO_FIRST_LOOP_XML')
          x=ET.parse(flow_xml).getroot()
          vals=tuple(int(x.attrib.get(k,0) or 0) for k in ('total','passed','failed','skipped','inconclusive'))
          expected='Rokas.Tests.FirstLoopTests.IllustratedHomeCanAcceptFightReturnAndClaimExactlyOnce'
          cases=x.findall('.//test-case')
          if vals!=(1,1,0,0,0): raise SystemExit(f'BAD_FIRST_LOOP_RESULT {vals}')
          if len(cases)!=1 or cases[0].attrib.get('fullname')!=expected or cases[0].attrib.get('result') not in ('Passed','Success'):
              raise SystemExit('FIRST_LOOP_IDENTITY_MISMATCH')
          (out/'first-loop-summary.txt').write_text(f'first-loop: passed=1 total=1 full={expected}\n')
          shutil.copytree(root/'runtime-flow', out/'runtime-flow', dirs_exist_ok=True)
          PY

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Unified-Weather3-Remaining-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unified-Weather3-Final-${{ runner.os }}-
            Unified-Weather3-Focused-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Overlay pinned seven-state Weather visual probe
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ce9a24ff95a4b8803a6b95137cbc84550565d5b8
          git show ce9a24ff95a4b8803a6b95137cbc84550565d5b8:Tools/CI/HomeWeather3VisualQaPlayModeTests.cs.txt > Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'CaptureWeather3VisualQaMatrix' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'TestResults.*HomeWeather3VisualQa' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'captureCamera.Render' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'RenderTexture.active' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'ReadPixels' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          printf '%s\n' 'VISUAL_PROBE_SOURCE=ce9a24ff95a4b8803a6b95137cbc84550565d5b8:Tools/CI/HomeWeather3VisualQaPlayModeTests.cs.txt' > /tmp/unified-remaining/visual-probe-source.txt

      - name: Capture seven Weather states from exact unified candidate
        id: visual
        continue-on-error: true
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-visual
          customParameters: -testFilter Rokas.Tests.HomeWeather3VisualQaPlayModeTests.CaptureWeather3VisualQaMatrix
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unified Weather3 Seven-State Visual

      - name: Record visual step status
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/unified-remaining
          {
            echo "outcome=${{ steps.visual.outcome }}"
            echo "conclusion=${{ steps.visual.conclusion }}"
            echo "overlay_outcome=${{ steps.overlay.outcome }}"
          } | tee /tmp/unified-remaining/visual-step-status.txt

      - name: Preserve seven Weather captures and remove CI-only probe
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/unified-remaining/visual-test /tmp/unified-remaining/weather-captures
          if [ -n "${{ steps.visual.outputs.artifactsPath }}" ] && [ -d "${{ steps.visual.outputs.artifactsPath }}" ]; then
            sudo cp -a "${{ steps.visual.outputs.artifactsPath }}/." /tmp/unified-remaining/visual-test/
            sudo chown -R "$(id -u):$(id -g)" /tmp/unified-remaining/visual-test
          fi
          src=TestResults/HomeWeather3VisualQa
          if [ -d "$src" ]; then
            [ -f "$src/01-weather3-light-on.png" ] && cp "$src/01-weather3-light-on.png" /tmp/unified-remaining/weather-captures/01-unified-weather3-light-on.png
            [ -f "$src/02-weather3-light-off.png" ] && cp "$src/02-weather3-light-off.png" /tmp/unified-remaining/weather-captures/02-unified-weather3-light-off.png
            [ -f "$src/03-weather3-normal-rain.png" ] && cp "$src/03-weather3-normal-rain.png" /tmp/unified-remaining/weather-captures/03-unified-weather3-normal-rain.png
            [ -f "$src/04-weather3-wet-glass.png" ] && cp "$src/04-weather3-wet-glass.png" /tmp/unified-remaining/weather-captures/04-unified-weather3-wet-glass.png
            [ -f "$src/05-weather3-lightning-on.png" ] && cp "$src/05-weather3-lightning-on.png" /tmp/unified-remaining/weather-captures/05-unified-weather3-lightning-on.png
            [ -f "$src/06-weather3-lightning-off.png" ] && cp "$src/06-weather3-lightning-off.png" /tmp/unified-remaining/weather-captures/06-unified-weather3-lightning-off.png
            [ -f "$src/07-weather3-idle-depth.png" ] && cp "$src/07-weather3-idle-depth.png" /tmp/unified-remaining/weather-captures/07-unified-weather3-idle-depth.png
          fi
          sudo rm -f Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs.meta
          find /tmp/unified-remaining -maxdepth 3 -type f -printf '%P\n' | sort > /tmp/unified-remaining/remaining-files.txt

      - name: Analyze seven-state visual evidence
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, xml.etree.ElementTree as ET
          root=Path('/tmp/unified-remaining')
          expected_files=[
            '01-unified-weather3-light-on.png',
            '02-unified-weather3-light-off.png',
            '03-unified-weather3-normal-rain.png',
            '04-unified-weather3-wet-glass.png',
            '05-unified-weather3-lightning-on.png',
            '06-unified-weather3-lightning-off.png',
            '07-unified-weather3-idle-depth.png',
          ]
          captures=root/'weather-captures'
          missing=[f for f in expected_files if not (captures/f).is_file() or (captures/f).stat().st_size==0]
          xmls=list((root/'visual-test').rglob('*results.xml')) or list((root/'visual-test').rglob('*.xml'))
          problems=[]
          if missing: problems.append('missing captures: '+', '.join(missing))
          if not xmls:
              problems.append('no visual XML')
          else:
              x=ET.parse(xmls[0]).getroot()
              vals=tuple(int(x.attrib.get(k,0) or 0) for k in ('total','passed','failed','skipped','inconclusive'))
              expected='Rokas.Tests.HomeWeather3VisualQaPlayModeTests.CaptureWeather3VisualQaMatrix'
              cases=x.findall('.//test-case')
              if vals!=(1,1,0,0,0): problems.append(f'visual result {vals}')
              if len(cases)!=1 or cases[0].attrib.get('fullname')!=expected or cases[0].attrib.get('result') not in ('Passed','Success'):
                  problems.append('visual identity/result mismatch')
          if not missing:
              with (root/'weather-capture-sha256.txt').open('w') as fh:
                  for f in expected_files:
                      p=captures/f
                      fh.write(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {f}\n')
          status='PASS' if not problems else 'FAIL'
          (root/'visual-summary.txt').write_text('VISUAL_PROOF='+status+'\nCAPTURES_PRESENT='+str(7-len(missing))+'\n'+'\n'.join(problems)+'\n')
          print((root/'visual-summary.txt').read_text())
          PY
          exit 0

      - name: Aggregate Unity log scan
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/unified-remaining')
          logs=sorted(set(root.rglob('*.log')) | set(root.rglob('*_RuntimeTestLog.txt')))
          strong=[
            re.compile(r'\bNullReferenceException\b'),
            re.compile(r'\bMissingReferenceException\b'),
            re.compile(r'\bMissingComponentException\b'),
            re.compile(r'\berror CS\d{4}\s*:',re.I),
            re.compile(r'\bScripts have compiler errors\b',re.I),
            re.compile(r'\bCompilation failed\b',re.I),
            re.compile(r'\bUnhandled Exception\b',re.I),
            re.compile(r'\bAborting batchmode due to failure\b',re.I)
          ]
          findings=[]
          for p in logs:
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(rx.search(line) for rx in strong): findings.append(f'{p}:{i}:{line}')
          out=f'UNITY_LOG_FILES_DISCOVERED={len(logs)}\nUNITY_LOG_FILES_SCANNED={len(logs)}\nRELEVANT_ERRORS={len(findings)}\n'
          (root/'log-summary.txt').write_text(out+'\n'.join(findings))
          print(out,end='')
          PY
          exit 0

      - name: Final exact-tree integrity proof
        if: always()
        shell: bash
        run: |
          set +e
          status=PASS
          current_sha="$(git rev-parse HEAD 2>/dev/null)"
          current_tree="$(git rev-parse HEAD^{tree} 2>/dev/null)"
          [ "$current_sha" = "af541032cd1dd492d9895c5a9c8e92a1e2342745" ] || status=FAIL
          [ "$current_tree" = "c0003c877acc637deff0f58dabc94bbb6f0a3214" ] || status=FAIL
          git diff --check > /tmp/unified-remaining/final-working-diff-check.txt 2>&1 || status=FAIL
          [ -z "$(git status --porcelain --untracked-files=no)" ] || status=FAIL
          git fetch origin integration/weather3-candidate integration/rokas-unified development >/tmp/unified-remaining/final-fetch.txt 2>&1 || status=FAIL
          candidate_final="$(git rev-parse origin/integration/weather3-candidate 2>/dev/null)"
          unified_final="$(git rev-parse origin/integration/rokas-unified 2>/dev/null)"
          development_final="$(git rev-parse origin/development 2>/dev/null)"
          unified_before="$(sed -n 's/^UNIFIED_REMOTE_BEFORE=//p' /tmp/unified-remaining/exact-tree.txt)"
          development_before="$(sed -n 's/^DEVELOPMENT_REMOTE_BEFORE=//p' /tmp/unified-remaining/exact-tree.txt)"
          [ "$candidate_final" = "af541032cd1dd492d9895c5a9c8e92a1e2342745" ] || status=FAIL
          [ "$unified_final" = "$unified_before" ] || status=FAIL
          [ "$development_final" = "$development_before" ] || status=FAIL
          {
            echo "INTEGRITY=$status"
            echo "CURRENT_SHA=$current_sha"
            echo "CURRENT_TREE=$current_tree"
            echo "CANDIDATE_REMOTE_FINAL=$candidate_final"
            echo "UNIFIED_REMOTE_FINAL=$unified_final"
            echo "DEVELOPMENT_REMOTE_FINAL=$development_final"
            echo "TRACKED_CHANGES=$(git status --porcelain --untracked-files=no | wc -l)"
          } | tee /tmp/unified-remaining/final-integrity.txt
          exit 0

      - name: Upload remaining unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-weather3-remaining-results
          path: /tmp/unified-remaining
          if-no-files-found: error
          retention-days: 14

      - name: Final remaining-gates verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.overlay.outcome }}" = "success"
          test "${{ steps.visual.outcome }}" = "success"
          grep -Fxq 'VISUAL_PROOF=PASS' /tmp/unified-remaining/visual-summary.txt
          grep -Fxq 'CAPTURES_PRESENT=7' /tmp/unified-remaining/visual-summary.txt
          grep -Fxq 'RELEVANT_ERRORS=0' /tmp/unified-remaining/log-summary.txt
          grep -Eq '^UNITY_LOG_FILES_DISCOVERED=[1-9][0-9]*$' /tmp/unified-remaining/log-summary.txt
          grep -Eq '^UNITY_LOG_FILES_SCANNED=[1-9][0-9]*$' /tmp/unified-remaining/log-summary.txt
          grep -Fxq 'INTEGRITY=PASS' /tmp/unified-remaining/final-integrity.txt
          echo 'REMAINING_GATES=PASS'
