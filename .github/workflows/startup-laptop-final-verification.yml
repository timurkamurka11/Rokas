name: ROKAS Startup Laptop Final Verification

on:
  push:
    branches:
      - ci/startup-laptop-final-verification
    paths:
      - .github/workflows/startup-laptop-final-verification.yml

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: startup-laptop-final-verification
  cancel-in-progress: true

env:
  CANDIDATE_SHA: a2f3cccfe7f2f6c33f42570e6d0392982f816ff2
  CANDIDATE_TREE: 4dbc13e8f8b00df9a525173bc089b9f1df1a9786
  BASE_SHA: 3d7b6db8adb551acd64f89694759e5d8a16c0ff1

jobs:
  integrity:
    name: Exact tree, media, validator and scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --short --untracked-files=all)"
          git diff --check "$BASE_SHA"...HEAD
          git diff --name-status "$BASE_SHA"...HEAD > final-diff-name-status.txt
          git diff --stat "$BASE_SHA"...HEAD > final-diff-stat.txt
          git status --short --untracked-files=all > final-status.txt
          git rev-parse HEAD > final-head.txt
          git rev-parse HEAD^{tree} > final-tree.txt

      - name: Verify exact approved media integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Assets/Rokas/Resources/StartupSkipHint.png | awk '{print $1}')" = "3f08890f80449509af26a1482a388452f5aa6590c88840f1cb55e993b7a466df"
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/StartupPreview.mp4 | awk '{print $1}')" = "28417ed9f1d6d12b1283e7ccb80c72fc910e8d326533a554245734efa3a2f240"
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4 | awk '{print $1}')" = "111036b0768a6be45202ae674c7815d9e78760e852ef28426255501a3717fa9a"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('Assets/Rokas/Resources/StartupSkipHint.png')
          b=p.read_bytes()[:33]
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          width,height,bit_depth,color_type,compression,filter_method,interlace = struct.unpack('>IIBBBBB', b[16:29])
          print(f'PNG width={width} height={height} bit_depth={bit_depth} color_type={color_type}')
          assert (width,height)==(2048,682)
          assert color_type==6, 'PNG must be RGBA (color type 6)'
          PY

      - name: Prove startup any-key and cleanup source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs').read_text()
          required={
            'guard':'!active || !firstFramePresented || player == null || !player.isPlaying',
            'anykey':'Input.anyKeyDown',
            'initial_hidden':'skipHintOverlay.SetActive(false)',
            'frame_visible':'skipHintOverlay.SetActive(true)',
            'finish_guard':'if (!active) return;',
            'release_rt':'temporaryRenderTexture.Release()',
            'destroy_rt':'Destroy(temporaryRenderTexture)',
          }
          missing=[name for name,needle in required.items() if needle not in text]
          if missing:
              raise SystemExit('Missing source contracts: ' + ', '.join(missing))
          print('STARTUP_SOURCE_CONTRACT=PASS')
          for name in required: print(name + '=YES')
          PY

      - name: Prove temporary real-player diagnostics are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/home-visit-real-player-diagnostic.yml
          test ! -e Assets/Rokas/Scripts/Presentation/RokasHomeVisitRuntimeProbe.cs
          test ! -e Assets/Rokas/Scripts/Presentation/RokasHomeVisitRuntimeProbe.cs.meta
          if git grep -n -- '-rokasHomeVisitSmoke'; then
            echo 'Temporary -rokasHomeVisitSmoke plumbing still exists.' >&2
            exit 1
          fi
          echo 'TEMP_DIAGNOSTIC=ABSENT'

      - name: Compare validator baseline and candidate factually
        shell: bash
        run: |
          set -uo pipefail
          python3 Tools/validate_assets.py > candidate-validator.txt 2>&1
          candidate_rc=$?
          base_dir="$RUNNER_TEMP/rokas-validator-base"
          rm -rf "$base_dir"
          git worktree add --detach "$base_dir" "$BASE_SHA" >/dev/null
          (cd "$base_dir" && python3 Tools/validate_assets.py > "$GITHUB_WORKSPACE/base-validator.txt" 2>&1)
          base_rc=$?
          python3 - <<'PY'
          from pathlib import Path
          def findings(path):
              return [x.strip() for x in Path(path).read_text(errors='replace').splitlines() if x.startswith('FAIL: ')]
          base=findings('base-validator.txt')
          cand=findings('candidate-validator.txt')
          existing=sorted(set(cand)&set(base))
          new=sorted(set(cand)-set(base))
          resolved=sorted(set(base)-set(cand))
          with open('validator-summary.txt','w') as f:
              f.write(f'TOTAL_CURRENT_FINDINGS={len(cand)}\n')
              f.write(f'HISTORICAL_EXISTING_FINDINGS={len(existing)}\n')
              f.write(f'NEW_RELEVANT_FINDINGS={len(new)}\n')
              f.write(f'RESOLVED_BASELINE_FINDINGS={len(resolved)}\n')
              if new:
                  f.write('NEW:\n'+'\n'.join(new)+'\n')
          print(Path('validator-summary.txt').read_text(), end='')
          if new:
              raise SystemExit('Candidate introduced new validator findings.')
          PY
          summary_rc=$?
          git worktree remove --force "$base_dir" >/dev/null 2>&1 || true
          echo "candidate_validator_exit=$candidate_rc" >> validator-summary.txt
          echo "base_validator_exit=$base_rc" >> validator-summary.txt
          exit $summary_rc

      - name: Preserve integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-laptop-final-integrity
          path: |
            final-diff-name-status.txt
            final-diff-stat.txt
            final-status.txt
            final-head.txt
            final-tree.txt
            candidate-validator.txt
            base-validator.txt
            validator-summary.txt
          if-no-files-found: error

  semantic-home-visit:
    name: Home visit semantic suite 8/8
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
      - uses: actions/cache@v6
        with:
          path: Library
          key: StartupLaptopFinalSemantic-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StartupHintLaptopVisit-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run exact 8-test semantic suite
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupSkipHintLaptopHomeVisitPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Startup Laptop Final Semantic
      - name: Require 8/8
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('artifacts/playmode-results.xml').getroot()
          got=tuple(int(root.attrib.get(k,'-1')) for k in ('total','passed','failed','skipped'))
          print('SEMANTIC_XML total=%d passed=%d failed=%d skipped=%d' % got)
          assert got==(8,8,0,0), got
          PY
      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-laptop-final-semantic
          path: artifacts/playmode-results.xml
          if-no-files-found: error

  full-lifecycle:
    name: Full contract lifecycle 1/1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
      - uses: actions/cache@v6
        with:
          path: Library
          key: StartupLaptopFinalLifecycle-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StartupHintLaptopVisit-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run exact full lifecycle
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.LaptopFullContractLifecyclePlayModeTests.FullContractLifecycleBootsLaptopExactlyOncePerPhysicalHomeVisit
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Startup Laptop Final Lifecycle
      - name: Require 1/1
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('artifacts/playmode-results.xml').getroot()
          got=tuple(int(root.attrib.get(k,'-1')) for k in ('total','passed','failed','skipped'))
          print('LIFECYCLE_XML total=%d passed=%d failed=%d skipped=%d' % got)
          assert got==(1,1,0,0), got
          PY
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-laptop-final-lifecycle
          path: artifacts/playmode-results.xml
          if-no-files-found: error

