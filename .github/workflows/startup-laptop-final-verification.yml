name: ROKAS Startup Laptop Final Verification

on:
  push:
    branches:
      - ci/startup-laptop-final-verification
    paths:
      - .github/workflows/startup-laptop-final-verification.yml

permissions:
  contents: read
  checks: write

concurrency:
  group: startup-laptop-final-verification
  cancel-in-progress: true

jobs:
  legacy-green:
    name: Verify migrated laptop cancellation regression GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact migrated feature tree
        uses: actions/checkout@v7
        with:
          ref: a2f3cccfe7f2f6c33f42570e6d0392982f816ff2
          fetch-depth: 0

      - name: Assert exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a2f3cccfe7f2f6c33f42570e6d0392982f816ff2"
          test "$(git rev-parse HEAD^{tree})" = "4dbc13e8f8b00df9a525173bc089b9f1df1a9786"
          test -z "$(git status --short --untracked-files=all)"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: StartupLaptopLegacyGreen-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StartupLaptopLegacyRed-${{ runner.os }}-
            StartupHintLaptopVisit-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Hide laptop media for deterministic semantic seam
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4
          mv Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4 Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4.legacy-green-hidden

      - name: Run exact migrated cancellation regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupLaptopVideoPlayModeTests.ClosingLaptopDuringBootCancelsWithoutDesktopAndReopenIsReady
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Startup Laptop Legacy GREEN

      - name: Prove migrated regression is GREEN
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/playmode-results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='artifacts/playmode-results.xml'
          root=ET.parse(p).getroot()
          total=int(root.attrib.get('total','-1'))
          passed=int(root.attrib.get('passed','-1'))
          failed=int(root.attrib.get('failed','-1'))
          skipped=int(root.attrib.get('skipped','-1'))
          cases=list(root.iter('test-case'))
          print(f'LEGACY_GREEN_XML total={total} passed={passed} failed={failed} skipped={skipped}')
          if (total,passed,failed,skipped)!=(1,1,0,0):
              raise SystemExit('Expected exactly 1 total / 1 pass / 0 fail / 0 skip')
          if len(cases)!=1:
              raise SystemExit(f'Expected exactly one test case, got {len(cases)}')
          expected='Rokas.Tests.StartupLaptopVideoPlayModeTests.ClosingLaptopDuringBootCancelsWithoutDesktopAndReopenIsReady'
          actual=cases[0].attrib.get('fullname') or ''
          if actual != expected:
              raise SystemExit(f'Unexpected test selected: {actual!r}')
          if cases[0].attrib.get('result') != 'Passed':
              raise SystemExit(f'Unexpected result: {cases[0].attrib.get("result")!r}')
          print('MIGRATED_LEGACY_GREEN=YES')
          PY

      - name: Restore laptop media
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4.legacy-green-hidden ]; then
            mv Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4.legacy-green-hidden Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4
          fi
          test -f Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4

      - name: Preserve GREEN evidence
        if: always()
        shell: bash
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git status --short --untracked-files=all > verification/status.txt
          cp artifacts/playmode-results.xml verification/playmode-results.xml

      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-laptop-legacy-green-evidence
          path: verification
          if-no-files-found: error
