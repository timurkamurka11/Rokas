name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client endpoint
        shell: bash
        run: |
          set -euo pipefail
          SHARE='https://firestorage.ai/ja/f/qPkPobRsL331'
          curl -LfsS "$SHARE" -o share.html
          python3 - <<'PY' > js_path.txt
          import re
          s=open('share.html','r',encoding='utf-8',errors='replace').read()
          hits=re.findall(r'src="([^"]*?/\(files\)/ja/f/page-[^"]+?\.js)"',s)
          if not hits:
              hits=re.findall(r'src="([^"]*?page-[^"]+?\.js)"',s)
          if not hits:
              raise SystemExit('page JS not found')
          print(hits[-1])
          PY
          JS_PATH="$(cat js_path.txt)"
          case "$JS_PATH" in
            http*) JS_URL="$JS_PATH" ;;
            *) JS_URL="https://firestorage.ai$JS_PATH" ;;
          esac
          echo "JS_URL=$JS_URL"
          curl -LfsS "$JS_URL" -o page.js
          echo "JS_BYTES=$(wc -c < page.js)"
          python3 - <<'PY'
          import re
          s=open('page.js','r',encoding='utf-8',errors='replace').read()
          terms=['download','presign','signed','share','files','file','objects','object','api/','publicId','shareId','folder','metadata']
          print('=== CANDIDATE STRING LITERALS ===')
          strings=re.findall(r'["\']([^"\']{3,500})["\']',s)
          seen=set()
          for x in strings:
              low=x.lower()
              if any(t.lower() in low for t in terms):
                  if x not in seen:
                      seen.add(x)
                      print(x[:500])
          print('=== CONTEXT WINDOWS ===')
          for term in ['download','presign','publicId','shareId','/api/','files/']:
              start=0
              shown=0
              while shown<12:
                  i=s.lower().find(term.lower(),start)
                  if i<0: break
                  print('\n--',term,i,'--')
                  print(s[max(0,i-350):min(len(s),i+650)])
                  start=i+len(term)
                  shown+=1
          PY
