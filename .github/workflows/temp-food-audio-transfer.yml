name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct firestorage object download
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          OBJECT='Y1nNhrTvvwB3Iayc'
          SUBDIR='AO9yWG'
          BASE="$API/objects/$OBJECT/$SUBDIR"
          curl -fsS "$BASE/files?maxResults=1000" -o files.json
          cat files.json
          FILE_ID="$(python3 - <<'PY'
          import json
          j=json.load(open('files.json'))
          fs=j.get('files') or []
          if len(fs)!=1: raise SystemExit(f'expected 1 file, got {len(fs)}')
          print(fs[0]['fileId'])
          PY
          )"
          echo "FILE_ID=$FILE_ID"
          curl -fsS -X POST "$BASE/files/$FILE_ID/download" -o download.json
          cat download.json
          echo
          DL_URL="$(python3 - <<'PY'
          import json
          j=json.load(open('download.json'))
          print(j['downloadUrl'])
          PY
          )"
          curl -LfsS "$DL_URL" -o patch.zip
          file patch.zip
          wc -c patch.zip
          sha256sum patch.zip
          test "$(sha256sum patch.zip | awk '{print $1}')" = 'f0229e6429ac67695e89811c91520b3677a25e463a664d67fbb086f492c18760'
          echo 'PATCH_SHA_OK=YES'
