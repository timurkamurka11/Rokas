name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cushion redirect path
        shell: bash
        run: |
          set -euo pipefail
          URL='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          curl -LfsS "$URL" -o page.js
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('page.js').read_text(encoding='utf-8',errors='replace')
          for needle in ['async function eD','cushionId','const w=','let w=','w=/','const g=','let g=','g=/']:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print('\n===',needle,i,'===')
                  print(s[max(0,i-1000):min(len(s),i+3500)])
                  start=i+len(needle)
          PY
