name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve firestorage cushion session
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file'
          SHARE='qPkPobRsL331'
          echo '=== CREATE CUSHION ==='
          curl -sS -D cushion_headers.txt \
            -H 'Content-Type: application/json' \
            -X POST "$API/shares/$SHARE/cushion-sessions" \
            --data '{"password":null}' \
            -o cushion.json
          cat cushion_headers.txt
          cat cushion.json
          echo
          python3 - <<'PY'
          import json
          try:
              j=json.load(open('cushion.json'))
          except Exception:
              raise SystemExit(0)
          print('KEYS',sorted(j.keys()))
          for k,v in j.items():
              if isinstance(v,(str,int,float,bool)) or v is None:
                  print(k,repr(v))
          PY
