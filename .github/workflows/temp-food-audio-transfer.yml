name: Temporary food/audio transfer probe
on:
  push:
    branches: [food-audio-transfer-temp]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Apply verified patch and push development
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          API='https://api.firestorage.ai/dev/file/objects/Y1nNhrTvvwB3Iayc/AO9yWG'
          FILE_ID='01a07ba388d47233b718ed82ee73c6f5'
          ZIP_SHA='f0229e6429ac67695e89811c91520b3677a25e463a664d67fbb086f492c18760'
          curl -fsS -X POST "$API/files/$FILE_ID/download" -o download.json
          URL="$(python3 -c 'import json; print(json.load(open("download.json"))["downloadUrl"])')"
          curl -LfsS "$URL" -o patch.zip
          test "$(sha256sum patch.zip | awk '{print $1}')" = "$ZIP_SHA"
          mkdir patch_stage
          unzip -q patch.zip -d patch_stage
          (cd patch_stage && sha256sum -c SHA256SUMS.txt)
          cp patch_stage/Assets/Rokas/Audio/UIWood.wav Assets/Rokas/Audio/UIWood.wav
          for f in TravelerOnigiri SpicyMiso HunterTempura MoonMochi GreenTea; do
            cp "patch_stage/Assets/Rokas/Resources/Food/Details/$f.png" "Assets/Rokas/Resources/Food/Details/$f.png"
          done
          rm -rf patch_stage patch.zip download.json
          git status --short
          git diff --check
          git diff --stat
          EXPECTED="$(printf '%s\n' \
            Assets/Rokas/Audio/UIWood.wav \
            Assets/Rokas/Resources/Food/Details/GreenTea.png \
            Assets/Rokas/Resources/Food/Details/HunterTempura.png \
            Assets/Rokas/Resources/Food/Details/MoonMochi.png \
            Assets/Rokas/Resources/Food/Details/SpicyMiso.png \
            Assets/Rokas/Resources/Food/Details/TravelerOnigiri.png | sort)"
          ACTUAL="$(git diff --name-only | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git fetch origin development
          test "$(git rev-parse origin/development)" = "$BASE_HEAD"
          git config user.name 'timurkamurka11'
          git config user.email 'timur2417@gmail.com'
          git add $EXPECTED
          git commit -m 'fix: replace YOMI food details and UI click'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:development
          echo 'PUSHED_DEVELOPMENT=YES'
