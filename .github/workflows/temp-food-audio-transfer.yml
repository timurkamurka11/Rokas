name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve firestorage file API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          curl -LfsS "$URL" -o page.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('page.js').read_text(encoding='utf-8',errors='replace')
          i=s.find('async function v()')
          print('V_INDEX',i)
          print('=== BEFORE_V ===')
          print(s[max(0,i-5000):i+1200])
          print('=== ABSOLUTE_URLS ===')
          for u in sorted(set(re.findall(r'https?://[^"\'` ]+',s))):
              print(u[:1000])
          print('=== APIISH_LITERALS ===')
          for x in sorted(set(re.findall(r'["\'`]([^"\'`]{2,300})["\'`]',s))):
              low=x.lower()
              if any(k in low for k in ['/api','api.','shares/','/shares','files/','/files','download','presign']):
                  print(x[:500])
          PY
