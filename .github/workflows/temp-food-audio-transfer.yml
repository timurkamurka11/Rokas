name: Temporary food/audio transfer probe

on:
  push:
    branches:
      - food-audio-transfer-temp

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client chunks
        shell: bash
        run: |
          set -euo pipefail
          SHARE='https://firestorage.ai/ja/f/qPkPobRsL331'
          curl -LfsS "$SHARE" -o share.html
          python3 - <<'PY'
          import re, subprocess, pathlib
          base='https://firestorage.ai'
          html=pathlib.Path('share.html').read_text(encoding='utf-8',errors='replace')
          scripts=re.findall(r'<script[^>]+src="([^"]+\.js)"',html)
          print('SCRIPT_COUNT',len(scripts))
          for n,p in enumerate(scripts):
              url=p if p.startswith('http') else base+p
              out=f'script_{n}.js'
              try:
                  subprocess.run(['curl','-LfsS',url,'-o',out],check=True)
              except Exception as e:
                  print('FETCH_FAIL',url,e); continue
              s=pathlib.Path(out).read_text(encoding='utf-8',errors='replace')
              if '(files)/ja/f/page-' in p or any(t in s.lower() for t in ['download','presign','shareid','publicid','/api/']):
                  print('\n=== SCRIPT',n,url,'BYTES',len(s),'===')
                  if len(s)<2000:
                      print(s)
                  for term in ['download','presign','shareId','publicId','/api/','api/','objects','files']:
                      start=0; shown=0
                      while shown<8:
                          i=s.lower().find(term.lower(),start)
                          if i<0: break
                          print('\n--',term,i,'--')
                          print(s[max(0,i-260):min(len(s),i+560)])
                          start=i+len(term); shown+=1
          PY
