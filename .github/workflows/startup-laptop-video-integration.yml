name: ROKAS Startup Laptop Video Integration

on:
  push:
    branches:
      - feature/startup-laptop-video-integration

permissions:
  contents: read
  checks: write

concurrency:
  group: startup-laptop-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-playmode:
    name: Focused Startup/Laptop Video PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: StartupLaptopVideo-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StartupLaptopVideo-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run focused PlayMode tests
        id: focused
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          customParameters: -testFilter Rokas.Tests.StartupLaptopVideoPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Startup Laptop Video Focused Tests

      - name: Preserve post-test git state
        if: always()
        shell: bash
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git status --short --untracked-files=all > verification/git-status.txt
          git diff --check > verification/git-diff-check.txt || true
          git diff > verification/git-diff.txt

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-laptop-video-focused-evidence
          path: |
            ${{ steps.focused.outputs.artifactsPath }}
            verification
          if-no-files-found: warn
