name: ROKAS Apply Startup Hint Visibility Root-Cause Fix

on:
  push:
    branches:
      - ci/startup-hint-transfer
    paths:
      - .github/workflows/startup-hint-transfer-probe.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact failed GREEN candidate
        uses: actions/checkout@v7
        with:
          ref: feature/startup-skip-hint-laptop-boot-per-home-visit
          fetch-depth: 0
      - name: Require exact candidate and apply one root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "489ceda2c5155b47be4bba35ce64593b4a1848de"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs')
          text=p.read_text(encoding='utf-8')
          changes=[
              ('            hintImage.color = Color.white;\n',
               '            hintImage.color = new Color(1f, 1f, 1f, 0f);\n'),
              ('            if (startupHintGroup) startupHintGroup.alpha = 1f;\n',
               '            if (startupHintGroup)\n            {\n                var hintImage = startupHintGroup.GetComponent<RawImage>();\n                if (hintImage) hintImage.color = Color.white;\n                startupHintGroup.alpha = 1f;\n            }\n')
          ]
          for old,new in changes:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {text.count(old)}')
              text=text.replace(old,new)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs"
          git config user.name 'rokas-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs
          git commit -m 'fix: hide startup hint image until first frame'
          git push origin HEAD:feature/startup-skip-hint-laptop-boot-per-home-visit
