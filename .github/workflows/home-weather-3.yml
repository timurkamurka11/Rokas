name: Home Weather 3 Focused GREEN

on:
  push:
    branches: [ci/home-weather-3]
    paths:
      - .github/workflows/home-weather-3.yml

permissions:
  contents: read
  checks: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact Weather 3 production runtime commit
        uses: actions/checkout@v7
        with:
          ref: 510cdb2c3c93690e144a5a06842f69f4c6f9badf
          fetch-depth: 0

      - name: Prove exact production SHA and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "510cdb2c3c93690e144a5a06842f69f4c6f9badf"
          test "$(git rev-parse HEAD^{tree})" = "7976b497cca51db776a8d7645cf4afa58ddb0992"
          git merge-base --is-ancestor a05dc28dd7f81c1c76e4be8788c89c72b0398020 HEAD
          echo "TESTED_SHA=$(git rev-parse HEAD)" | tee /tmp/weather3-focused-tree.txt
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})" | tee -a /tmp/weather3-focused-tree.txt

      - name: Literal git diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check | tee /tmp/weather3-focused-diff-check.txt

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Home-Weather-3-GREEN-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Run focused Home Weather 3 GREEN contracts
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          customParameters: -testFilter Rokas.Tests.HomeWeather3PlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Focused GREEN

      - name: Upload focused GREEN evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-focused-green
          path: |
            ${{ steps.unity-tests.outputs.artifactsPath }}
            /tmp/weather3-focused-tree.txt
            /tmp/weather3-focused-diff-check.txt
          if-no-files-found: warn
