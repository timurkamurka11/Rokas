name: Home Weather 3 Runtime Implementation

on:
  push:
    branches: [ci/home-weather-3]
    paths:
      - .github/workflows/home-weather-3.yml
      - Tools/CI/apply_weather3_runtime.py

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Weather 3 CI branch
        uses: actions/checkout@v7
        with:
          ref: ci/home-weather-3
          fetch-depth: 0

      - name: Recover and prove production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/home-weather-3
          production="$(git rev-parse origin/feature/home-weather-3)"
          git merge-base --is-ancestor a05dc28dd7f81c1c76e4be8788c89c72b0398020 "$production"
          echo "PRODUCTION_BASE=$production" | tee /tmp/weather3-production-base.txt
          echo "PRODUCTION_TREE=$(git rev-parse "$production^{tree}")" | tee -a /tmp/weather3-production-base.txt

      - name: Create isolated production worktree
        shell: bash
        run: |
          set -euo pipefail
          production="$(git rev-parse origin/feature/home-weather-3)"
          rm -rf /tmp/rokas-weather3-runtime
          git worktree add --detach /tmp/rokas-weather3-runtime "$production"

      - name: Apply existing deterministic runtime helper
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Tools/CI/apply_weather3_runtime.py" \
            /tmp/rokas-weather3-runtime/Assets/Rokas/Scripts/Presentation/WorldEffects.cs

      - name: Inspect and enforce runtime scope
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rokas-weather3-runtime
          git status --short | tee /tmp/weather3-runtime-status.txt
          changed="$(git diff --name-only)"
          test "$changed" = "Assets/Rokas/Scripts/Presentation/WorldEffects.cs"
          git diff -- Assets/Rokas/Scripts/Presentation/WorldEffects.cs | tee /tmp/weather3-runtime.diff
          ! grep -q 'LampMood' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          ! grep -q 'CreateRainTexture' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          ! grep -q 'CreateWetGlassTexture' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          ! grep -q 'CreateRadialTexture' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          grep -q 'WindowGlazingMask' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          grep -q 'HomeWetGlassDroplets' Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          grep -q 'RainStreakAuthored' Assets/Rokas/Scripts/Presentation/WorldEffects.cs

      - name: Literal git diff check
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rokas-weather3-runtime
          git diff --check | tee /tmp/weather3-runtime-diff-check.txt

      - name: Commit exact production runtime rework
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rokas-weather3-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Rokas/Scripts/Presentation/WorldEffects.cs
          test "$(git diff --cached --name-only)" = "Assets/Rokas/Scripts/Presentation/WorldEffects.cs"
          git diff --cached --check
          git commit -m 'feat: rework Home Weather 3 cinematic atmosphere'
          git rev-parse HEAD | tee /tmp/weather3-runtime-commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/weather3-runtime-tree.txt

      - name: Fast-forward push production only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rokas-weather3-runtime
          base="$(sed -n 's/^PRODUCTION_BASE=//p' /tmp/weather3-production-base.txt)"
          git fetch origin feature/home-weather-3
          test "$(git rev-parse origin/feature/home-weather-3)" = "$base"
          git merge-base --is-ancestor "$base" HEAD
          git push origin HEAD:feature/home-weather-3

      - name: Prove remote production and protected branch safety
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat /tmp/weather3-runtime-commit.txt)"
          git fetch origin feature/home-weather-3 development
          test "$(git rev-parse origin/feature/home-weather-3)" = "$expected"
          test "$(git rev-parse origin/development)" = "5e494f188b90bdb6916e8e78e35ac38509bd0bce"
          echo "FEATURE_HEAD=$(git rev-parse origin/feature/home-weather-3)"
          echo "FEATURE_TREE=$(git rev-parse origin/feature/home-weather-3^{tree})"
          echo "DEVELOPMENT_HEAD=$(git rev-parse origin/development)"

      - name: Upload runtime implementation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-runtime-implementation
          path: |
            /tmp/weather3-production-base.txt
            /tmp/weather3-runtime-status.txt
            /tmp/weather3-runtime.diff
            /tmp/weather3-runtime-diff-check.txt
            /tmp/weather3-runtime-commit.txt
            /tmp/weather3-runtime-tree.txt
          if-no-files-found: warn
