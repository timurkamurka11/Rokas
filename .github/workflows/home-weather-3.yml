name: Home Weather 3 Final Exact-Tree Gate

on:
  push:
    branches: [ci/home-weather-3]
    paths:
      - .github/workflows/home-weather-3.yml

permissions:
  contents: read
  checks: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact Weather 3 production runtime commit
        uses: actions/checkout@v7
        with:
          ref: 3035975cce69ba1034ecd3ddd4cf719083715c56
          fetch-depth: 0

      - name: Prove exact production SHA tree ancestry and protected refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3035975cce69ba1034ecd3ddd4cf719083715c56"
          test "$(git rev-parse HEAD^{tree})" = "386a02647fef70ad6e196e5ae032ebda84af6fe7"
          git merge-base --is-ancestor a05dc28dd7f81c1c76e4be8788c89c72b0398020 HEAD
          git fetch origin development integration/rokas-unified ci/home-weather-3
          test "$(git rev-parse origin/development)" = "5e494f188b90bdb6916e8e78e35ac38509bd0bce"
          mkdir -p /tmp/weather3-final
          {
            echo "TESTED_SHA=$(git rev-parse HEAD)"
            echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
            echo "DEVELOPMENT_SHA=$(git rev-parse origin/development)"
            echo "DEVELOPMENT_TREE=$(git rev-parse origin/development^{tree})"
            echo "UNIFIED_SHA=$(git rev-parse origin/integration/rokas-unified)"
            echo "UNIFIED_TREE=$(git rev-parse origin/integration/rokas-unified^{tree})"
          } | tee /tmp/weather3-final/exact-tree.txt

      - name: Literal diff check and scope audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check a05dc28dd7f81c1c76e4be8788c89c72b0398020..HEAD | tee /tmp/weather3-final/git-diff-check.txt
          git diff --name-status a05dc28dd7f81c1c76e4be8788c89c72b0398020..HEAD | tee /tmp/weather3-final/scope.txt
          mapfile -t changed < <(git diff --name-only a05dc28dd7f81c1c76e4be8788c89c72b0398020..HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "Assets/Rokas/Scripts/Presentation/WorldEffects.cs"
          test "${changed[1]}" = "Assets/Rokas/Tests/PlayMode/HomeWeather3PlayModeTests.cs"
          git log --oneline --decorate a05dc28dd7f81c1c76e4be8788c89c72b0398020..HEAD | tee /tmp/weather3-final/production-history.txt

      - name: Run static validator and classify historical baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 Tools/validate_assets.py > /tmp/weather3-final/validator-raw.txt 2>&1
          validator_rc=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, sys
          report = Path('/tmp/weather3-final/validator-raw.txt').read_text(errors='replace')
          failures = [line for line in report.splitlines() if line.startswith('FAIL: ')]
          legacy_images = {
              'GreenTea.png','HunterTempura.png','MoonMochi.png','SpicyMiso.png',
              'TravelerOnigiri.png','HomeActionIcons.png','EmojiOne.png'
          }
          legacy_audio = {'LaptopMouseClick.wav','UIWood.wav'}
          historical=[]; weather_resolution=[]; unexpected=[]
          for line in failures:
              if line.startswith('FAIL: Unresolved GUID '):
                  historical.append(line)
              elif line.startswith('FAIL: Background below HD: '):
                  name=line.rsplit(': ',1)[-1]
                  if name in legacy_images: historical.append(line)
                  elif (Path('Assets/Rokas/Resources/Weather3')/name).exists(): weather_resolution.append(line)
                  else: unexpected.append(line)
              elif line.startswith('FAIL: Invalid stereo PCM source: ') and line.rsplit(': ',1)[-1] in legacy_audio:
                  historical.append(line)
              else:
                  unexpected.append(line)
          guid_count=sum('Unresolved GUID ' in x for x in historical)
          legacy_bg_count=sum('Background below HD:' in x for x in historical)
          legacy_audio_count=sum('Invalid stereo PCM source:' in x for x in historical)
          if (guid_count,legacy_bg_count,legacy_audio_count)!=(4,7,2):
              print('historical baseline mismatch', guid_count, legacy_bg_count, legacy_audio_count)
              print('\n'.join(historical))
              sys.exit(2)
          if unexpected:
              print('NEW RELEVANT VALIDATOR FINDINGS:')
              print('\n'.join(unexpected))
              sys.exit(3)
          weather_dir=Path('Assets/Rokas/Resources/Weather3')
          pngs=sorted(weather_dir.glob('*.png'))
          if len(pngs)!=10:
              print('Expected exactly 10 authored Weather3 PNGs, got',len(pngs)); sys.exit(4)
          asset_lines=[]
          for p in pngs:
              meta=Path(str(p)+'.meta')
              if not meta.exists(): print('Missing meta',p); sys.exit(5)
              b=p.read_bytes()[:33]
              if b[:8]!=b'\x89PNG\r\n\x1a\n': print('Invalid PNG',p); sys.exit(6)
              w,h=struct.unpack('>II',b[16:24]); color_type=b[25]
              if w<32 or h<32: print('Weather effect texture implausibly small',p,w,h); sys.exit(7)
              mt=meta.read_text(errors='replace')
              if not re.search(r'^guid: [0-9a-f]{32}$',mt,re.M): print('Invalid meta GUID',meta); sys.exit(8)
              if 'mipmaps:' not in mt and 'enableMipMap:' not in mt: print('Importer metadata incomplete',meta); sys.exit(9)
              asset_lines.append(f'{p.name}: {w}x{h} color_type={color_type} meta=OK')
          out=[]
          out.append('HISTORICAL_FINDINGS=13')
          out.append(f'HISTORICAL_GUID={guid_count}')
          out.append(f'HISTORICAL_BELOW_HD={legacy_bg_count}')
          out.append(f'HISTORICAL_PCM={legacy_audio_count}')
          out.append(f'WEATHER_EFFECT_RESOLUTION_CLASSIFIER_NOTICES={len(weather_resolution)}')
          out.append('NEW_RELEVANT_FINDINGS=0')
          out.extend(asset_lines)
          Path('/tmp/weather3-final/validator-summary.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY

      - name: Setup .NET for Core/domain suite
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run complete Core/domain suite and preserve evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f Tests/Core/Rokas.Core.Tests.csproj
          test -f Tests/Core/Program.cs
          mkdir -p /tmp/weather3-final/core
          dotnet run --project Tests/Core/Rokas.Core.Tests.csproj --configuration Release 2>&1 | tee /tmp/weather3-final/core/core-output.txt
          test -s /tmp/weather3-final/core/core-output.txt
          grep -Fxq 'PASS: all Rokas.Core behavior tests' /tmp/weather3-final/core/core-output.txt

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Home-Weather-3-Final-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Run complete EditMode
        id: editmode
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env: &unity_env
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: EditMode
          artifactsPath: artifacts-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Full EditMode

      - name: Preserve EditMode evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weather3-final/editmode
          cp -a "${{ steps.editmode.outputs.artifactsPath }}/." /tmp/weather3-final/editmode/
          test -n "$(find /tmp/weather3-final/editmode -type f -name '*results.xml' -print -quit)"
          test -n "$(find /tmp/weather3-final/editmode -type f \( -name '*.log' -o -name '*_RuntimeTestLog.txt' \) -print -quit)"

      - name: Run complete PlayMode
        id: playmode
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env: *unity_env
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Full PlayMode

      - name: Preserve PlayMode evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weather3-final/playmode
          cp -a "${{ steps.playmode.outputs.artifactsPath }}/." /tmp/weather3-final/playmode/
          test -n "$(find /tmp/weather3-final/playmode -type f -name '*results.xml' -print -quit)"
          test -n "$(find /tmp/weather3-final/playmode -type f \( -name '*.log' -o -name '*_RuntimeTestLog.txt' \) -print -quit)"

      - name: Run focused Weather 3 contracts
        id: focused
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env: *unity_env
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-focused
          customParameters: -testFilter Rokas.Tests.HomeWeather3PlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Focused Final

      - name: Preserve focused evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weather3-final/focused
          cp -a "${{ steps.focused.outputs.artifactsPath }}/." /tmp/weather3-final/focused/
          test -n "$(find /tmp/weather3-final/focused -type f -name '*results.xml' -print -quit)"
          test -n "$(find /tmp/weather3-final/focused -type f \( -name '*.log' -o -name '*_RuntimeTestLog.txt' \) -print -quit)"

      - name: Run Home atmosphere and 2.5D regression
        id: home
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env: *unity_env
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-home
          customParameters: -testFilter Rokas.Tests.HomeAtmospherePlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Home Final

      - name: Preserve Home evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weather3-final/home
          cp -a "${{ steps.home.outputs.artifactsPath }}/." /tmp/weather3-final/home/
          test -n "$(find /tmp/weather3-final/home -type f -name '*results.xml' -print -quit)"
          test -n "$(find /tmp/weather3-final/home -type f \( -name '*.log' -o -name '*_RuntimeTestLog.txt' \) -print -quit)"

      - name: Prove technical test results before visual capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          core_output=Path('/tmp/weather3-final/core/core-output.txt')
          if not core_output.exists() or 'PASS: all Rokas.Core behavior tests' not in core_output.read_text(errors='replace'):
              raise SystemExit('Core/domain PASS evidence missing')
          lines=['core: PASS: all Rokas.Core behavior tests']
          print(lines[0])
          for label in ['editmode','playmode','focused','home']:
              xmls=list((Path('/tmp/weather3-final')/label).rglob('*results.xml'))
              if not xmls:
                  xmls=list((Path('/tmp/weather3-final')/label).rglob('*.xml'))
              if not xmls:
                  raise SystemExit(f'no XML result for {label}')
              root=ET.parse(xmls[0]).getroot()
              def attr(*names):
                  for n in names:
                      if n in root.attrib: return root.attrib[n]
                  return '0'
              total=attr('total','testcasecount','test-case-count')
              passed=attr('passed')
              failed=attr('failed')
              skipped=attr('skipped')
              inconclusive=attr('inconclusive')
              line=f'{label}: passed={passed} total={total} failed={failed} skipped={skipped} inconclusive={inconclusive} xml={xmls[0].name}'
              lines.append(line); print(line)
              if int(failed or 0)!=0: raise SystemExit(f'{label} has failures')
              if label == 'editmode' and (int(skipped or 0)!=0 or int(inconclusive or 0)!=0):
                  raise SystemExit('EditMode has skipped/inconclusive tests')
          Path('/tmp/weather3-final/technical-test-summary.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Prove technical Unity logs before visual capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('/tmp/weather3-final')
          log_files=sorted(set(root.rglob('*.log')) | set(root.rglob('*_RuntimeTestLog.txt')))
          print(f'UNITY LOG FILES DISCOVERED: {len(log_files)}')
          scanned=0; findings=[]
          strong=[
              re.compile(r'\bNullReferenceException\b'),
              re.compile(r'\bMissingReferenceException\b'),
              re.compile(r'\bMissingComponentException\b'),
              re.compile(r'\bUnhandled Exception\b', re.I),
              re.compile(r'\bUnityException\s*:'),
              re.compile(r'\berror CS\d{4}\s*:', re.I),
              re.compile(r'\bScripts have compiler errors\b', re.I),
              re.compile(r'\bCompilation failed\b', re.I),
              re.compile(r'\bAborting batchmode due to failure\b', re.I),
          ]
          for p in log_files:
              scanned += 1
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(rx.search(line) for rx in strong): findings.append(f'{p}:{i}:{line}')
          out=[f'UNITY LOG FILES DISCOVERED: {len(log_files)}',f'UNITY LOG FILES SCANNED: {scanned}',f'UNITY ERROR LINES FOUND: {len(findings)}']+findings
          Path('/tmp/weather3-final/technical-log-scan.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out[1:]))
          if scanned == 0: sys.exit(12)
          if findings: sys.exit(11)
          PY

      - name: Overlay proven seven-state visual probe only
        shell: bash
        run: |
          set -euo pipefail
          git show origin/ci/home-weather-3:Tools/CI/HomeWeather3VisualQaPlayModeTests.cs.txt > Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'captureCamera.Render();' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'RenderTexture.active = captureTarget;' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs
          grep -q 'ReadPixels' Assets/Rokas/Tests/PlayMode/HomeWeather3VisualQaPlayModeTests.cs

      - name: Capture final seven-state runtime matrix
        id: visual
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env: *unity_env
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          artifactsPath: artifacts-visual
          customParameters: -testFilter Rokas.Tests.HomeWeather3VisualQaPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Weather 3 Final Visual Capture

      - name: Preserve and prove final visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weather3-final/visual
          cp -a "${{ steps.visual.outputs.artifactsPath }}/." /tmp/weather3-final/visual/
          test -n "$(find /tmp/weather3-final/visual -type f -name '*results.xml' -print -quit)"
          test -n "$(find /tmp/weather3-final/visual -type f \( -name '*.log' -o -name '*_RuntimeTestLog.txt' \) -print -quit)"
          cp -a TestResults/HomeWeather3VisualQa /tmp/weather3-final/visual/captures
          for file in 01-weather3-light-on.png 02-weather3-light-off.png 03-weather3-normal-rain.png 04-weather3-wet-glass.png 05-weather3-lightning-on.png 06-weather3-lightning-off.png 07-weather3-idle-depth.png; do
            test -s "/tmp/weather3-final/visual/captures/$file"
            file "/tmp/weather3-final/visual/captures/$file"
          done | tee /tmp/weather3-final/visual-captures.txt

      - name: Summarize final test results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          core_output=Path('/tmp/weather3-final/core/core-output.txt')
          if not core_output.exists() or 'PASS: all Rokas.Core behavior tests' not in core_output.read_text(errors='replace'):
              raise SystemExit('Core/domain PASS evidence missing')
          lines=['core: PASS: all Rokas.Core behavior tests']
          print(lines[0])
          roots=['editmode','playmode','focused','home','visual']
          for label in roots:
              xmls=list((Path('/tmp/weather3-final')/label).rglob('*results.xml'))
              if not xmls:
                  xmls=list((Path('/tmp/weather3-final')/label).rglob('*.xml'))
              if not xmls:
                  raise SystemExit(f'no XML result for {label}')
              root=ET.parse(xmls[0]).getroot()
              def attr(*names):
                  for n in names:
                      if n in root.attrib: return root.attrib[n]
                  return '0'
              total=attr('total','testcasecount','test-case-count')
              passed=attr('passed')
              failed=attr('failed')
              skipped=attr('skipped')
              inconclusive=attr('inconclusive')
              line=f'{label}: passed={passed} total={total} failed={failed} skipped={skipped} inconclusive={inconclusive} xml={xmls[0].name}'
              lines.append(line); print(line)
              if int(failed or 0)!=0: raise SystemExit(f'{label} has failures')
              if label == 'editmode' and (int(skipped or 0)!=0 or int(inconclusive or 0)!=0):
                  raise SystemExit('EditMode has skipped/inconclusive tests')
          Path('/tmp/weather3-final/test-summary.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Fresh relevant Unity log scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('/tmp/weather3-final')
          log_files=sorted(set(root.rglob('*.log')) | set(root.rglob('*_RuntimeTestLog.txt')))
          print(f'UNITY LOG FILES DISCOVERED: {len(log_files)}')
          scanned=0; findings=[]
          strong=[
              re.compile(r'\bNullReferenceException\b'),
              re.compile(r'\bMissingReferenceException\b'),
              re.compile(r'\bMissingComponentException\b'),
              re.compile(r'\bUnhandled Exception\b', re.I),
              re.compile(r'\bUnityException\s*:'),
              re.compile(r'\berror CS\d{4}\s*:', re.I),
              re.compile(r'\bScripts have compiler errors\b', re.I),
              re.compile(r'\bCompilation failed\b', re.I),
              re.compile(r'\bAborting batchmode due to failure\b', re.I),
          ]
          for p in log_files:
              scanned += 1
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(rx.search(line) for rx in strong): findings.append(f'{p}:{i}:{line}')
          out=[f'UNITY LOG FILES DISCOVERED: {len(log_files)}',f'UNITY LOG FILES SCANNED: {scanned}',f'UNITY ERROR LINES FOUND: {len(findings)}']+findings
          Path('/tmp/weather3-final/log-scan.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out[1:]))
          if scanned == 0: sys.exit(12)
          if findings: sys.exit(11)
          PY

      - name: Final committed-tree integrity proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3035975cce69ba1034ecd3ddd4cf719083715c56"
          test "$(git rev-parse HEAD^{tree})" = "386a02647fef70ad6e196e5ae032ebda84af6fe7"
          test "$(git rev-parse origin/development)" = "5e494f188b90bdb6916e8e78e35ac38509bd0bce"
          git diff --check HEAD | tee /tmp/weather3-final/final-working-diff-check.txt

      - name: Upload complete final-results evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-final-results
          path: /tmp/weather3-final
          if-no-files-found: error
