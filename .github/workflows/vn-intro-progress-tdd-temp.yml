name: ROKAS VN Progress TDD Temp

on:
  push:
    branches:
      - feature/vn-intro-yarn-flow
    paths:
      - .github/workflows/vn-intro-progress-tdd-temp.yml
      - Assets/Rokas/Tests/EditMode/VnIntroProgressTests.cs
      - Assets/Rokas/Tests/EditMode/VnIntroProgressTests.cs.meta
      - Assets/Rokas/Scripts/Presentation/VnIntroProgress.cs
      - Assets/Rokas/Scripts/Presentation/VnIntroProgress.cs.meta
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  progress-editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Run focused VN progress EditMode tests
        id: focused
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Core.Tests.VnIntroProgressTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Intro Progress TDD
      - name: Preserve TDD evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git status --short --untracked-files=all > verification/status.txt
          if [ -f artifacts/editmode-results.xml ]; then cp artifacts/editmode-results.xml verification/editmode-results.xml; fi
      - name: Upload TDD evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-intro-progress-tdd-${{ github.sha }}
          path: |
            ${{ steps.focused.outputs.artifactsPath }}
            verification
          if-no-files-found: warn
