name: ROKAS Startup Laptop Video Apply Patch

on:
  push:
    branches:
      - feature/startup-laptop-video-integration
    paths:
      - .ci/startup-laptop-video-patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/startup-laptop-video-integration
          fetch-depth: 0
      - name: Apply exact production patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 Tools/apply_startup_laptop_video_patch.py
          git diff --check
          git diff -- Assets/Rokas/Scripts/Presentation/LaptopView.cs Assets/Rokas/Scripts/Presentation/RokasView.cs
      - name: Commit production patch
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Rokas/Scripts/Presentation/LaptopView.cs Assets/Rokas/Scripts/Presentation/RokasView.cs
          git commit -m 'feat: gate laptop desktop behind boot video'
          git push origin HEAD:feature/startup-laptop-video-integration
