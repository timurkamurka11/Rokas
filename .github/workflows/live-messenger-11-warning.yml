name: Live Messenger 1.1 Warning Cleanup

on:
  push:
    branches: [feature/messages-system]
    paths:
      - .github/workflows/live-messenger-11-warning.yml
      - Tools/fix_live_messenger_11_tmp_warning.py

permissions:
  contents: write
  checks: write

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/messages-system
          fetch-depth: 0

      - name: Apply focused TMP warning cleanup
        run: python3 Tools/fix_live_messenger_11_tmp_warning.py

      - name: Literal diff check
        run: git diff --check

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Unity-Live-Messenger-11-Warning-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Live-Messenger-11-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run EditMode and PlayMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: All
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Live Messenger 1.1 Warning Gate

      - name: Upload Unity artifacts
        if: always() && steps.unity-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: live-messenger-11-warning-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn

      - name: Persist warning cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/Rokas/Scripts/Presentation/LaptopMessagesView.cs
          git commit -m "fix: use current TMP wrapping API"
          git push origin HEAD:feature/messages-system
