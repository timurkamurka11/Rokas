name: TEMP VN Panel Transfer Inspect

on:
  push:
    branches:
      - feature/vn-visual-polish-refs

permissions:
  contents: read

jobs:
  inspect-share:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect all temporary panel share client scripts
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/I-ehbdfMUaNk
        run: |
          set -euo pipefail
          rm -rf /tmp/fire-js && mkdir -p /tmp/fire-js
          curl -fsSL "$SHARE_URL" -o /tmp/share.html
          grep -oE 'src="[^"]+\.js"' /tmp/share.html | sed -E 's/^src="//;s/"$//' | sort -u >/tmp/script-paths.txt
          echo '--- SCRIPT PATHS ---'
          cat /tmp/script-paths.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            name=$(printf '%s' "$path" | sha256sum | cut -d' ' -f1).js
            curl -fsSL "https://firestorage.ai$path" -o "/tmp/fire-js/$name"
          done </tmp/script-paths.txt
          echo "SCRIPT_COUNT=$(find /tmp/fire-js -type f | wc -l)"
          echo "SCRIPT_BYTES=$(du -cb /tmp/fire-js/* | tail -1 | cut -f1)"
          echo '--- CANDIDATE LINES ---'
          grep -rhoE '.{0,120}(/api/|download|shareId|share_id|fileId|file_id|publicId|signedUrl|presign|objectKey|storage).{0,220}' /tmp/fire-js | head -300 || true
          echo '--- API PATHS ---'
          grep -rhoE 'https?://[^"[:space:]<>]+|/api/[A-Za-z0-9_?&=./{}:$-]+' /tmp/fire-js | sort -u | head -300 || true
      - name: Upload inspected client scripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-panel-transfer-inspect-${{ github.sha }}
          path: |
            /tmp/share.html
            /tmp/script-paths.txt
            /tmp/fire-js
          if-no-files-found: warn
