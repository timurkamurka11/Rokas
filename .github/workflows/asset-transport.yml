name: asset-transport
on:
  push:
    branches: [asset-transport]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Persist Green Tea checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          api='https://api.firestorage.ai/dev/file'
          share='AK6JicZRRaOy'
          expected_sha='d86107e586927152778edd61b839baaa04292ef1b249e1ef61e5592f933f8ab0'
          target='Assets/Rokas/Resources/Food/Details/GreenTea.png'
          curl -L --fail --max-time 30 "$api/shares/$share/files?maxResults=1000" -o /tmp/files.json
          file_id=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          matches=[f for f in d['files'] if f.get('fileName')=='GreenTea.png']
          assert len(matches)==1, d
          print(matches[0]['fileId'])
          PY
          )
          curl -L --fail --max-time 30 -X POST "$api/shares/$share/files/$file_id/download" -o /tmp/download.json
          url=$(python3 -c "import json; print(json.load(open('/tmp/download.json'))['downloadUrl'])")
          curl -L --fail --max-time 90 "$url" -o /tmp/GreenTea.png
          actual_sha=$(sha256sum /tmp/GreenTea.png | awk '{print $1}')
          old_sha=$(sha256sum "$target" | awk '{print $1}')
          echo "GREEN_TEA_SHA256=$actual_sha"
          echo "OLD_GREEN_TEA_SHA256=$old_sha"
          test "$actual_sha" = "$expected_sha"
          test "$actual_sha" != "$old_sha"
          python3 - <<'PY'
          import struct
          for label,path in [('NEW','/tmp/GreenTea.png'),('OLD','Assets/Rokas/Resources/Food/Details/GreenTea.png')]:
              b=open(path,'rb').read(24)
              assert b[:8] == b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24])
              print(f'{label}_GREEN_TEA_DIMENSIONS={w}x{h}')
              if label == 'NEW':
                  assert (w,h)==(1024,406)
          PY
          git switch -c checkpoint-green-tea
          cp /tmp/GreenTea.png "$target"
          changed=$(git status --short)
          printf '%s\n' "$changed"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$target"
          git diff --check
          git config user.name 'rokas-checkpoint-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          git commit -m 'wip: checkpoint green tea hero'
          git rev-parse HEAD
          git push origin HEAD:checkpoint-green-tea
