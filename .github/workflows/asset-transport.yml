name: asset-transport
on:
  push:
    branches: [asset-transport]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          share='https://firestorage.ai/ja/f/6IZBBacpoxzo'
          curl -L --fail -A 'Mozilla/5.0' "$share" -o page.html
          echo '--- scripts ---'
          grep -Eo 'src="[^"]+\.js"' page.html | sed 's/^src="//;s/"$//' | tee scripts.txt
          while IFS= read -r js; do
            f=$(echo "$js" | tr '/()' '___')
            curl -L --fail -A 'Mozilla/5.0' "$base$js" -o "$f" || continue
            echo "=== $js ($(wc -c < "$f") bytes) ==="
            cat "$f" | head -c 400 || true
            echo
            grep -Eo '.{0,160}(/api/|download|presign|share|publicId|fileId|object|asset|storage).{0,320}' "$f" | head -80 || true
          done < scripts.txt
