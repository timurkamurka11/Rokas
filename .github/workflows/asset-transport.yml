name: asset-transport
on:
  push:
    branches: [asset-transport]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage route chunk
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          share='https://firestorage.ai/ja/f/6IZBBacpoxzo'
          curl -L --fail --max-time 20 -A 'Mozilla/5.0' "$share" -o page.html
          js=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[a-z0-9]+\.js' page.html | head -1)
          curl -L --fail --max-time 20 -A 'Mozilla/5.0' "$base$js" -o route.js
          echo '--- route.js ---'
          cat route.js
          echo
          echo '--- all chunk refs in page ---'
          grep -Eo '/_next/static/chunks/[^" ]+\.js' page.html | sort -u
