name: asset-transport
on:
  push:
    branches: [asset-transport]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage share
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          share='https://firestorage.ai/ja/f/6IZBBacpoxzo'
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "$share" -o page.html
          echo '--- share markers ---'
          grep -Eo '.{0,160}(MoonMochi|01a07cc302ab7555873283c4e0c28275|Hj2P6mENvdY3IEL4|download|presign|object|storage).{0,320}' page.html | head -100 || true
          js=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[a-z0-9]+\.js' page.html | head -1)
          echo "JS=$js"
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "$base$js" -o page.js
          wc -c page.js
          echo '--- API-like strings ---'
          grep -Eo '.{0,180}(/api/|download|presign|share|publicId|fileId|object).{0,360}' page.js | head -200 || true
