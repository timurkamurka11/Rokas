name: ROKAS Argon Five-Source Handoff
on:
  push:
    paths:
      - '.github/workflows/argon-five-source-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Export only five files from pinned ROKAS commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/make_handoff.py <<'PY'
          import base64, hashlib, io, json, os, pathlib, urllib.request, zipfile
          repo="timurkamurka11/Rokas"
          sha="6dc2b8d1ec4b6e491163eeeae13c46835e921586"
          paths=["Assets/Rokas/Scripts/Presentation/LaptopCinematicSequence.cs","Assets/Rokas/Scripts/Presentation/LaptopScreenBounceEstimator.cs","Assets/Rokas/Scripts/Presentation/LaptopCinematicLightPresentation.cs","Assets/Rokas/Resources/Shaders/LaptopCinematicLightStates.shader","Assets/Rokas/Tests/EditMode/LaptopTwoZoneLightingEditModeTests.cs"]
          data={}
          for path in paths:
              url=f"https://api.github.com/repos/{repo}/contents/{path}?ref={sha}"
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['GH_TOKEN']}","X-GitHub-Api-Version":"2022-11-28","User-Agent":"Rokas-Argon-Handoff"})
              with urllib.request.urlopen(req,timeout=30) as r: j=json.load(r)
              content=base64.b64decode(j["content"])
              git_sha=hashlib.sha1(b"blob "+str(len(content)).encode()+bytes([0])+content).hexdigest()
              assert git_sha==j["sha"],f"Mismatch on {path}"
              assert content and bytes([0]) not in content,f"Binary unexpectedly: {path}"
              data[path]=content
              print(f"Verified {path}: {len(content)} bytes, SHA {git_sha}")
          readme=f"""# ROKAS Laptop Cinematic — Argon source handoff
          
          Repository: https://github.com/{repo}
          SOURCE COMMIT (immutable): {sha}
          Branch at export: codex/fidelity3-resume-5779190
          
          Exactly five requested source files are included, preserving repository-relative paths.
          
          Task for Argon:
          1. Study ALL five files and give a line-specific audit of the laptop screen-bounce/reflection pipeline.
          2. Return a git-apply-compatible unified diff using the exact relative paths.
          3. Diagnose the Unity RenderTexture.active release warning; state uncertainty where a call stack is missing.
          4. Preserve approved room/hallway masks, hand animations, YOMI, calibrated POV and the golden right-hand UI.
          5. Target this source commit; do not blindly rewrite unrelated systems. Do not claim tests ran without actually running them.
          
          When returning patch, include explanatory comments and regression tests.
          For code review, send the .patch text or file back to ChatGPT.
          """
          manifest={"repository":repo,"source_commit":sha,"files":{k:{"sha256":hashlib.sha256(v).hexdigest(),"bytes":len(v)} for k,v in data.items()}}
          out=pathlib.Path("ROKAS_Argon_Laptop_5Sources_6dc2b8d.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for k,v in data.items():z.writestr(k,v)
              z.writestr("ARGON_README.md",readme.encode("utf-8"))
              z.writestr("SOURCE_MANIFEST.json",json.dumps(manifest,ensure_ascii=False,indent=2).encode("utf-8"))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert len(z.namelist())==7
          print(f"ARCHIVE={out}, size={out.stat().st_size}")
          
          PY
          python /tmp/make_handoff.py
      - name: Upload small ZIP for Gemini Argon
        uses: actions/upload-artifact@v4
        with:
          name: ROKAS-Argon-Laptop-5Sources-6dc2b8d
          path: ROKAS_Argon_Laptop_5Sources_6dc2b8d.zip
          retention-days: 7
          if-no-files-found: error
