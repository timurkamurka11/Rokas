name: ROKAS Home Scan UI Focused

on:
  push:
    branches:
      - codex/home-room-scan-ui-exact-oracle
    paths:
      - 'Assets/Rokas/Scripts/Presentation/HomeView.cs'
      - 'Assets/Rokas/Scripts/Presentation/RokasView.cs'
      - 'Assets/Rokas/Scripts/Presentation/HomeScanUi.cs'
      - 'Assets/Rokas/Tests/PlayMode/HomeScanUiPlayModeTests.cs'
      - '.github/workflows/home-scan-ui-focused.yml'

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.3.19f1

jobs:
  home-scan-ui:
    name: Home scan oracle UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run Home scan UI focused PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HomeScanUiPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Scan UI
          artifactsPath: artifacts-home-scan-ui

  home-atmosphere-regression:
    name: Existing Home atmosphere regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run existing Home atmosphere tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HomeAtmospherePlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Atmosphere Regression
          artifactsPath: artifacts-home-atmosphere-regression

  home-interaction-regression:
    name: Existing Home interaction regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run existing Home/laptop visit tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupSkipHintLaptopHomeVisitPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Home Interaction Regression
          artifactsPath: artifacts-home-interaction-regression
