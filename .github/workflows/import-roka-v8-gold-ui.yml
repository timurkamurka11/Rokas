name: One-time ROKAS V8 approved gold button import
on:
  push:
    paths:
      - '.github/workflows/import-roka-v8-gold-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fidelity3-resume-5779190
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser for downloading user-supplied ZIP
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
      - name: Transfer original gold artwork with SHA256 and PNG CRC checks
        run: |
          cat > /tmp/roka_import_v8.py <<'PY'
          import hashlib, pathlib, struct, zipfile, zlib
          from playwright.sync_api import sync_playwright
          output=pathlib.Path('/tmp/roka-v8-ui.zip')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(accept_downloads=True,locale='ja-JP')
              page.goto('https://firestorage.ai/ja/f/bQdqPnVTAd8T',
                  wait_until='domcontentloaded',timeout=45000)
              button=page.locator('button[class*="downloadButton"]').first
              button.wait_for(state='visible',timeout=30000)
              with page.expect_download(timeout=60000) as result:
                  button.click()
              result.value.save_as(str(output))
              browser.close()
          compressed=output.read_bytes()
          digest=hashlib.sha256(compressed).hexdigest()
          assert digest=='ec26e00f625063ae9352304f8743d3c4636a261fc4041fd3ff85797331b45465', ('ZIP checksum mismatch',digest)
          expected=['prompt_shutdown_v8.png','prompt_open_yomi_v8.png',
              'prompt_stand_r_v8.png','prompt_back_v8.png','prompt_power_v8.png']
          root=pathlib.Path('Assets/Rokas/Resources/LaptopCinematic/UI')
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None,'ZIP failed CRC'
              for name in expected:
                  data=z.read(name)
                  assert data[:8]==b'\x89PNG\r\n\x1a\n',name
                  pos=8
                  seenEnd=False
                  while pos<len(data):
                      assert pos+12<=len(data),(name,'truncated header')
                      n=struct.unpack('>I',data[pos:pos+4])[0]
                      typ=data[pos+4:pos+8]
                      end=pos+12+n
                      assert end<=len(data),(name,'truncated PNG')
                      chunk=data[pos+8:pos+8+n]
                      crc=struct.unpack('>I',data[end-4:end])[0]
                      assert zlib.crc32(typ+chunk)==crc,(name,typ,'bad CRC')
                      if typ==b'IEND':
                          seenEnd=True
                      pos=end
                  assert seenEnd and pos==len(data),(name,'truncated file')
                  w,h=struct.unpack('>II',data[16:24])
                  assert w==1024 and h>150 and h<350,(name,w,h)
                  path=root/name
                  path.write_bytes(data)
                  print('validated',name,len(data),'bytes',w,'x',h)
          # Assert new UI assets can be resolved exactly by Resources paths
          s=pathlib.Path('Assets/Rokas/Scripts/Presentation/LaptopCinematicSequence.cs').read_text()
          for name in expected:
              assert ('LaptopCinematic/UI/'+name[:-4]) in s,name
          assert 'bottomOpticalLine = 1044f' in s
          assert 'BlueLedPhotographicHalo' in s and 'GreenLedPhotographicHalo' in s
          print('ALL FIVE user PNGs + V8 layout verified')
          PY
          python /tmp/roka_import_v8.py
      - name: Commit five exact transparent golden PNGs to the current ROKAS branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Rokas/Resources/LaptopCinematic/UI/*_v8.png
          git diff --cached --quiet && exit 0
          git commit -m 'feat(laptop): install checksum-verified user V8 gold button images'
          git push origin HEAD:codex/fidelity3-resume-5779190
