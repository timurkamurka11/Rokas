name: ROKAS Cloud Blender Production Right Hand

on:
  workflow_dispatch:
  push:
    branches:
      - codex/laptop-pov-cinematic-20261009
    paths:
      - '.github/workflows/laptop-cloud-blender-production.yml'
      - 'Tools/LaptopCinematic/cloud_blender_right_hand_production.py'
      - 'Tools/LaptopCinematic/cloud_blender_nail_cuff_audit.py'

permissions:
  contents: read

concurrency:
  group: rokas-blender-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve Blender official 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender" "$HOME/.cache/rokas-blender"
          cd "$HOME/.cache/rokas-blender"
          name="blender-4.5.14-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.5"
          curl -fL --retry 4 --retry-all-errors -o "$name" "$base/$name"
          curl -fL --retry 4 --retry-all-errors -o release.sha256 "$base/blender-4.5.14.sha256"
          grep -F "$name" release.sha256 | sed 's/\*//g' | sha256sum -c -
          tar -xJf "$name" -C "$RUNNER_TEMP/blender"
      - name: Fetch licensed source and validate format
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors \
            -o "$RUNNER_TEMP/right_hand_CC0.glb" \
            'https://www.innerscene.com/api/library/posable-anatomical-right-hand-f6098b4f/download'
          test "$(head -c4 "$RUNNER_TEMP/right_hand_CC0.glb")" = glTF
      - name: Render four strategic frames, without touching the main game
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/right_hand_preview"
          "$RUNNER_TEMP/blender/blender-4.5.14-linux-x64/blender" \
            --background --factory-startup -t 2 \
            --python Tools/LaptopCinematic/cloud_blender_right_hand_production.py -- \
            --input "$RUNNER_TEMP/right_hand_CC0.glb" \
            --output "$RUNNER_TEMP/right_hand_preview" \
            --width 960 --height 540 --samples 8 --only 6,22,31,41
          test -s "$RUNNER_TEMP/right_hand_preview/HandsRight_0031.png"
          test -s "$RUNNER_TEMP/right_hand_preview/production_report.json"
      - name: Render diagnostic nail, cuff, and hand ID masks in real Blender
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/right_hand_preview/QA"
          "$RUNNER_TEMP/blender/blender-4.5.14-linux-x64/blender" \
            --background --factory-startup -t 2 \
            --python Tools/LaptopCinematic/cloud_blender_nail_cuff_audit.py -- \
            --input "$RUNNER_TEMP/right_hand_preview/ROKAS_RightHand_Editable.blend" \
            --output "$RUNNER_TEMP/right_hand_preview/QA" --frame 32
          test -s "$RUNNER_TEMP/right_hand_preview/QA/NAIL_ONLY_frame32.png"
          test -s "$RUNNER_TEMP/right_hand_preview/QA/CUFF_ONLY_frame32.png"
          test -s "$RUNNER_TEMP/right_hand_preview/QA/HAND_ONLY_frame32.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ROKAS-RightHand-PRODUCTION-POSES
          path: ${{ runner.temp }}/right_hand_preview/
          retention-days: 14
          if-no-files-found: warn
