      - name: Commit editor-only repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rokas-scene-composer-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/vn-scene-composer-p7-apply.yml
          git add Assets/Rokas/Scripts/Editor/VnUiWorkshop
          git diff --cached --check
          git commit -m 'fix(vn-composer): wire P7 P8 rendered playback'
          git push origin HEAD:feature/vn-scene-composer
