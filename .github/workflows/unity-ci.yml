name: ROKAS Unity CI

on:
  workflow_dispatch:
  push:
    branches:
      - ci/home-atmosphere-final-verify

permissions:
  contents: read
  checks: write

concurrency:
  group: Unity-CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-tests:
    name: ROKAS Unity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified production tree
        uses: actions/checkout@v7
        with:
          ref: ac309891a890a347ce61f1af1753c790db4dd200

      - name: Confirm exact verified production tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD^{tree})" = "d7573a20cf25112a6880bac5b0c2f0ca2d99048d"
          echo "Verified tree: $(git rev-parse HEAD^{tree})"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Run EditMode and PlayMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: All
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ROKAS Unity Tests

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rokas-unity-test-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn
