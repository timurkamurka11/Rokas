name: ROKAS Checkpoint Ref Verify

on:
  workflow_dispatch:
  push:
    branches:
      - ci/home-atmosphere-final-verify

permissions:
  contents: read

concurrency:
  group: Checkpoint-Ref-Verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-checkpoint-ref:
    name: Verify feature checkout equals remote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final feature checkpoint
        uses: actions/checkout@v7
        with:
          ref: feature/messages-system
          fetch-depth: 0

      - name: Verify local HEAD, remote feature HEAD, tree, and development guard
        shell: bash
        run: |
          set -euo pipefail
          expected_head="a53cac5e242b97ea75b7ec1c4ab3eeaaaace16f9"
          expected_tree="d7573a20cf25112a6880bac5b0c2f0ca2d99048d"
          expected_development="5e494f188b90bdb6916e8e78e35ac38509bd0bce"

          local_head="$(git rev-parse HEAD)"
          local_tree="$(git rev-parse HEAD^{tree})"
          remote_feature="$(git ls-remote origin refs/heads/feature/messages-system | awk '{print $1}')"
          remote_development="$(git ls-remote origin refs/heads/development | awk '{print $1}')"

          echo "LOCAL_HEAD=$local_head"
          echo "LOCAL_TREE=$local_tree"
          echo "REMOTE_FEATURE_HEAD=$remote_feature"
          echo "REMOTE_DEVELOPMENT_HEAD=$remote_development"

          test "$local_head" = "$expected_head"
          test "$remote_feature" = "$expected_head"
          test "$local_head" = "$remote_feature"
          test "$local_tree" = "$expected_tree"
          test "$remote_development" = "$expected_development"
