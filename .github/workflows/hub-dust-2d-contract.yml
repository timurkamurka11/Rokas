name: ROKAS Hub Dust V10 nocturne window and glint
on:
  push:
    branches: [codex/fidelity3-resume-5779190]
    paths:
      - 'Assets/Rokas/Scripts/Presentation/HubDustCanvasGraphic.cs'
      - 'Assets/Rokas/Resources/Shaders/HubDustSoftMotes.shader'
      - 'Assets/Rokas/Tests/EditMode/HubDustCanvasEditModeTests.cs'
      - '.github/workflows/hub-dust-2d-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V10 keeps V9 sizes and adds cyan nocturne, CRT and seeded glints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Assets/Rokas')
          gfx=(root/'Scripts/Presentation/HubDustCanvasGraphic.cs').read_text()
          shader=(root/'Resources/Shaders/HubDustSoftMotes.shader').read_text()
          tests=(root/'Tests/EditMode/HubDustCanvasEditModeTests.cs').read_text()
          atlas=(root/'Scripts/Presentation/HubDustAtlasFactory.cs').read_text()
          view=(root/'Scripts/Presentation/RokasView.cs').read_text()

          assert 'm_CustomRenderPipeline: {fileID: 0}' in Path('ProjectSettings/GraphicsSettings.asset').read_text()
          assert view.index('background = ui.Art') < view.index('HubDust_ThreeLayerAtmosphere') < view.index('scene = ui.Rect')
          for s in ('hubDust.maskable = false','dustGroup.blocksRaycasts = false',
                    'hubDust.raycastTarget = false',
                    'session.State.lampOn, session.HallwayLightOn,',
                    'LaptopPowerSession.PoweredOn'):
              assert s in view,s
          for s in ('public const int ParticleCount = 145;',
                    'public const int GeneralAirCount = 85;',
                    'public const int MicroCount = 120;',
                    'public const int SmallCount = 25;',
                    'public const int BokehCount = 0;',
                    'public const float MaximumQuadSize = 10.5f;',
                    'Mathf.Lerp(4.8f, 8f','Mathf.Lerp(8f, 10.5f',
                    'int order = (i * 73) % ParticleCount;',
                    'm.shape + m.kind * 10, m.glintSeed',
                    'Mathf.Min(diameter, MaximumQuadSize)',
                    'float rotation = 0f;',
                    'V10_NOCTURNE_WINDOW_AND_GLINT',
                    'public static float WindowGlassContribution',
                    'public static float WindowSpillContribution',
                    'public static float CrtContribution',
                    'public static float NocturneField',
                    'public static float WindowTealMix',
                    'public static float SpecularGlint',
                    'glintSeed = (i * 89 + 31) % 251',
                    'Time.unscaledDeltaTime',
                    'unscaledDt / LightTransitionSeconds',
                    'private const float LightTransitionSeconds = .40f',
                    'NightVisibilityThreshold = .135f',
                    'float warmAlpha = EvaluateDustAlpha',
                    'float nightAlpha = EvaluateDustAlpha',
                    'Color tint = Color.Lerp(nocturneTint, warmTint',
                    'NocturneCore = new Color(.62f, .92f, 1f)',
                    'NocturneHalo = new Color(.28f, .68f, .96f)',
                    'maxParticleQuadSize=',
                    'lightBlendFactor=','meanAlpha=','maxAlpha=',
                    'canvasRenderer.SetTexture(ownedAtlas)',
                    'canvasRenderer.SetMaterial(materialForRendering, 0)'):
              assert s in gfx,s

          assert gfx.count('AddRadialGlow(vh, rc, sx, sy,') == 6
          assert 'AddLightShafts(' not in gfx
          assert 'Mathf.Lerp(28f, 48f' not in gfx
          for s in ('.13f, .34f, .22f, .28f, .100f',
                    '.63f, .58f, .24f, .26f, .105f',
                    '.40f, .49f, .32f, .36f, .085f',
                    '.94f, .35f, .10f, .14f, .030f'):
              assert s in gfx,s

          for s in ('Blend One OneMinusSrcAlpha',
                    'float _DustAge;',
                    'float glintSeed=floor(i.uv.y*.5+.001)',
                    'i.uv.y-glintSeed*2.0',
                    'glintSeed*43.7)),14.0',
                    'half3 creamCore=half3(1.00,.89,.62)',
                    'half3 amberHalo=half3(.96,.74,.38)',
                    'half3(.62,.92,1.00)',
                    'half3(.28,.68,.96)',
                    '(.70 + .30 * glintWave)',
                    'tex2D(_DustAtlasTex,atlasUv).a',
                    'return fixed4(i.color.rgb*glow,0.0)',
                    'if (_DustMode>1.5)'):
              assert s in shader,s
          assert 'public const int Width = 1024;' in atlas
          assert 'public const int Height = 512;' in atlas
          assert 'TextureFormat.RGBA32' in atlas

          for method in ('V10Exactly145MotesAndNoLargeBokeh',
                         'V10NoQuadEverExceeds10Point5Pixels',
                         'V10WarmMicroSparklesAndSoftMoteCeilings',
                         'V10RealUnityMeshTelemetryAndNightWindowColorPass',
                         'V10LightTransitionIsUnscaledAndRunsForPointFourSeconds',
                         'V10IndependentSeededMicroGlintsDoNotChangeParticleCount',
                         'V10WindowTealMixStaysWithinFortyFivePercent',
                         'V10OnlyShowsDiagnosticWhenExplicitlySelected'):
              assert method in tests,method

          for p in (root/'Scripts/Presentation/HubDustCanvasGraphic.cs',
                    root/'Scripts/Presentation/HubDustAtlasFactory.cs',
                    root/'Resources/Shaders/HubDustSoftMotes.shader',
                    root/'Tests/EditMode/HubDustCanvasEditModeTests.cs'):
              assert p.with_name(p.name+'.meta').exists(),p
              assert p.read_text().count('{')==p.read_text().count('}'),p
          print('PASS V10: V9 warm unchanged, 145 motes <=10.5 px, seeded specular, 0.40s crossfade, 6 glows, cyan night mesh tests')
          PY
