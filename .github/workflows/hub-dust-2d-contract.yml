name: ROKAS Hub Dust V4 visible GPU submit contract
on:
  push:
    branches: [codex/fidelity3-resume-5779190]
    paths:
      - 'Assets/Rokas/Scripts/Presentation/HubDustCanvasGraphic.cs'
      - 'Assets/Rokas/Scripts/Presentation/RokasView.cs'
      - 'Assets/Rokas/Resources/Shaders/HubDustSoftMotes.shader'
      - 'Assets/Rokas/Tests/EditMode/HubDustCanvasEditModeTests.cs'
      - '.github/workflows/hub-dust-2d-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the actual Unity Built-in 2.5D hub receives dust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('Assets/Rokas')
          graphics=Path('ProjectSettings/GraphicsSettings.asset').read_text()
          assert 'm_CustomRenderPipeline: {fileID: 0}' in graphics
          view=(root/'Scripts/Presentation/RokasView.cs').read_text()
          graphic=(root/'Scripts/Presentation/HubDustCanvasGraphic.cs').read_text()
          shader=(root/'Resources/Shaders/HubDustSoftMotes.shader').read_text()
          assert 'HubDust_ThreeLayerAtmosphere' in view
          assert view.index('background = ui.Art') < view.index('HubDust_ThreeLayerAtmosphere') < view.index('scene = ui.Rect')
          assert 'session.State.lampOn, session.HallwayLightOn' in view
          assert 'homeSubLocation == HomeLocation.MainRoom' in view
          assert 'hubDust.raycastTarget = false' in view
          assert 'ParticleCount = 432' in graphic
          assert 'i < 281 ? 0 : i < 389 ? 1 : 2' in graphic
          assert 'RoomLampContribution' in graphic and 'HallwayContribution' in graphic and 'WindowContribution' in graphic
          assert 'Resources.Load<Shader>("Shaders/HubDustSoftMotes")' in graphic
          assert 'Shader "ROKAS/UI/HubDustSoftMotes"' in shader
          assert 'Blend SrcAlpha OneMinusSrcAlpha' in shader
          assert 'Fallback Off' in shader
          assert (root/'Tests/EditMode/HubDustCanvasEditModeTests.cs').is_file()
          for f in [
            root/'Scripts/Presentation/HubDustCanvasGraphic.cs',
            root/'Resources/Shaders/HubDustSoftMotes.shader',
            root/'Tests/EditMode/HubDustCanvasEditModeTests.cs']:
            assert f.with_name(f.name+'.meta').is_file(),str(f)
            content=f.read_text()
            assert content.count('{')==content.count('}'),str(f)
          assert 'EvaluateDustAlpha' in graphic
          assert '1748f,345f' in graphic and '138f,458f' in graphic
          assert 'HubDust V4' in graphic and 'LastVisibleMotes' in graphic
          assert 'V2DustIsVisibleNearActualHubLightSources' in (root/'Tests/EditMode/HubDustCanvasEditModeTests.cs').read_text()
          assert 'shape = rng.Next(0,8)' in graphic
          assert 'Triangular(System.Random rng)' in graphic
          assert 'visibilityGain = 1.62f' in graphic
          assert 'particleScale = 1.28f' in graphic
          assert 'float ShapeAlpha(float shape, float2 uv)' in shader
          assert shader.count('shape <') == 7
          assert 'smoothstep(.78,.98,r)' in shader
          assert 'pow(saturate(a*edge),.72)' in shader
          assert '4x2 dust' in shader
          tests=(root/'Tests/EditMode/HubDustCanvasEditModeTests.cs').read_text()
          assert 'V3StudioVisibilityControlsRemainBounded' in tests
          assert 'Assert.AreEqual(432, dust.ParticleBudget)' in tests
          assert 'BothLightsFollowExistingHubSwitchesAtRealPositions' in tests
          assert 'V4FirstRoomFrameMustNotSuppressDustToTwentyEightPercent' in tests
          assert 'V4HasDeterministicOpacityTelemetryForGpuDiagnosis' in tests
          assert 'if (showRoom && !hasEverShown)' in graphic
          assert 'LastMeanVertexAlpha' in graphic
          assert 'meanVertexAlpha=' in graphic
          print('PASS HubDust V4: immediate first-frame visibility, higher lit-pixel coverage, shader shape lift, inspector gains, opacity telemetry')
          PY
