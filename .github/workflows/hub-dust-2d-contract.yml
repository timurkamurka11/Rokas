name: ROKAS Hub Dust V5 final integration gate
on:
  push:
    branches: [codex/fidelity3-resume-5779190]
    paths:
      - 'Assets/Rokas/Scripts/Presentation/HubDustCanvasGraphic.cs'
      - 'Assets/Rokas/Scripts/Presentation/HubDustAtlasFactory.cs'
      - 'Assets/Rokas/Scripts/Presentation/RokasView.cs'
      - 'Assets/Rokas/Resources/Shaders/HubDustSoftMotes.shader'
      - 'Assets/Rokas/Tests/EditMode/HubDustCanvasEditModeTests.cs'
      - '.github/workflows/hub-dust-2d-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 1024px atlas generation, premultiplied GPU pipeline, UI ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Assets/Rokas')
          view=(root/'Scripts/Presentation/RokasView.cs').read_text()
          gfx=(root/'Scripts/Presentation/HubDustCanvasGraphic.cs').read_text()
          factory=(root/'Scripts/Presentation/HubDustAtlasFactory.cs').read_text()
          shader=(root/'Resources/Shaders/HubDustSoftMotes.shader').read_text()
          tests=(root/'Tests/EditMode/HubDustCanvasEditModeTests.cs').read_text()
          assert 'm_CustomRenderPipeline: {fileID: 0}' in Path('ProjectSettings/GraphicsSettings.asset').read_text()
          assert view.index('background = ui.Art') < view.index('HubDust_ThreeLayerAtmosphere') < view.index('scene = ui.Rect')
          assert 'hubDust.maskable = false' in view
          assert 'dustGroup.blocksRaycasts = false' in view
          assert 'hubDust.raycastTarget = false' in view
          assert 'session.State.lampOn, session.HallwayLightOn' in view
          assert 'HubDustAtlasFactory.Create()' in gfx
          assert 'public const int Width = 1024;' in factory
          assert 'public const int Height = 512;' in factory
          assert 'public const int CellSize = 256;' in factory
          for tok in ('TextureFormat.RGBA32','TextureWrapMode.Clamp','FilterMode.Bilinear',
                      'new Color32(255,255,255','if (r>=.88f) return 0f','EvaluateCellShape'):
              assert tok in factory,tok
          assert 'Texture2D.whiteTexture' in gfx
          assert 'base.UpdateMaterial()' in gfx
          assert 'canvasRenderer.SetTexture(ownedAtlas)' in gfx
          assert 'canvasRenderer.SetMaterial(materialForRendering, 0)' in gfx
          assert 'ownedMaterial.SetTexture("_DustAtlasTex", ownedAtlas)' in gfx
          assert 'Blend One OneMinusSrcAlpha' in shader
          assert 'tex2D(_DustAtlasTex,atlasUv).a' in shader
          assert 'hotCore=exp(-radius*radius*18.0)*1.6' in shader
          assert 'outAlpha=saturate(vertexAlpha*visibleProfile)' in shader
          assert 'float3 rgb;' in shader
          assert 'SoftShaft' in shader and 'AddLightShafts(vh,rc,toX,toY)' in gfx
          assert 'HighContrastBoost' in gfx and 'DiagnosticTestPattern' in gfx
          assert 'DebugVisibility' in gfx and 'enum HubDustVisibilityMode' in gfx
          for p in [root/'Scripts/Presentation/HubDustCanvasGraphic.cs',
                    root/'Scripts/Presentation/HubDustAtlasFactory.cs',
                    root/'Resources/Shaders/HubDustSoftMotes.shader',
                    root/'Tests/EditMode/HubDustCanvasEditModeTests.cs']:
              assert p.with_name(p.name+'.meta').is_file(),p
              source=p.read_text()
              assert source.count('{')==source.count('}'),p
          for method in ['V5TrueEightBitHighResolutionAtlasIsGeneratedOnlyOnce',
                         'V5RealCanvasModesAndScreenIntensityDoNotBreakGameplay',
                         'V5SingleLightingAttenuationPreservesLitDustAndDarkShadow',
                         'V4FirstRoomFrameMustNotSuppressDustToTwentyEightPercent']:
              assert method in tests,method
          assert not (root/'Resources/HubDust/T_RokasDustAtlas_4x2_Alpha.png').exists()
          print('PASS: V5 full-RGBA32 1024x512 atlas, UI texture/material, premul, lit-core halo, local shafts, 3 debug modes, source/UI tests')
          PY
