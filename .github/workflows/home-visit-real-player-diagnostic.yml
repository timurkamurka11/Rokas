name: ROKAS Home Visit Real Windows Player Diagnostic

on:
  push:
    branches:
      - feature/startup-skip-hint-laptop-boot-per-home-visit
    paths:
      - .github/workflows/home-visit-real-player-diagnostic.yml
      - Assets/Rokas/Scripts/Presentation/RokasHomeVisitRuntimeProbe.cs
      - Assets/Rokas/Scripts/Presentation/RokasHomeVisitRuntimeProbe.cs.meta

permissions:
  contents: read

concurrency:
  group: rokas-home-visit-real-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-player:
    name: Build exact Development Windows Player
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: HomeVisitRealPlayer-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StartupLaptopVideo-WindowsBuild-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Build StandaloneWindows64 Development Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: Rokas
          buildMethod: Rokas.Editor.RokasVideoSmokeBuild.Build

      - name: Preserve build identity and packaged media hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p home-visit-build-evidence
          git rev-parse HEAD > home-visit-build-evidence/head.txt
          git rev-parse HEAD^{tree} > home-visit-build-evidence/tree.txt
          EXE="$(find build -type f -iname 'Rokas.exe' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          STARTUP="$(find build -type f -path '*/StreamingAssets/RokasVideo/StartupPreview.mp4' -print -quit)"
          LAPTOP="$(find build -type f -path '*/StreamingAssets/RokasVideo/LaptopBoot.mp4' -print -quit)"
          test -n "$STARTUP" && test -s "$STARTUP"
          test -n "$LAPTOP" && test -s "$LAPTOP"
          sha256sum "$STARTUP" "$LAPTOP" > home-visit-build-evidence/packaged-media-sha256.txt
          test "$(sha256sum "$STARTUP" | awk '{print $1}')" = '28417ed9f1d6d12b1283e7ccb80c72fc910e8d326533a554245734efa3a2f240'
          test "$(sha256sum "$LAPTOP" | awk '{print $1}')" = '111036b0768a6be45202ae674c7815d9e78760e852ef28426255501a3717fa9a'
          find build -type f -printf '%p %s bytes\n' | sort > home-visit-build-evidence/build-manifest.txt
          printf 'EXE=%s\nSTARTUP=%s\nLAPTOP=%s\n' "$EXE" "$STARTUP" "$LAPTOP" > home-visit-build-evidence/paths.txt

      - name: Upload complete diagnostic Windows player
        uses: actions/upload-artifact@v7
        with:
          name: rokas-home-visit-diagnostic-player
          path: build/StandaloneWindows64
          if-no-files-found: error

      - name: Upload diagnostic build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rokas-home-visit-build-evidence
          path: home-visit-build-evidence
          if-no-files-found: warn

  run-player:
    name: Run real Player contract lifecycle on Windows host
    needs: build-player
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download exact built player
        uses: actions/download-artifact@v8
        with:
          name: rokas-home-visit-diagnostic-player
          path: player

      - name: Run actual Rokas.exe with diagnostic flag
        id: player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path player -Filter Rokas.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Rokas.exe not found in downloaded artifact.' }
          $work = $exe.Directory.FullName
          $evidence = Join-Path $work 'rokas-home-visit-smoke'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $log = Join-Path $evidence 'Player.log'
          $stdout = Join-Path $evidence 'host-stdout.txt'
          $stderr = Join-Path $evidence 'host-stderr.txt'
          $exitFile = Join-Path $evidence 'host-exit.txt'
          $timeoutFile = Join-Path $evidence 'host-timeout.txt'
          $args = @('-rokasHomeVisitSmoke', '-logFile', $log)
          $process = Start-Process -FilePath $exe.FullName -ArgumentList $args -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $completed = $process.WaitForExit(110000)
          if (-not $completed) {
            try { $process.Kill($true) } catch { }
            'YES' | Set-Content $timeoutFile
            '124' | Set-Content $exitFile
          } else {
            'NO' | Set-Content $timeoutFile
            [string]$process.ExitCode | Set-Content $exitFile
          }
          "EXE=$($exe.FullName)" | Set-Content (Join-Path $evidence 'host-paths.txt')
          "WORKDIR=$work" | Add-Content (Join-Path $evidence 'host-paths.txt')
          Get-ChildItem -Path $evidence -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $evidence 'evidence-listing.txt')
          exit 0

      - name: Upload real-player diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rokas-home-visit-real-player-evidence
          path: player/**/rokas-home-visit-smoke
          if-no-files-found: warn

      - name: Require factual diagnostic result
        if: always()
        shell: pwsh
        run: |
          $result = Get-ChildItem -Path player -Filter rokas-home-visit-smoke-result.json -Recurse | Select-Object -First 1
          $exitFile = Get-ChildItem -Path player -Filter host-exit.txt -Recurse | Select-Object -First 1
          $timeoutFile = Get-ChildItem -Path player -Filter host-timeout.txt -Recurse | Select-Object -First 1
          if (-not $result) { throw 'Diagnostic result JSON was not produced.' }
          if (-not $exitFile -or -not $timeoutFile) { throw 'Host process evidence is incomplete.' }
          $exitCode = (Get-Content $exitFile.FullName -Raw).Trim()
          $timedOut = (Get-Content $timeoutFile.FullName -Raw).Trim()
          $data = Get-Content $result.FullName -Raw | ConvertFrom-Json
          Write-Host "HOST_EXIT=$exitCode TIMEOUT=$timedOut FINAL_PASS=$($data.finalPass)"
          Write-Host "RETURN sameView=$($data.sameViewAfterReturn) sameLaptop=$($data.sameLaptopAfterReturn) consumedBeforeVisit2=$($data.bootConsumedBeforeVisit2Open)"
          Write-Host "CLAIM sameView=$($data.sameViewAfterClaim) sameLaptop=$($data.sameLaptopAfterClaim) consumedAfterClaim=$($data.bootConsumedAfterClaim) unexpectedBoot=$($data.unexpectedSecondBootAfterPayment)"
          if ($timedOut -ne 'NO') { throw 'Real Windows Player diagnostic timed out.' }
          if ($exitCode -ne '0') { throw "Real Windows Player exited with $exitCode." }
          if (-not $data.finalPass) { throw "Home-visit diagnostic failed: $($data.failure)" }
