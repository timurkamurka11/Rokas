name: ROKAS Argon Living Hand — Focused EditMode QA
on:
  push:
    branches: [codex/bedsleep-argon-import-candidate]
    paths: ['Assets/Rokas/BedSleep/ArgonIntegration/REQUEST_LIVING_TEST.txt']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  long-idle-and-watch-input:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check authentic imported candidate sources
        shell: bash
        run: |
          set -euo pipefail
          test -s Assets/Rokas/BedSleep/ArgonCandidate/PF_Argon_Keiko_Hand_Watch_Preview.prefab
          test -s Assets/Rokas/BedSleep/ArgonIntegration/CandidateRuntime/ArgonLivingRig.cs
          test -s Assets/Rokas/BedSleep/ArgonIntegration/CandidateRuntime/ArgonWatchControls.cs
      - name: Unity 6000.3.19f1 focused original rig plus V10 router regressions
        uses: game-ci/unity-test-runner@v4.3.1
        id: unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: EditMode
          customParameters: -testFilter Rokas.BedSleep.Argon.Editor.RokasArgonLivingHandRegressionTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ROKAS Argon 2000-frame no-drift and V10 watch routing
      - name: Upload focused test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Argon-Living-Hand-Focused-QA
          path: |
            ${{ steps.unity.outputs.artifactsPath }}
            Artifacts/ArgonSeamLayers/*.png
            Artifacts/ArgonSeamLayers/ArgonOriginalPinkyMeshTopology.txt
            Artifacts/ArgonSeamLayers/ArgonSkinnedVertices_BakeMesh_BeforeAfter.txt
            Artifacts/ArgonSeamLayers/RestPreservingFingerCandidate_Results.txt
          if-no-files-found: warn
          retention-days: 7
