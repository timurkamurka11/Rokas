name: TEMP VN Migration Ref Bridge

on:
  push:
    branches:
      - feature/vn-visual-polish-refs

permissions:
  contents: write

jobs:
  fast-forward-migration-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create migration commit on actual HEAD and fast-forward ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESIRED_TREE: 6496c53962fb34857cc7d7b3faac57146b94578b
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          payload=$(jq -n \
            --arg message 'test: migrate VN presentation regressions to portrait-free panels' \
            --arg tree "$DESIRED_TREE" \
            --arg parent "$GITHUB_SHA" \
            '{message:$message, tree:$tree, parents:[$parent]}')
          curl -fsS "${auth[@]}" -X POST "$api/git/commits" -d "$payload" -o /tmp/migration-commit.json
          new_sha=$(jq -r '.sha // empty' /tmp/migration-commit.json)
          test -n "$new_sha"
          echo "Created migration commit $new_sha from parent $GITHUB_SHA"

          ref_payload=$(jq -n --arg sha "$new_sha" '{sha:$sha, force:false}')
          curl -fsS "${auth[@]}" -X PATCH \
            "$api/git/refs/heads/feature/vn-visual-polish-refs" \
            -d "$ref_payload" -o /tmp/ref-update.json
          test "$(jq -r '.object.sha' /tmp/ref-update.json)" = "$new_sha"
          echo "Fast-forwarded feature/vn-visual-polish-refs to $new_sha with force=false"
