# Temporary Task 9 diagnostic harness. Delete after permanent CI is proven.
name: ROKAS VN Intro Regression Temp

on:
  push:
    branches:
      - feature/vn-intro-yarn-flow
    paths:
      - .github/workflows/vn-intro-regression-temp.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  isolated-first-loop:
    name: Isolated FirstLoop attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated FirstLoop regression
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          cliVersion: v0.1.60
          testMode: PlayMode
          customParameters: -testFilter Rokas.Tests.FirstLoopTests.IllustratedHomeCanAcceptFightReturnAndClaimExactlyOnce
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: FirstLoop Isolated ${{ matrix.attempt }}
          artifactsPath: artifacts-first-loop-${{ matrix.attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vn-first-loop-isolated-${{ matrix.attempt }}-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 2
          if-no-files-found: warn
