# Temporary Task 9 visual TDD harness. Delete after permanent CI is proven.
name: ROKAS VN Intro Regression Temp

on:
  push:
    branches:
      - feature/vn-intro-yarn-flow
    paths:
      - .github/workflows/vn-intro-regression-temp.yml
      - Assets/Rokas/Tests/PlayMode/VnIntroVisualLayoutPlayModeTests.cs
      - Assets/Rokas/Scripts/Presentation/VnIntroView.cs
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  visual-vn:
    name: VN visual layout focused PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run focused VN visual tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          cliVersion: v0.1.60
          testMode: PlayMode
          customParameters: -testFilter Rokas.Tests.VnIntroVisualLayoutPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Visual Layout Focused
          artifactsPath: artifacts-vn-visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vn-visual-focused-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 2
          if-no-files-found: warn
