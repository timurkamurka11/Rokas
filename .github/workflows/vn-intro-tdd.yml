name: ROKAS VN Intro Permanent CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vn-intro-yarn-flow
      - feature/vn-visual-polish-refs

permissions:
  contents: read
  checks: write

concurrency:
  group: vn-intro-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.19f1

jobs:
  preflight:
    name: VN asset/meta preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact VN asset bytes, GUIDs and metas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          expected = {
              'Assets/Rokas/Art/VN/Characters/Keiko_CharacterSheet.png': ('8c0790bdf572d77cf6ed049958cc8a5a56a18d7cffff763798879933954e450d', '3b12ebbf615043e08930b9c5a8ea0729'),
              'Assets/Rokas/Art/VN/Characters/Mina_CharacterSheet.png': ('6c2000d56575f61d72047b90482c9ec9bb3c856960a9fb4899ef5131ca9686c4', 'e52662476ff8453398af0fdc67cd826b'),
              'Assets/Rokas/Art/VN/Backgrounds/VN_BusStop_Rain_Night.png': ('05075716b89159e8363819872bbdc11c5c58ecadc804bab18ab88a7e3c72b99b', '88761c34d7af479ea57efce7073ff8d4'),
              'Assets/Rokas/Art/VN/Backgrounds/VN_NightSky_Rain.png': ('a44004677fb4f91ab7672287c546749a47f6b936b735e6aaaf6a48d63ea9afdd', 'f1d5938f848445e4ad08dd5bae267331'),
              'Assets/Rokas/Art/VN/Scenes/VN_BusStop_PhoneMessage_Mina.png': ('32d6ed87f12e84da93551a0b4bf69b419263f52738322cb8df276c067e137d90', '9c2f79c3cced4cf8a053f688b23ef550'),
              'Assets/Rokas/Art/VN/UI/Dialogue/VN_DialoguePanel_Keiko_Dark.png': ('2e2ee78b32ba1f9d8a1726800e64df18f354ffcb357092e919c43ebbc0386cb7', '66e03e45e4f849e4a8471bc16d6aa83d'),
              'Assets/Rokas/Art/VN/UI/Dialogue/VN_DialoguePanel_Mina_Light.png': ('76e0c057fb5cf125fcadbb8a2a11deab50accb6caa6b221c21f300a67ee5a987', 'db6ce06f7a32417097fc2b2b6376c2d3'),
              'Assets/Rokas/Art/VN/UI/Controls/VN_Icon_Mute.png': ('3ad3dba67de8cf7e4c2c4a245603b7310b61ff79b4a91c55e5c0691c1e451cce', '2f5e850b083e492b98543042d08f4183'),
              'Assets/Rokas/Art/VN/UI/Controls/VN_Icon_Pause.png': ('4796c6a1250613d089e0d56a8b50b4b5d8d362cd0cbbcbbf9d4a021b727053b6', '822d84e02e9c4e6d852c326be3fa59af'),
              'Assets/Rokas/Art/VN/UI/Controls/VN_Icon_Skip.png': ('dce53d56bb0c987f6ef18dae019ae19cf00bc43ebd17d12a9bdd5d9bf192dc28', '1ad7baf7a6854af8877153bf25dee46a'),
          }
          root = Path('Assets/Rokas/Art/VN')
          actual = {p.as_posix() for p in root.rglob('*.png')}
          if actual != set(expected):
              raise SystemExit(f'VN manifest mismatch. missing={sorted(set(expected)-actual)} extra={sorted(actual-set(expected))}')

          guid_re = re.compile(r'^guid:\s*([0-9a-f]{32})\s*$', re.MULTILINE)
          seen = set()
          for path, (sha, guid) in expected.items():
              asset = Path(path)
              meta = Path(path + '.meta')
              if not asset.is_file() or not meta.is_file():
                  raise SystemExit(f'Missing asset/meta pair: {path}')
              actual_sha = hashlib.sha256(asset.read_bytes()).hexdigest()
              if actual_sha != sha:
                  raise SystemExit(f'SHA256 mismatch for {path}: {actual_sha}')
              match = guid_re.search(meta.read_text(encoding='utf-8'))
              if not match or match.group(1) != guid:
                  raise SystemExit(f'GUID mismatch for {meta}: {match.group(1) if match else "missing"}')
              if guid in seen:
                  raise SystemExit(f'Duplicate VN GUID inside approved pack: {guid}')
              seen.add(guid)

          global_hits = {guid: [] for guid in seen}
          for meta in Path('Assets').rglob('*.meta'):
              try:
                  text = meta.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              match = guid_re.search(text)
              if match and match.group(1) in global_hits:
                  global_hits[match.group(1)].append(meta.as_posix())
          bad = {guid: hits for guid, hits in global_hits.items() if len(hits) != 1}
          if bad:
              raise SystemExit(f'VN GUID collision/missing metadata: {bad}')

          assets_yaml = Path('Assets/Rokas/Resources/RokasAssets.asset').read_text(encoding='utf-8')
          missing_refs = sorted(guid for guid in seen if guid not in assets_yaml)
          if missing_refs:
              raise SystemExit(f'RokasAssets.asset missing VN GUID references: {missing_refs}')
          print('Verified exact 10 approved VN PNGs, SHA256 values, unique Unity GUIDs, metas, and RokasAssets references.')
          PY
      - name: Verify repository diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

  focused-editmode:
    name: VN focused EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Run VN progress EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Core.Tests.VnIntroProgressTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Intro Focused EditMode
          artifactsPath: artifacts-focused-editmode
      - name: Upload focused EditMode evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-focused-editmode-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  focused-playmode:
    name: VN focused PlayMode - ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: flow
            filter: Rokas.Tests.VnIntroPlayModeTests
            artifact: flow
          - label: visual-layout
            filter: Rokas.Tests.VnIntroVisualLayoutPlayModeTests
            artifact: visual-layout
          - label: responsive-layout
            filter: Rokas.Tests.VnIntroResponsiveLayoutPlayModeTests
            artifact: responsive-layout
          - label: runtime-proof-harness
            filter: Rokas.Tests.VnIntroRuntimeProofHarnessPlayModeTests
            artifact: runtime-proof-harness
    steps:
      - uses: actions/checkout@v7
      - name: Run VN focused PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter ${{ matrix.filter }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Intro Focused PlayMode - ${{ matrix.label }}
          artifactsPath: artifacts-focused-playmode-${{ matrix.artifact }}
      - name: Upload focused PlayMode evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-focused-playmode-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  legacy-playmode:
    name: Legacy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Main Menu interaction/audio
            filter: Rokas.Tests.MainMenuInteractionAudioTransitionPlayModeTests
            artifact: main-menu-interaction
          - label: Story/Main Menu
            filter: Rokas.Tests.StoryIntroMainMenuPlayModeTests
            artifact: story-main-menu
    steps:
      - uses: actions/checkout@v7
      - name: Run legacy PlayMode regression
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter ${{ matrix.filter }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Legacy ${{ matrix.label }}
          artifactsPath: artifacts-${{ matrix.artifact }}
      - name: Upload legacy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-legacy-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  full-editmode:
    name: Full Unity EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Run complete EditMode suite
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Full EditMode
          artifactsPath: artifacts-full-editmode
      - name: Upload full EditMode evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-full-editmode-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  full-playmode:
    name: Full Unity PlayMode (Linux known VideoPlayer classifier)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - name: Run complete PlayMode suite
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Full PlayMode
          artifactsPath: artifacts-full-playmode
      - name: Classify only the five known Linux VideoPlayer failures
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          allowed = {
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.ClosingLaptopDuringBootCancelsWithoutDesktopAndReopenIsReady',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.CommittedLaptopMediaProducesAFrameThenDesktopAndCleansUp',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.CommittedStartupAndStoryMediaProduceFramesThenMenuAndHomeOnce',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.LaptopOpeningShowsBootGateBeforeDesktop',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.RealStartDoesNotBuildHomeBeforeStartupVideoGate',
          }
          xmls = list(Path('artifacts-full-playmode').rglob('*.xml'))
          if len(xmls) != 1:
              raise SystemExit(f'Expected exactly one PlayMode result XML, found: {xmls}')
          root = ET.parse(xmls[0]).getroot()
          failed = []
          for case in root.iter('test-case'):
              if case.attrib.get('result') != 'Failed':
                  continue
              name = case.attrib.get('fullname') or case.attrib.get('name') or ''
              failure = case.find('failure')
              text = '' if failure is None else '\n'.join([
                  failure.findtext('message', default='') or '',
                  failure.findtext('stack-trace', default='') or '',
              ])
              failed.append((name, text))

          if not failed:
              if os.environ.get('TEST_OUTCOME') != 'success':
                  raise SystemExit('Unity test action failed without test failures; refusing to classify infrastructure/compiler failure.')
              print('Full Linux PlayMode suite is fully GREEN.')
          else:
              names = {name for name, _ in failed}
              if len(failed) != 5 or names != allowed:
                  raise SystemExit(f'Unexpected Linux PlayMode failure set: {sorted(names)}')
              for name, text in failed:
                  if 'VideoPlayer cannot play url' not in text:
                      raise SystemExit(f'{name}: failure does not match known VideoPlayer signature')
                  if 'StartupPreview.mp4' not in text and 'LaptopBoot.mp4' not in text:
                      raise SystemExit(f'{name}: failure does not reference the known packaged videos')
              print('CLASSIFIED_KNOWN_LINUX_VIDEOPLAYER_FAILURES=5/5')
          PY
      - name: Upload full PlayMode evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-full-playmode-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  build-windows-player:
    name: Windows Development Player
    needs:
      - preflight
      - focused-editmode
      - focused-playmode
      - legacy-playmode
      - full-editmode
      - full-playmode
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: VNIntro-WindowsBuild-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            VNIntro-WindowsBuild-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Build exact StandaloneWindows64 Development Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: Rokas
          buildMethod: Rokas.Editor.RokasVideoSmokeBuild.Build
      - name: Verify Development Player package
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find build -type f -iname 'Rokas.exe' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          BUILD_ROOT="$(dirname "$EXE")"
          test -d "$BUILD_ROOT/Rokas_Data"
          test -s "$BUILD_ROOT/Rokas_Data/StreamingAssets/RokasVideo/StartupPreview.mp4"
          test -s "$BUILD_ROOT/Rokas_Data/StreamingAssets/RokasVideo/LaptopBoot.mp4"
          mkdir -p build-proof
          printf 'HEAD=%s\nTREE=%s\nEXE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$EXE" > build-proof/build-summary.txt
          sha256sum "$BUILD_ROOT/Rokas_Data/StreamingAssets/RokasVideo/StartupPreview.mp4" "$BUILD_ROOT/Rokas_Data/StreamingAssets/RokasVideo/LaptopBoot.mp4" > build-proof/packaged-video-sha256.txt
          find "$BUILD_ROOT" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort > build-proof/build-manifest.txt
      - name: Upload Windows Development Player
        uses: actions/upload-artifact@v7
        with:
          name: vn-windows-development-player-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 3
      - name: Upload Windows build evidence
        uses: actions/upload-artifact@v7
        with:
          name: vn-windows-build-proof-${{ github.sha }}
          path: build-proof
          if-no-files-found: error
          retention-days: 3

  windows-runtime-proof:
    name: Real Rokas.exe VN runtime + responsive screenshots
    needs: build-windows-player
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download Windows Development Player
        uses: actions/download-artifact@v4
        with:
          name: vn-windows-development-player-${{ github.sha }}
          path: build
      - name: Set Windows proof display resolution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run natural, skip and persisted bypass at required resolutions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build -Filter Rokas.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Rokas.exe was not found in downloaded build artifact.' }
          $proof = Join-Path $env:GITHUB_WORKSPACE 'vn-runtime-proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null

          function Invoke-RokasProof([string]$ResolutionName, [int]$Width, [int]$Height, [string]$Scenario) {
            $resolutionProof = Join-Path $proof $ResolutionName
            New-Item -ItemType Directory -Force -Path $resolutionProof | Out-Null
            $log = Join-Path $resolutionProof ("player-{0}.log" -f $Scenario)
            $arguments = @(
              '-rokasVnIntroProof',
              '-rokasVnIntroScenario', $Scenario,
              '-rokasVnIntroOutput', $resolutionProof,
              '-screen-fullscreen', '0',
              '-screen-width', $Width,
              '-screen-height', $Height,
              '-force-d3d11',
              '-logFile', $log
            )
            Write-Host "Launching real player: $ResolutionName $Scenario ($Width x $Height)"
            $process = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(180000)) {
              try { $process.Kill($true) } catch {}
              throw "Rokas.exe '$ResolutionName/$Scenario' timed out."
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 160 }
              throw "Rokas.exe '$ResolutionName/$Scenario' exited with code $($process.ExitCode)."
            }
          }

          $resolutions = @(
            @{ Name = '1280x720'; Width = 1280; Height = 720 },
            @{ Name = '1024x768'; Width = 1024; Height = 768 }
          )
          foreach ($resolution in $resolutions) {
            Invoke-RokasProof $resolution.Name $resolution.Width $resolution.Height 'natural'
            Invoke-RokasProof $resolution.Name $resolution.Width $resolution.Height 'skip'
            Invoke-RokasProof $resolution.Name $resolution.Width $resolution.Height 'bypass'
          }
      - name: Validate runtime JSON and exact screenshot dimensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $proof = Join-Path $env:GITHUB_WORKSPACE 'vn-runtime-proof'
          $resolutions = @(
            @{ Name = '1280x720'; Width = 1280; Height = 720 },
            @{ Name = '1024x768'; Width = 1024; Height = 768 }
          )
          $expectedPngs = @(
            'natural/natural-01-bus-stop.png',
            'natural/natural-02-night-sky.png',
            'natural/natural-03-mina-phone.png',
            'natural/natural-04-home.png',
            'skip/skip-01-before.png',
            'skip/skip-02-home.png',
            'bypass/bypass-01-home.png'
          )

          foreach ($resolution in $resolutions) {
            $resolutionProof = Join-Path $proof $resolution.Name
            foreach ($scenario in @('natural', 'skip', 'bypass')) {
              $jsonPath = Join-Path $resolutionProof "$scenario/vn-intro-proof-result.json"
              if (-not (Test-Path $jsonPath)) { throw "Missing runtime result: $jsonPath" }
              $data = Get-Content $jsonPath -Raw | ConvertFrom-Json
              if (-not $data.finalPass) { throw "$($resolution.Name)/$scenario runtime proof is not PASS: $($data.error)" }
              if ($data.scenario -ne $scenario) { throw "Scenario mismatch in $jsonPath" }
            }

            foreach ($relative in $expectedPngs) {
              $path = Join-Path $resolutionProof $relative
              if (-not (Test-Path $path)) { throw "Missing screenshot: $($resolution.Name)/$relative" }
              if ((Get-Item $path).Length -le 0) { throw "Empty screenshot: $($resolution.Name)/$relative" }
              $image = [System.Drawing.Image]::FromFile($path)
              try {
                if ($image.Width -ne $resolution.Width -or $image.Height -ne $resolution.Height) {
                  throw "Wrong screenshot size for $($resolution.Name)/$($relative): $($image.Width)x$($image.Height)"
                }
              }
              finally {
                $image.Dispose()
              }
            }
          }
          Write-Host 'REAL_ROKAS_EXE_RUNTIME_PROOF=PASS'
          Write-Host 'RUNTIME_SCENARIOS=natural,skip,bypass'
          Write-Host 'RESOLUTIONS=1280x720,1024x768'
          Write-Host 'SCREENSHOTS=14/14'
      - name: Upload real-player VN runtime proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-real-player-runtime-proof-${{ github.sha }}
          path: vn-runtime-proof
          if-no-files-found: warn
          retention-days: 5