name: ROKAS Argon - Source Finger Topology and Skin Quality Diagnosis
on:
  push:
    branches: [codex/bedsleep-argon-import-candidate]
    paths: ['Assets/Rokas/BedSleep/ArgonIntegration/REQUEST_TOPOLOGY_SKIN_DIAGNOSTIC.txt']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  source-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify genuine original skinned arm
        run: |
          test -s Assets/Rokas/BedSleep/ArgonSource/Models/ROKAS_Keiko_FPS_Arm_Rigged.fbx
          test -s Assets/Rokas/BedSleep/ArgonIntegration/Editor/RokasArgonTopologyMaterialDiagnosticTests.cs
      - name: Unity 6000.3.19f1 source cap loops and PBR map diagnosis
        uses: game-ci/unity-test-runner@v4.3.1
        id: unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: EditMode
          customParameters: -testFilter Rokas.BedSleep.Argon.Editor.RokasArgonTopologyMaterialDiagnosticTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ROKAS authentic finger cap topology + skin normal filtering
      - name: Keep grounded geometry/material report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROKAS-Argon-OriginalSource-Topology-Material
          path: |
            Artifacts/ArgonFingerTopology/*.txt
            ${{ steps.unity.outputs.artifactsPath }}
          retention-days: 14
          if-no-files-found: warn
