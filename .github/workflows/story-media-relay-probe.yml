name: ROKAS Story Media Relay Probe

on:
  push:
    branches:
      - feature/story-intro-main-menu
    paths:
      - .github/workflows/story-media-relay-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect temporary relay client context
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/YZDbPHr6uTja
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -A 'Mozilla/5.0' "$SHARE_URL" -o relay.html
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path('relay.html').read_text(errors='replace')
          scripts=sorted(set(re.findall(r'<script[^>]+src="([^"]+\.js)"', html)))
          for i,src in enumerate(scripts):
              url='https://firestorage.ai'+src if src.startswith('/') else src
              subprocess.run(['curl','-fsSL','--retry','3','-A','Mozilla/5.0',url,'-o',f'chunk-{i}.js'],check=True)
          corpus='\n'.join(Path(f'chunk-{i}.js').read_text(errors='replace') for i in range(len(scripts)))
          needles=('https://api.firestorage.ai/prod/file','files?maxResults=1000','/download','shareEndpoint','shares/${e[1]}')
          for needle in needles:
              print('\n===',needle,'===')
              start=0
              for _ in range(8):
                  pos=corpus.find(needle,start)
                  if pos < 0: break
                  print(corpus[max(0,pos-1200):pos+2200])
                  start=pos+len(needle)
          PY
