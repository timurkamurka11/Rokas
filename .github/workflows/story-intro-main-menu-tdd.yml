name: ROKAS Story Intro Main Menu TDD

on:
  push:
    branches:
      - feature/story-intro-main-menu
    paths:
      - .github/workflows/story-intro-main-menu-tdd.yml
      - Assets/Rokas/Tests/PlayMode/StoryIntroMainMenuPlayModeTests.cs
      - Assets/Rokas/Tests/PlayMode/StoryIntroMainMenuPlayModeTests.cs.meta
      - Assets/Rokas/Scripts/Presentation/RokasBootstrap.cs
      - Assets/Rokas/Scripts/Presentation/VideoSequencePresenter.cs
      - Assets/Rokas/Scripts/Presentation/MainMenuView.cs
      - Assets/Rokas/Scripts/Presentation/MainMenuView.cs.meta
      - Assets/StreamingAssets/RokasVideo/StoryIntro.mp4
      - Assets/StreamingAssets/RokasVideo/MainMenuLoop.mp4
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: story-intro-main-menu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-playmode:
    name: Focused Story Intro + Main Menu PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7

      - name: Verify exact approved media bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/StoryIntro.mp4 | cut -d' ' -f1)" = "4f1cf02df5e52f8dd75645ceb1c6b0d5b55b0eb952eee1371d742ca54395c6d4"
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/MainMenuLoop.mp4 | cut -d' ' -f1)" = "bb2eb60336c4b1e63a5b2a177c0db904b6d32bee5f59c48568def81cfa8beef5"
          test "$(stat -c%s Assets/StreamingAssets/RokasVideo/StoryIntro.mp4)" = "31848620"
          test "$(stat -c%s Assets/StreamingAssets/RokasVideo/MainMenuLoop.mp4)" = "2427109"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: StoryIntroMainMenu-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StoryIntroMainMenu-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run focused PlayMode tests
        id: focused
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StoryIntroMainMenuPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Story Intro Main Menu Focused Tests

      - name: Preserve exact test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git status --short --untracked-files=all > verification/post-unity-git-status.txt
          git diff --check > verification/git-diff-check.txt
          if [ -f artifacts/playmode-results.xml ]; then cp artifacts/playmode-results.xml verification/playmode-results.xml; fi

      - name: Require six focused tests green
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/playmode-results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse('artifacts/playmode-results.xml').getroot()
          values = tuple(int(r.attrib.get(k, '-1')) for k in ('total','passed','failed','skipped'))
          print('FOCUSED_XML total=%d passed=%d failed=%d skipped=%d' % values)
          if values != (6,6,0,0):
              raise SystemExit('Expected exactly 6/6 focused tests')
          PY

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-intro-main-menu-focused-evidence
          path: |
            ${{ steps.focused.outputs.artifactsPath }}
            verification
          if-no-files-found: warn

  final-tree-check:
    name: Exact Final Candidate Tree Check
    needs: focused-playmode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact verified commit into fresh workspace
        uses: actions/checkout@v7

      - name: Require clean tree, diff check and exact approved media
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short --untracked-files=all)"
          git diff --check
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/StoryIntro.mp4 | cut -d' ' -f1)" = "4f1cf02df5e52f8dd75645ceb1c6b0d5b55b0eb952eee1371d742ca54395c6d4"
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/MainMenuLoop.mp4 | cut -d' ' -f1)" = "bb2eb60336c4b1e63a5b2a177c0db904b6d32bee5f59c48568def81cfa8beef5"
          printf 'HEAD=%s\nTREE=%s\nGIT_STATUS=CLEAN\nGIT_DIFF_CHECK=PASS\nEXACT_MEDIA=PASS\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
