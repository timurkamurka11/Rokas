name: ROKAS Home Hallway Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - codex/home-hallway-expansion
    paths:
      - .github/workflows/home-hallway-expansion.yml
      - Assets/Rokas/Scripts/Core/State.cs
      - Assets/Rokas/Scripts/Core/GameSession.cs
      - Assets/Rokas/Scripts/Presentation/HomeView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs.meta
      - Assets/Rokas/Scripts/Presentation/RokasView.cs
      - Assets/Rokas/Resources/Home/HallwayReference.jpg
      - Assets/Rokas/Resources/Home/HallwayReference.jpg.meta
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs.meta
      - Assets/Rokas/Tests/Serialization/UnitySaveTests.cs

permissions:
  contents: read
  checks: write

concurrency:
  group: home-hallway-expansion-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.19f1
  HALLWAY_ASSET_SHA256: 34618076026b5f44676d05d471219cd38f77472cd1f88c822197e47736752fab

jobs:
  asset-integrity:
    name: Verify committed Hallway reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - name: Verify runtime JPEG
        shell: bash
        run: |
          set -euo pipefail
          image="Assets/Rokas/Resources/Home/HallwayReference.jpg"
          test -f "$image"
          test -f "${image}.meta"
          echo "$HALLWAY_ASSET_SHA256  $image" | sha256sum --check -
          file "$image"

  hallway:
    needs: asset-integrity
    name: Hallway routing + light matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run Hallway Home PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HallwayHomeExpansionPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Home Expansion

  save:
    needs: asset-integrity
    name: Hallway light persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run save compatibility tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.UnitySaveTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Save Compatibility

  hub-regression:
    needs: asset-integrity
    name: Existing Home + Workbench routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run existing Home visit / Laptop regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupSkipHintLaptopHomeVisitPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Existing Home Visit Regression
      - name: Run Laptop-only Workbench regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.WorkbenchUiPlayModeTests.WorkbenchIsLaptopOnlyAndLegacyRoomRouteBuildsNothing
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Workbench Remains Laptop Only

  visual-capture:
    name: Actual Hallway Unity screenshots
    needs: asset-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Capture Unity Hallway frames
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HallwayVisualCapturePlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Live Visual Captures
          artifactsPath: artifacts
      - name: Upload actual Unity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rokas-hallway-visual-captures
          path: artifacts/hallway-visual/*.png
          if-no-files-found: warn

  swords-regression:
    needs: asset-integrity
    name: Removed swords hotspot stays removed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run finished Home overlay regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HomeFinishedUiCleanupTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Swords Hotspot Remains Removed
