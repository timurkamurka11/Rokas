name: ROKAS Home Hallway Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - codex/home-hallway-expansion
    paths:
      - .github/workflows/home-hallway-expansion.yml
      - Assets/Rokas/Scripts/Core/State.cs
      - Assets/Rokas/Scripts/Core/GameSession.cs
      - Assets/Rokas/Scripts/Presentation/HomeView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs.meta
      - Assets/Rokas/Scripts/Presentation/RokasView.cs
      - Assets/Rokas/Resources/Home/HallwayReference.jpg
      - Assets/Rokas/Resources/Home/HallwayReference.jpg.meta
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs.meta
      - Assets/Rokas/Tests/Serialization/UnitySaveTests.cs

permissions:
  contents: write
  checks: write

concurrency:
  group: home-hallway-expansion-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.19f1
  HALLWAY_SHARE_URL: https://firestorage.ai/en/f/JoTJeZvzhbvc
  HALLWAY_ASSET_SHA256: 34618076026b5f44676d05d471219cd38f77472cd1f88c822197e47736752fab

jobs:
  asset-bootstrap:
    name: Land prepared Hallway reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.asset.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/home-hallway-expansion
          fetch-depth: 0
      - id: asset
        name: Restore prepared runtime image if missing
        shell: bash
        run: |
          set -euo pipefail
          target="Assets/Rokas/Resources/Home/HallwayReference.jpg"
          meta="${target}.meta"
          if [[ -f "$target" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$(dirname "$target")"
          # The Firestorage share is a Next.js download page, not a direct JPEG endpoint.
          # Browser download is necessary; its bytes must match our prepared full-resolution source.
          mkdir -p /tmp/rokas-hallway-browser
          npm --prefix /tmp/rokas-hallway-browser install --no-save --silent playwright@1.56.1
          /tmp/rokas-hallway-browser/node_modules/.bin/playwright install chromium
          ASSET_TARGET="$target" node <<'JS'
          const { chromium } = require('/tmp/rokas-hallway-browser/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const context = await browser.newContext({acceptDownloads:true});
              const page = await context.newPage();
              await page.goto(process.env.HALLWAY_SHARE_URL, {waitUntil:'domcontentloaded',timeout:90000});
              const button = page.getByTestId('download-button').or(
                page.getByRole('button', {name:/^download$/i})
              ).or(page.getByRole('link', {name:/^download$/i})).first();
              await button.waitFor({state:'visible',timeout:45000});
              const [download] = await Promise.all([
                page.waitForEvent('download', {timeout:90000}),
                button.click({timeout:45000})
              ]);
              const failure = await download.failure();
              if (failure) throw new Error('Download failed: '+failure);
              await download.saveAs(process.env.ASSET_TARGET);
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          file "$target"
          echo "$HALLWAY_ASSET_SHA256  $target" | sha256sum --check -

          cat > "$meta" <<'META'
          fileFormatVersion: 2
          guid: a1f3c02d7e4b4cb5a8d0ce44e3ef6d31
          TextureImporter:
            internalIDToNameTable: []
            externalObjects: {}
            serializedVersion: 13
            mipmaps:
              mipMapMode: 0
              enableMipMap: 0
              sRGBTexture: 1
              linearTexture: 0
              fadeOut: 0
              borderMipMap: 0
              mipMapsPreserveCoverage: 0
              alphaTestReferenceValue: 0.5
              mipMapFadeDistanceStart: 1
              mipMapFadeDistanceEnd: 3
            isReadable: 0
            streamingMipmaps: 0
            grayScaleToAlpha: 0
            generateCubemap: 6
            cubemapConvolution: 0
            seamlessCubemap: 0
            textureFormat: 1
            maxTextureSize: 2048
            textureSettings:
              serializedVersion: 2
              filterMode: 1
              aniso: 1
              mipBias: 0
              wrapU: 1
              wrapV: 1
              wrapW: 1
            nPOTScale: 0
            lightmap: 0
            compressionQuality: 80
            spriteMode: 0
            spriteExtrude: 1
            spriteMeshType: 1
            alignment: 0
            spritePivot: {x: 0.5, y: 0.5}
            spritePixelsToUnits: 100
            spriteBorder: {x: 0, y: 0, z: 0, w: 0}
            alphaUsage: 1
            alphaIsTransparency: 0
            spriteTessellationDetail: -1
            textureType: 0
            textureShape: 1
            singleChannelComponent: 0
            flipbookRows: 1
            flipbookColumns: 1
            platformSettings:
            - serializedVersion: 3
              buildTarget: DefaultTexturePlatform
              maxTextureSize: 2048
              resizeAlgorithm: 0
              textureFormat: -1
              textureCompression: 0
              compressionQuality: 80
              crunchedCompression: 0
              allowsAlphaSplitting: 0
              overridden: 0
              ignorePlatformSupport: 0
              androidETC2FallbackOverride: 0
              forceMaximumCompressionQuality_BC6H_BC7: 0
            spriteSheet:
              serializedVersion: 2
              sprites: []
              outline: []
              physicsShape: []
              bones: []
              spriteID:
              internalID: 0
              vertices: []
              indices:
              edges: []
              weights: []
              secondaryTextures: []
              nameFileIdTable: {}
            mipmapLimitGroupName:
            pSDRemoveMatte: 0
            userData: ROKAS Hallway reference sha256=34618076026b5f44676d05d471219cd38f77472cd1f88c822197e47736752fab
            assetBundleName:
            assetBundleVariant:
          META

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" "$meta"
          git commit -m "chore: land hallway runtime reference asset"
          git push origin HEAD:codex/home-hallway-expansion
          echo "changed=true" >> "$GITHUB_OUTPUT"

  hallway:
    needs: asset-bootstrap
    name: Hallway routing + light matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run Hallway Home PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HallwayHomeExpansionPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Home Expansion

  save:
    needs: asset-bootstrap
    name: Hallway light persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run save compatibility tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.UnitySaveTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Save Compatibility

  hub-regression:
    needs: asset-bootstrap
    name: Existing Home + Workbench routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run existing Home visit / Laptop regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupSkipHintLaptopHomeVisitPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Existing Home Visit Regression
      - name: Run Laptop-only Workbench regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.WorkbenchUiPlayModeTests.WorkbenchIsLaptopOnlyAndLegacyRoomRouteBuildsNothing
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Workbench Remains Laptop Only

  swords-regression:
    needs: asset-bootstrap
    name: Removed swords hotspot stays removed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run finished Home overlay regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HomeFinishedUiCleanupTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Swords Hotspot Remains Removed
