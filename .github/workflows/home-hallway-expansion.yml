name: ROKAS Home Hallway Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hallway-crossroom-light-fidelity
    paths:
      - .github/workflows/home-hallway-expansion.yml
      - Assets/Rokas/Scripts/Core/State.cs
      - Assets/Rokas/Scripts/Core/GameSession.cs
      - Assets/Rokas/Scripts/Presentation/HomeView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs
      - Assets/Rokas/Scripts/Presentation/HallwayView.cs.meta
      - Assets/Rokas/Scripts/Presentation/RokasView.cs
      - Assets/Rokas/Resources/Home/HallwayReference.jpg
      - Assets/Rokas/Resources/Home/HallwayReference.jpg.meta
      - Assets/Rokas/Resources/Home/HallwayLightsOff.jpg
      - Assets/Rokas/Resources/Home/HallwayLightsOff.jpg.meta
      - Assets/Rokas/Resources/Shaders/HallwayLightStates.shader
      - Assets/Rokas/Scripts/Presentation/HallwayLightPresentation.cs
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs
      - Assets/Rokas/Tests/PlayMode/HallwayHomeExpansionPlayModeTests.cs.meta
      - Assets/Rokas/Tests/Serialization/UnitySaveTests.cs

permissions:
  contents: write
  checks: write

concurrency:
  group: home-hallway-expansion-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.19f1
  HALLWAY_ASSET_SHA256: 34618076026b5f44676d05d471219cd38f77472cd1f88c822197e47736752fab
  HALLWAY_OFF_SHARE: https://firestorage.ai/en/f/IE9uWs1ixi8a
  HALLWAY_OFF_SHA256: 8b13acb735089ce5c8a5607b97c0cdc86d666f3b17f6a7555142525b74ecd691

jobs:
  asset-integrity:
    name: Verify committed Hallway reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - name: Restore approved OFF image once and verify both photos
        shell: bash
        run: |
          set -euo pipefail
          image="Assets/Rokas/Resources/Home/HallwayReference.jpg"
          target="Assets/Rokas/Resources/Home/HallwayLightsOff.jpg"
          test -f "$image" && test -f "${image}.meta"
          echo "$HALLWAY_ASSET_SHA256  $image" | sha256sum --check -
          test -f "${target}.meta"

          if [[ ! -f "$target" ]]; then
            mkdir -p /tmp/rokas-light-download
            npm --prefix /tmp/rokas-light-download install --no-save --silent playwright@1.56.1
            /tmp/rokas-light-download/node_modules/.bin/playwright install chromium
            ASSET_TARGET="$target" node <<'JS'
          const {chromium} = require('/tmp/rokas-light-download/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const context = await browser.newContext({acceptDownloads:true});
              const page = await context.newPage();
              await page.goto(process.env.HALLWAY_OFF_SHARE,{waitUntil:'domcontentloaded',timeout:90000});
              const button = page.getByTestId('download-button').or(
                page.getByRole('button',{name:/^download$/i})
              ).or(page.getByRole('link',{name:/^download$/i})).first();
              await button.waitFor({state:'visible',timeout:45000});
              const [download] = await Promise.all([
                page.waitForEvent('download',{timeout:90000}),
                button.click({timeout:45000})
              ]);
              const failure=await download.failure();
              if(failure) throw Error(failure);
              await download.saveAs(process.env.ASSET_TARGET);
            } finally { await browser.close(); }
          })().catch(e => {console.error(e);process.exit(1)});
          JS
            echo "$HALLWAY_OFF_SHA256  $target" | sha256sum --check -
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git commit -m "asset: commit original approved Hallway OFF photograph"
            for attempt in 1 2 3 4 5; do
              git fetch origin codex/hallway-crossroom-light-fidelity
              git rebase origin/codex/hallway-crossroom-light-fidelity
              if git push origin HEAD:codex/hallway-crossroom-light-fidelity; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi

          echo "$HALLWAY_OFF_SHA256  $target" | sha256sum --check -
          file "$image" "$target"

  hallway:
    needs: asset-integrity
    name: Hallway routing + light matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run Hallway Home PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HallwayHomeExpansionPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Home Expansion

  save:
    needs: asset-integrity
    name: Hallway light persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run save compatibility tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.UnitySaveTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Save Compatibility

  hub-regression:
    needs: asset-integrity
    name: Existing Home + Workbench routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run existing Home visit / Laptop regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.StartupSkipHintLaptopHomeVisitPlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Existing Home Visit Regression
      - name: Run Laptop-only Workbench regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.WorkbenchUiPlayModeTests.WorkbenchIsLaptopOnlyAndLegacyRoomRouteBuildsNothing
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Workbench Remains Laptop Only

  visual-capture:
    name: Actual Hallway Unity screenshots
    needs: asset-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Capture Unity Hallway frames
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HallwayVisualCapturePlayModeTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hallway Live Visual Captures
          artifactsPath: artifacts
      - name: Upload actual Unity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rokas-hallway-visual-captures
          path: artifacts/hallway-visual/*.png
          if-no-files-found: warn

  swords-regression:
    needs: asset-integrity
    name: Removed swords hotspot stays removed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/hallway-crossroom-light-fidelity
      - uses: actions/cache@v6
        with:
          path: Library
          key: HallwayHome-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            HallwayHome-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-
      - name: Run finished Home overlay regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          cliVersion: v0.1.60
          customParameters: -testFilter Rokas.Tests.HomeFinishedUiCleanupTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Swords Hotspot Remains Removed
