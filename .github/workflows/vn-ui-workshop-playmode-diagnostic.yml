name: ROKAS VN UI Workshop PlayMode Diagnostic

on:
  push:
    branches:
      - feature/vn-ui-workshop

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.3.19f1
  DIAGNOSTIC_SOURCE_SHA: d4fc80f5084cfdb63667afac48b3081a0c034d75

jobs:
  playmode-diagnostic:
    name: Same-SHA PlayMode XML + classifier diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact original Workshop SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact clean source checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$ACTUAL_SHA" = "$DIAGNOSTIC_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "DIAGNOSTIC_SOURCE_SHA=$ACTUAL_SHA"
          echo "DIAGNOSTIC_SOURCE_TREE=$ACTUAL_TREE"
          echo "GIT_STATUS=CLEAN"

      - name: Run complete PlayMode suite on exact original SHA
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          cliVersion: v0.1.60
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Workshop diagnostic - Full PlayMode exact SHA
          artifactsPath: artifacts-full-playmode

      - name: Print deterministic testcase and classifier diagnostics
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          WORKFLOW_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          python - <<'PY' | tee playmode-diagnostic-summary.txt
          import json
          import os
          import platform
          import sys
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          allowed = {
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.ClosingLaptopDuringBootCancelsWithoutDesktopAndReopenIsReady',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.CommittedLaptopMediaProducesAFrameThenDesktopAndCleansUp',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.CommittedStartupAndStoryMediaProduceFramesThenMenuAndHomeOnce',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.LaptopOpeningShowsBootGateBeforeDesktop',
              'Rokas.Tests.StartupLaptopVideoPlayModeTests.RealStartDoesNotBuildHomeBeforeStartupVideoGate',
          }

          def emit(key, value):
              print(f'{key}={value}')

          emit('DIAGNOSTIC_SOURCE_SHA', os.environ.get('DIAGNOSTIC_SOURCE_SHA', ''))
          emit('WORKFLOW_COMMIT_SHA', os.environ.get('WORKFLOW_COMMIT_SHA', ''))
          emit('UNITY_VERSION', os.environ.get('UNITY_VERSION', ''))
          emit('RUNNER_OS', os.environ.get('RUNNER_OS', ''))
          emit('RUNNER_ARCH', os.environ.get('RUNNER_ARCH', ''))
          emit('PLATFORM', platform.platform())
          emit('PYTHON_VERSION', sys.version.replace('\n', ' '))
          emit('TEST_OUTCOME', os.environ.get('TEST_OUTCOME', ''))
          emit('CLASSIFIER_EXPECTED_COHORT', json.dumps(sorted(allowed), separators=(',', ':')))

          xmls = sorted(Path('artifacts-full-playmode').rglob('*.xml'))
          emit('RESULT_XML_COUNT', len(xmls))
          for index, path in enumerate(xmls, 1):
              emit(f'RESULT_XML_{index}', path.as_posix())

          if len(xmls) != 1:
              emit('CLASSIFIER_OBSERVED_COHORT', '[]')
              reason = f'Expected one result XML, found {[p.as_posix() for p in xmls]}'
              emit('CLASSIFIER_REJECTION_REASON', reason)
              raise SystemExit(reason)

          root = ET.parse(xmls[0]).getroot()
          cases = list(root.iter('test-case'))
          counts = Counter(case.attrib.get('result', '') for case in cases)
          emit('TESTCASE_TOTAL', len(cases))
          emit('TESTCASE_PASS', counts.get('Passed', 0))
          emit('TESTCASE_FAIL', counts.get('Failed', 0))
          emit('TESTCASE_SKIP', counts.get('Skipped', 0))
          emit('TESTCASE_OTHER', len(cases) - counts.get('Passed', 0) - counts.get('Failed', 0) - counts.get('Skipped', 0))

          print('TESTCASE_LIST_BEGIN')
          for case in sorted(cases, key=lambda c: c.attrib.get('fullname') or c.attrib.get('name') or ''):
              name = case.attrib.get('fullname') or case.attrib.get('name') or ''
              result = case.attrib.get('result', '')
              print(f'{result}\t{name}')
          print('TESTCASE_LIST_END')

          failed = []
          for case in cases:
              if case.attrib.get('result') != 'Failed':
                  continue
              name = case.attrib.get('fullname') or case.attrib.get('name') or ''
              failure = case.find('failure')
              message = '' if failure is None else (failure.findtext('message', default='') or '')
              stack = '' if failure is None else (failure.findtext('stack-trace', default='') or '')
              text = '\n'.join([message, stack])
              failed.append((name, message, stack, text))

          observed = sorted({name for name, _, _, _ in failed})
          emit('CLASSIFIER_OBSERVED_COHORT', json.dumps(observed, separators=(',', ':')))
          print('FAILED_TESTCASES_BEGIN')
          for index, (name, message, stack, text) in enumerate(sorted(failed), 1):
              print(f'FAILURE_{index}_NAME={name}')
              print(f'FAILURE_{index}_MESSAGE_BEGIN')
              print(message)
              print(f'FAILURE_{index}_MESSAGE_END')
              print(f'FAILURE_{index}_STACK_BEGIN')
              print(stack)
              print(f'FAILURE_{index}_STACK_END')
              print(f'FAILURE_{index}_HAS_VIDEOPLAYER_SIGNATURE={"VideoPlayer cannot play url" in text}')
              print(f'FAILURE_{index}_HAS_KNOWN_MEDIA={"StartupPreview.mp4" in text or "LaptopBoot.mp4" in text}')
          print('FAILED_TESTCASES_END')

          rejection = ''
          if not failed:
              if os.environ.get('TEST_OUTCOME') != 'success':
                  rejection = 'Infrastructure/compiler failure without test failures.'
              else:
                  emit('CLASSIFIER_DECISION', 'ACCEPT_GREEN_ZERO_FAILURES')
                  emit('CLASSIFIER_REJECTION_REASON', 'NONE')
                  print('FULL_PLAYMODE=GREEN')
          else:
              names = {name for name, _, _, _ in failed}
              if len(failed) != 5 or names != allowed:
                  rejection = f'Unexpected failures: {sorted(names)}'
              else:
                  for name, _, _, text in failed:
                      if 'VideoPlayer cannot play url' not in text:
                          rejection = f'{name}: wrong signature'
                          break
                      if 'StartupPreview.mp4' not in text and 'LaptopBoot.mp4' not in text:
                          rejection = f'{name}: wrong media'
                          break
                  if not rejection:
                      emit('CLASSIFIER_DECISION', 'ACCEPT_KNOWN_LINUX_VIDEOPLAYER_5_OF_5')
                      emit('CLASSIFIER_REJECTION_REASON', 'NONE')
                      print('CLASSIFIED_KNOWN_LINUX_VIDEOPLAYER_FAILURES=5/5')

          if rejection:
              emit('CLASSIFIER_DECISION', 'REJECT')
              emit('CLASSIFIER_REJECTION_REASON', rejection)
              raise SystemExit(rejection)
          PY

      - name: Upload raw PlayMode XML and diagnostic summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-ui-workshop-playmode-diagnostic-${{ env.DIAGNOSTIC_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            artifacts-full-playmode
            playmode-diagnostic-summary.txt
          if-no-files-found: warn
          retention-days: 7
