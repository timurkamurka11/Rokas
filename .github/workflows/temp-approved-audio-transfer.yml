name: TEMP Approved Audio Transfer

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve firestorage download endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output /tmp/button.html 'https://firestorage.ai/ja/f/ANH070mKY3-B'
          curl --fail --location --retry 2 --output /tmp/enter.html 'https://firestorage.ai/ja/f/ecH9f8hC8xUl'
          echo '--- button download candidates ---'
          grep -Eoi '.{0,140}(download|file_url|download_url|href=).{0,220}' /tmp/button.html | head -80 || true
          echo '--- enter download candidates ---'
          grep -Eoi '.{0,140}(download|file_url|download_url|href=).{0,220}' /tmp/enter.html | head -80 || true
          exit 1
