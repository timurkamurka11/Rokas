name: TEMP Real Windows Main Menu Runtime Proof

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: read

jobs:
  build-player:
    name: Build exact feature with temporary QA probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature candidate
        uses: actions/checkout@v4
        with:
          ref: feature/main-menu-interaction-ui-audio-home-transition
          fetch-depth: 1

      - name: Verify exact feature and approved audio bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9514a0895a2b555bbcdbf365e8a05f838a4c9f14'
          test "$(git rev-parse HEAD^{tree})" = 'f7c73cb3408bd99b6c9afad1b699822d0b3f6b05'
          test "$(sha256sum Assets/Rokas/Audio/ButtonClick.wav | awk '{print $1}')" = '34f94b176a7ab7ce57c267e2b04b1632283fb996b1f4ba1412efb1350bfc4e96'
          test "$(sha256sum Assets/Rokas/Audio/EnterGame.wav | awk '{print $1}')" = '6e918a601a51a91457fded9451f3535a11c393b175039c5d113c712c10f55809'
          mkdir -p main-menu-runtime-build-evidence
          git rev-parse HEAD > main-menu-runtime-build-evidence/feature-head.txt
          git rev-parse HEAD^{tree} > main-menu-runtime-build-evidence/feature-tree.txt
          sha256sum Assets/Rokas/Audio/ButtonClick.wav Assets/Rokas/Audio/EnterGame.wav > main-menu-runtime-build-evidence/source-audio-sha256.txt

      - name: Inject temporary command-line-gated runtime probe
        shell: bash
        run: |
          set -euo pipefail
          cat > Assets/Rokas/Scripts/Presentation/RokasMainMenuRuntimeProbe.cs <<'CS'
          using System;
          using System.Collections;
          using System.IO;
          using UnityEngine;
          using UnityEngine.EventSystems;
          using UnityEngine.UI;

          namespace Rokas.Presentation
          {
              // Temporary CI-only Development Player proof. Injected after exact feature checkout; never committed to feature/final.
              public sealed class RokasMainMenuRuntimeProbe : MonoBehaviour
              {
                  private const string ProbeArgument = "-rokasMainMenuProof";
                  private const float Timeout = 35f;

                  [Serializable]
                  private sealed class Evidence
                  {
                      public string mode = "ROKAS_REAL_WINDOWS_MAIN_MENU_PROOF";
                      public string unityVersion;
                      public string platform;
                      public bool menuReached;
                      public bool normalMenuCapture;
                      public bool enterHoverCapture;
                      public bool aboutHoverCapture;
                      public bool supportHoverCapture;
                      public bool exitReturnCapture;
                      public bool hoverScaleEnter;
                      public bool hoverScaleAbout;
                      public bool hoverScaleSupport;
                      public bool smoothExitReturn;
                      public bool aboutButtonClick;
                      public bool supportButtonClick;
                      public bool enterGameOnly;
                      public bool repeatedEnterSingleSource;
                      public bool partialFadeCapture;
                      public bool deeperFadeCapture;
                      public bool fullBlackCapture;
                      public bool homeUnderBlackCapture;
                      public bool homeFadeInCapture;
                      public bool stableHomeCapture;
                      public float partialAlpha;
                      public float deeperAlpha;
                      public float fullBlackAlpha;
                      public float homeUnderBlackAlpha;
                      public float fadeInAlpha;
                      public bool homeAbsentDuringPartial;
                      public bool homeAbsentDuringDeeper;
                      public bool menuCleanedAtHandoff;
                      public bool homeBuiltExactlyOnce;
                      public bool enterPersistentOwner;
                      public bool enterStillPlayingAtHomeHandoff;
                      public int enterStartSamples;
                      public int enterHandoffSamples;
                      public bool ordinaryHomeButtonClick;
                      public bool laptopOldClick;
                      public bool laptopGenericSuppressed;
                      public bool laptopCapture;
                      public string failure;
                      public bool finalPass;
                  }

                  private RokasBootstrap boot;
                  private Evidence evidence;
                  private string outputDirectory;
                  private bool waitSucceeded;
                  private bool captureSucceeded;

                  [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
                  private static void Install()
                  {
                      if (Application.isEditor || !Debug.isDebugBuild || !Requested(Environment.GetCommandLineArgs())) return;
                      GameObject root = GameObject.Find("Rokas");
                      if (!root)
                      {
                          Debug.LogError("ROKAS_MAIN_MENU_PROOF_INSTALL_FAIL: Rokas root was not found.");
                          return;
                      }
                      if (!root.GetComponent<RokasMainMenuRuntimeProbe>()) root.AddComponent<RokasMainMenuRuntimeProbe>();
                  }

                  private static bool Requested(string[] args)
                  {
                      if (args == null) return false;
                      for (int i = 0; i < args.Length; i++)
                          if (string.Equals(args[i], ProbeArgument, StringComparison.OrdinalIgnoreCase)) return true;
                      return false;
                  }

                  private IEnumerator Start()
                  {
                      outputDirectory = Path.Combine(Directory.GetCurrentDirectory(), "rokas-main-menu-proof");
                      Directory.CreateDirectory(outputDirectory);
                      evidence = new Evidence { unityVersion = Application.unityVersion, platform = Application.platform.ToString() };
                      boot = GetComponent<RokasBootstrap>();

                      IEnumerator scenario = RunScenario();
                      while (true)
                      {
                          bool moved;
                          object current = null;
                          try
                          {
                              moved = scenario.MoveNext();
                              if (moved) current = scenario.Current;
                          }
                          catch (Exception exception)
                          {
                              Finish(false, exception.GetType().Name + ": " + exception.Message);
                              yield break;
                          }
                          if (!moved) break;
                          yield return current;
                      }

                      bool pass = evidence.menuReached && evidence.normalMenuCapture && evidence.enterHoverCapture &&
                                  evidence.aboutHoverCapture && evidence.supportHoverCapture && evidence.exitReturnCapture &&
                                  evidence.hoverScaleEnter && evidence.hoverScaleAbout && evidence.hoverScaleSupport &&
                                  evidence.smoothExitReturn && evidence.aboutButtonClick && evidence.supportButtonClick &&
                                  evidence.enterGameOnly && evidence.repeatedEnterSingleSource && evidence.partialFadeCapture &&
                                  evidence.deeperFadeCapture && evidence.fullBlackCapture && evidence.homeUnderBlackCapture &&
                                  evidence.homeFadeInCapture && evidence.stableHomeCapture && evidence.homeAbsentDuringPartial &&
                                  evidence.homeAbsentDuringDeeper && evidence.menuCleanedAtHandoff && evidence.homeBuiltExactlyOnce &&
                                  evidence.enterPersistentOwner && evidence.enterStillPlayingAtHomeHandoff &&
                                  evidence.ordinaryHomeButtonClick && evidence.laptopOldClick && evidence.laptopGenericSuppressed &&
                                  evidence.laptopCapture;
                      Finish(pass, pass ? string.Empty : "One or more real Windows Main Menu invariants failed.");
                  }

                  private IEnumerator RunScenario()
                  {
                      Require(boot != null, "RokasBootstrap missing.");

                      // Reuse production startup/story, but skip only after a real first frame so the proof reaches Main Menu quickly.
                      float launchDeadline = Time.realtimeSinceStartup + Timeout;
                      while (Find("RokasMainMenu") == null && Time.realtimeSinceStartup < launchDeadline)
                      {
                          if (boot.VideoPresenter != null && boot.VideoPresenter.IsPlaying && boot.VideoPresenter.FirstFramePresented)
                              boot.VideoPresenter.Skip();
                          yield return null;
                      }
                      Require(Find("RokasMainMenu") != null, "Timed out reaching real Main Menu.");
                      evidence.menuReached = true;
                      yield return Capture("01-menu-normal.png");
                      RequireCapture("normal Main Menu");
                      evidence.normalMenuCapture = true;

                      Button enter = FindButton("EnterWorldButton");
                      Button about = FindButton("DevelopersButton");
                      Button support = FindButton("SupportDevelopmentButton");
                      Require(enter && about && support, "Main Menu buttons missing.");

                      yield return HoverProof(enter, "02-enter-hover.png", true);
                      yield return HoverProof(about, "04-about-hover.png", false);
                      yield return HoverProof(support, "05-support-hover.png", false);

                      Press(about);
                      AudioSource aboutSource = FindPlaying("ButtonClick");
                      evidence.aboutButtonClick = aboutSource != null && CountPlaying("LaptopMouseClick") == 0;
                      Require(evidence.aboutButtonClick, "About did not play approved ButtonClick only.");
                      yield return WaitFor(() => FindPlaying("ButtonClick") == null, 4f);
                      RequireWait("About ButtonClick natural completion");

                      Press(support);
                      AudioSource supportSource = FindPlaying("ButtonClick");
                      evidence.supportButtonClick = supportSource != null && CountPlaying("LaptopMouseClick") == 0;
                      Require(evidence.supportButtonClick, "Support did not play approved ButtonClick only.");
                      yield return WaitFor(() => FindPlaying("ButtonClick") == null, 4f);
                      RequireWait("Support ButtonClick natural completion");

                      Press(enter);
                      AudioSource special = FindAssigned("EnterGame");
                      Require(special != null, "Enter did not assign EnterGame to a persistent effect source.");
                      int specialId = special.GetInstanceID();
                      evidence.enterStartSamples = special.timeSamples;
                      bool firstPlaying = special.isPlaying;
                      Press(enter);
                      AudioSource afterRepeat = FindAssigned("EnterGame");
                      evidence.enterGameOnly = firstPlaying && CountPlaying("ButtonClick") == 0 && special.gameObject.name == "Audio";
                      evidence.repeatedEnterSingleSource = afterRepeat != null && afterRepeat.GetInstanceID() == specialId && CountAssigned("EnterGame") == 1;
                      Require(evidence.enterGameOnly, "Enter must play EnterGame only through persistent Audio root.");
                      Require(evidence.repeatedEnterSingleSource, "Repeated Enter stacked/replaced EnterGame source.");

                      CanvasGroup curtain = FindCanvasGroup("EnterWorldCurtain");
                      Require(curtain != null, "EnterWorldCurtain was not created.");

                      yield return WaitFor(() => curtain && curtain.alpha > .08f && curtain.alpha < .42f, 2f);
                      RequireWait("partial fade-to-black");
                      evidence.partialAlpha = curtain.alpha;
                      evidence.homeAbsentDuringPartial = Find("HomeTitle") == null;
                      yield return Capture("06-fade-partial.png");
                      RequireCapture("partial fade");
                      evidence.partialFadeCapture = evidence.homeAbsentDuringPartial;

                      yield return WaitFor(() => curtain && curtain.alpha > .48f && curtain.alpha < .88f && Find("HomeTitle") == null, 2f);
                      RequireWait("deeper fade-to-black");
                      evidence.deeperAlpha = curtain.alpha;
                      evidence.homeAbsentDuringDeeper = true;
                      yield return Capture("07-fade-deeper.png");
                      RequireCapture("deeper fade");
                      evidence.deeperFadeCapture = true;

                      yield return WaitFor(() => curtain && curtain.alpha >= .99f && Find("HomeTitle") == null, 2f);
                      RequireWait("full black before Home construction");
                      evidence.fullBlackAlpha = curtain.alpha;
                      yield return Capture("08-full-black.png");
                      RequireCapture("full black");
                      evidence.fullBlackCapture = true;

                      yield return WaitFor(() => Find("HomeTitle") != null && curtain && curtain.alpha >= .99f, 2f);
                      RequireWait("Home constructed under full black");
                      evidence.homeUnderBlackAlpha = curtain.alpha;
                      evidence.menuCleanedAtHandoff = Find("RokasMainMenu") == null && Find("MainMenuVideoSurface") == null;
                      evidence.homeBuiltExactlyOnce = Count("HomeTitle") == 1 && boot.View != null;
                      AudioSource handoffSpecial = FindAssigned("EnterGame");
                      evidence.enterHandoffSamples = handoffSpecial != null ? handoffSpecial.timeSamples : -1;
                      evidence.enterPersistentOwner = handoffSpecial != null && handoffSpecial.GetInstanceID() == specialId &&
                                                      handoffSpecial.gameObject.name == "Audio" && handoffSpecial.clip != null &&
                                                      handoffSpecial.clip.name == "EnterGame";
                      evidence.enterStillPlayingAtHomeHandoff = evidence.enterPersistentOwner && handoffSpecial.isPlaying &&
                                                                handoffSpecial.timeSamples > evidence.enterStartSamples;
                      Require(evidence.menuCleanedAtHandoff && evidence.homeBuiltExactlyOnce,
                          "Home handoff did not occur exactly once under full black.");
                      Require(evidence.enterStillPlayingAtHomeHandoff,
                          "EnterGame was truncated before the real Windows Home handoff.");
                      yield return Capture("09-home-under-black.png");
                      RequireCapture("Home under black");
                      evidence.homeUnderBlackCapture = true;

                      yield return WaitFor(() => curtain && Find("HomeTitle") != null && curtain.alpha > .12f && curtain.alpha < .88f, 2f);
                      RequireWait("Home partial fade-in");
                      evidence.fadeInAlpha = curtain.alpha;
                      yield return Capture("10-home-fade-in.png");
                      RequireCapture("Home fade-in");
                      evidence.homeFadeInCapture = true;

                      yield return WaitFor(() => Find("EnterWorldCurtain") == null && Find("HomeTitle") != null, 2f);
                      RequireWait("stable Home after transition cleanup");
                      yield return Capture("11-home-stable.png");
                      RequireCapture("stable Home");
                      evidence.stableHomeCapture = true;

                      yield return WaitFor(() => FindPlaying("EnterGame") == null, 4f);
                      RequireWait("EnterGame natural completion after Home handoff");

                      Press(FindButton("LampHotspot"));
                      evidence.ordinaryHomeButtonClick = FindPlaying("ButtonClick") != null;
                      Require(evidence.ordinaryHomeButtonClick, "Ordinary Home UI did not use ButtonClick.");
                      yield return WaitFor(() => FindPlaying("ButtonClick") == null, 4f);
                      RequireWait("Home ButtonClick natural completion");

                      Press(FindButton("LaptopHotspot"));
                      yield return WaitFor(() => Find("YomiLaptop") != null, 3f);
                      RequireWait("Laptop window creation");
                      float laptopDeadline = Time.realtimeSinceStartup + Timeout;
                      while (FindButton("LaptopContracts") == null && Time.realtimeSinceStartup < laptopDeadline)
                      {
                          if (boot.VideoPresenter != null && boot.VideoPresenter.IsPlaying && boot.VideoPresenter.FirstFramePresented)
                              boot.VideoPresenter.Skip();
                          yield return null;
                      }
                      Require(FindButton("LaptopContracts") != null, "Laptop did not reach READY.");
                      yield return Capture("12-laptop-ready.png");
                      RequireCapture("Laptop ready");
                      evidence.laptopCapture = true;

                      Press(FindButton("LaptopContracts"));
                      evidence.laptopOldClick = FindPlaying("LaptopMouseClick") != null;
                      evidence.laptopGenericSuppressed = FindPlaying("ButtonClick") == null;
                      Require(evidence.laptopOldClick && evidence.laptopGenericSuppressed,
                          "Laptop internal UI did not preserve LaptopMouseClick / generic suppression.");
                  }

                  private IEnumerator HoverProof(Button button, string captureName, bool captureExit)
                  {
                      LaptopTileFeedback feedback = button.GetComponent<LaptopTileFeedback>();
                      Require(feedback != null, button.name + " missing LaptopTileFeedback.");
                      var pointer = new PointerEventData(EventSystem.current);
                      feedback.OnPointerEnter(pointer);
                      yield return new WaitForSecondsRealtime(.12f);
                      float scale = button.transform.localScale.x;
                      bool scaleOk = scale > 1.001f && scale <= 1.04f;
                      if (button.name == "EnterWorldButton") evidence.hoverScaleEnter = scaleOk;
                      else if (button.name == "DevelopersButton") evidence.hoverScaleAbout = scaleOk;
                      else if (button.name == "SupportDevelopmentButton") evidence.hoverScaleSupport = scaleOk;
                      Require(scaleOk, button.name + " hover scale did not match proven feedback range.");
                      yield return Capture(captureName);
                      RequireCapture(button.name + " hover");
                      if (button.name == "EnterWorldButton") evidence.enterHoverCapture = true;
                      else if (button.name == "DevelopersButton") evidence.aboutHoverCapture = true;
                      else if (button.name == "SupportDevelopmentButton") evidence.supportHoverCapture = true;

                      feedback.OnPointerExit(pointer);
                      yield return null;
                      if (captureExit)
                      {
                          evidence.smoothExitReturn = button.transform.localScale.x > 1.001f;
                          yield return Capture("03-enter-exit-return.png");
                          RequireCapture("Enter smooth exit return");
                          evidence.exitReturnCapture = true;
                      }
                      yield return new WaitForSecondsRealtime(.30f);
                      Require(Mathf.Abs(button.transform.localScale.x - 1f) <= .01f,
                          button.name + " did not settle smoothly to scale 1.0.");
                  }

                  private IEnumerator WaitFor(Func<bool> predicate, float seconds)
                  {
                      waitSucceeded = false;
                      float deadline = Time.realtimeSinceStartup + seconds;
                      while (Time.realtimeSinceStartup < deadline)
                      {
                          if (predicate()) { waitSucceeded = true; yield break; }
                          yield return null;
                      }
                  }

                  private void RequireWait(string label) { Require(waitSucceeded, "Timed out waiting for " + label + "."); }

                  private IEnumerator Capture(string fileName)
                  {
                      captureSucceeded = false;
                      string path = Path.Combine(outputDirectory, fileName);
                      if (File.Exists(path)) File.Delete(path);
                      ScreenCapture.CaptureScreenshot(path);
                      float deadline = Time.realtimeSinceStartup + 3f;
                      while (Time.realtimeSinceStartup < deadline)
                      {
                          yield return new WaitForEndOfFrame();
                          if (File.Exists(path) && new FileInfo(path).Length > 1000)
                          {
                              captureSucceeded = true;
                              yield break;
                          }
                      }
                  }

                  private void RequireCapture(string label) { Require(captureSucceeded, "Screenshot capture failed: " + label); }

                  private void Press(Button button)
                  {
                      Require(button != null, "Missing active Button.");
                      Require(button.IsInteractable(), button.name + " is not interactable.");
                      var pointer = new PointerEventData(EventSystem.current) { button = PointerEventData.InputButton.Left };
                      Require(ExecuteEvents.Execute(button.gameObject, pointer, ExecuteEvents.pointerClickHandler),
                          "ExecuteEvents pointerClick failed for " + button.name);
                  }

                  private GameObject Find(string name)
                  {
                      foreach (Transform item in transform.GetComponentsInChildren<Transform>(true))
                          if (item.name == name) return item.gameObject;
                      return null;
                  }

                  private Button FindButton(string name)
                  {
                      foreach (Button item in transform.GetComponentsInChildren<Button>(true))
                          if (item.name == name) return item;
                      return null;
                  }

                  private CanvasGroup FindCanvasGroup(string name)
                  {
                      GameObject go = Find(name);
                      return go ? go.GetComponent<CanvasGroup>() : null;
                  }

                  private int Count(string name)
                  {
                      int count = 0;
                      foreach (Transform item in transform.GetComponentsInChildren<Transform>(true))
                          if (item.name == name) count++;
                      return count;
                  }

                  private AudioSource FindPlaying(string clipName)
                  {
                      foreach (AudioSource source in transform.GetComponentsInChildren<AudioSource>(true))
                          if (source.clip != null && source.clip.name == clipName && source.isPlaying) return source;
                      return null;
                  }

                  private AudioSource FindAssigned(string clipName)
                  {
                      foreach (AudioSource source in transform.GetComponentsInChildren<AudioSource>(true))
                          if (source.clip != null && source.clip.name == clipName) return source;
                      return null;
                  }

                  private int CountPlaying(string clipName)
                  {
                      int count = 0;
                      foreach (AudioSource source in transform.GetComponentsInChildren<AudioSource>(true))
                          if (source.clip != null && source.clip.name == clipName && source.isPlaying) count++;
                      return count;
                  }

                  private int CountAssigned(string clipName)
                  {
                      int count = 0;
                      foreach (AudioSource source in transform.GetComponentsInChildren<AudioSource>(true))
                          if (source.clip != null && source.clip.name == clipName) count++;
                      return count;
                  }

                  private static void Require(bool condition, string message)
                  {
                      if (!condition) throw new InvalidOperationException(message);
                  }

                  private void Finish(bool pass, string failure)
                  {
                      evidence.failure = failure ?? string.Empty;
                      evidence.finalPass = pass;
                      try
                      {
                          Directory.CreateDirectory(outputDirectory);
                          File.WriteAllText(Path.Combine(outputDirectory, "rokas-main-menu-proof-result.json"), JsonUtility.ToJson(evidence, true));
                      }
                      catch (Exception exception)
                      {
                          Debug.LogError("ROKAS main menu proof could not write JSON: " + exception);
                          pass = false;
                      }
                      Debug.Log(pass ? "ROKAS_MAIN_MENU_RUNTIME_PROOF_PASS" : "ROKAS_MAIN_MENU_RUNTIME_PROOF_FAIL: " + failure);
                      Application.Quit(pass ? 0 : 1);
                  }
              }
          }
          CS
          git diff --check
          test "$(git status --short --untracked-files=all | grep -c 'RokasMainMenuRuntimeProbe.cs')" -eq 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: MainMenuRuntimeProof-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-

      - name: Build StandaloneWindows64 Development Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: Rokas
          buildMethod: Rokas.Editor.RokasVideoSmokeBuild.Build

      - name: Preserve build identity
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find build -type f -iname 'Rokas.exe' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          printf 'FEATURE_HEAD=9514a0895a2b555bbcdbf365e8a05f838a4c9f14\nFEATURE_TREE=f7c73cb3408bd99b6c9afad1b699822d0b3f6b05\nEXE=%s\n' "$EXE" > main-menu-runtime-build-evidence/identity.txt
          find build -type f -printf '%p %s bytes\n' | sort > main-menu-runtime-build-evidence/build-manifest.txt

      - name: Upload exact QA player
        uses: actions/upload-artifact@v4
        with:
          name: rokas-main-menu-runtime-proof-player
          path: build/StandaloneWindows64
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rokas-main-menu-runtime-build-evidence
          path: main-menu-runtime-build-evidence
          if-no-files-found: warn

  run-player:
    name: Run real Windows Main Menu proof
    needs: build-player
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download exact QA player
        uses: actions/download-artifact@v4
        with:
          name: rokas-main-menu-runtime-proof-player
          path: player

      - name: Run actual Rokas.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path player -Filter Rokas.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Rokas.exe not found.' }
          $work = $exe.Directory.FullName
          $proof = Join-Path $work 'rokas-main-menu-proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          $log = Join-Path $proof 'Player.log'
          $stdout = Join-Path $proof 'host-stdout.txt'
          $stderr = Join-Path $proof 'host-stderr.txt'
          $exitFile = Join-Path $proof 'host-exit.txt'
          $timeoutFile = Join-Path $proof 'host-timeout.txt'
          $args = @('-rokasMainMenuProof','-screen-width','1280','-screen-height','720','-screen-fullscreen','0','-logFile',$log)
          $process = Start-Process -FilePath $exe.FullName -ArgumentList $args -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $completed = $process.WaitForExit(150000)
          if (-not $completed) {
            try { $process.Kill($true) } catch { }
            'YES' | Set-Content $timeoutFile
            '124' | Set-Content $exitFile
          } else {
            'NO' | Set-Content $timeoutFile
            [string]$process.ExitCode | Set-Content $exitFile
          }
          Get-ChildItem -Path $proof -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $proof 'evidence-listing.txt')
          exit 0

      - name: Require factual runtime result
        if: always()
        shell: pwsh
        run: |
          $result = Get-ChildItem -Path player -Filter rokas-main-menu-proof-result.json -Recurse | Select-Object -First 1
          $exitFile = Get-ChildItem -Path player -Filter host-exit.txt -Recurse | Select-Object -First 1
          $timeoutFile = Get-ChildItem -Path player -Filter host-timeout.txt -Recurse | Select-Object -First 1
          if (-not $result -or -not $exitFile -or -not $timeoutFile) { throw 'Runtime evidence incomplete.' }
          $exitCode = (Get-Content $exitFile.FullName -Raw).Trim()
          $timedOut = (Get-Content $timeoutFile.FullName -Raw).Trim()
          $data = Get-Content $result.FullName -Raw | ConvertFrom-Json
          Write-Host "HOST_EXIT=$exitCode TIMEOUT=$timedOut FINAL_PASS=$($data.finalPass) FAILURE=$($data.failure)"
          Write-Host "FADE partial=$($data.partialAlpha) deeper=$($data.deeperAlpha) black=$($data.fullBlackAlpha) homeBlack=$($data.homeUnderBlackAlpha) fadeIn=$($data.fadeInAlpha)"
          Write-Host "AUDIO about=$($data.aboutButtonClick) support=$($data.supportButtonClick) enterOnly=$($data.enterGameOnly) repeat=$($data.repeatedEnterSingleSource) persistent=$($data.enterPersistentOwner) handoffPlaying=$($data.enterStillPlayingAtHomeHandoff) home=$($data.ordinaryHomeButtonClick) laptop=$($data.laptopOldClick) laptopGenericSuppressed=$($data.laptopGenericSuppressed)"
          if ($timedOut -ne 'NO') { throw 'Real Windows Player proof timed out.' }
          if ($exitCode -ne '0') { throw "Real Windows Player exited with $exitCode." }
          if (-not $data.finalPass) { throw "Runtime proof failed: $($data.failure)" }
          $screens = Get-ChildItem -Path $result.Directory.FullName -Filter '*.png'
          if ($screens.Count -lt 11) { throw "Expected at least 11 proof screenshots, found $($screens.Count)." }

      - name: Upload real-player runtime/visual/audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rokas-main-menu-real-windows-proof
          path: player/**/rokas-main-menu-proof
          if-no-files-found: error
