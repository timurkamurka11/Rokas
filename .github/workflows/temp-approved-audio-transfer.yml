name: TEMP Focused Test Contract Alignment

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature
        uses: actions/checkout@v4
        with:
          ref: feature/main-menu-interaction-ui-audio-home-transition
          fetch-depth: 1
      - name: Align approved clip names only
        shell: bash
        run: |
          set -euo pipefail
          expected='67c83bfe3b19044da76dccce7a88cad7f0844269'
          test "$(git rev-parse HEAD)" = "$expected"
          file='Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs'
          grep -q 'Button click' "$file"
          grep -q 'Enter game' "$file"
          sed -i 's/Button click/ButtonClick/g; s/Enter game/EnterGame/g' "$file"
          ! grep -q 'Button click' "$file"
          ! grep -q 'Enter game' "$file"
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$file"
          git diff -- "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'test: align approved audio clip names'
          git push origin HEAD:feature/main-menu-interaction-ui-audio-home-transition
