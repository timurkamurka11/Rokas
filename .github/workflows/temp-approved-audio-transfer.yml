name: TEMP Approved Audio Transfer

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage client endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/page.js 'https://firestorage.ai/_next/static/chunks/app/%28files%29/ja/f/page-4d19ae0a4ce39d79.js'
          echo '--- endpoint candidates ---'
          grep -Eo '.{0,180}(fetch\(|/api/|download|signed|public_id|publicId|share).{0,260}' /tmp/page.js | head -120 || true
          exit 1
