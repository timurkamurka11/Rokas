name: TEMP Approved Audio Transfer

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage client endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/share.html 'https://firestorage.ai/ja/f/ANH070mKY3-B'
          grep -Eo 'src="[^"]+\.js"' /tmp/share.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/scripts.txt
          echo '--- scripts ---'
          cat /tmp/scripts.txt
          n=0
          while IFS= read -r src; do
            n=$((n+1))
            curl --fail --location --silent --show-error --output "/tmp/script-$n.js" "https://firestorage.ai$src"
            echo "--- $src ---"
            grep -Eo '.{0,180}(fetch\(|/api/|download|signed|public_id|publicId|shareId|share).{0,300}' "/tmp/script-$n.js" | head -80 || true
          done < /tmp/scripts.txt
          exit 1
