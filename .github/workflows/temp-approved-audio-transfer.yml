name: TEMP Correct EnterGame Persistent-Owner Assertion

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature
        uses: actions/checkout@v4
        with:
          ref: feature/main-menu-interaction-ui-audio-home-transition
          fetch-depth: 1
      - name: Correct AudioSource owner assertion and dispatch focused suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='3fe4598d5756b749df5b1347273005df65eddc81'
          test "$(git rev-parse HEAD)" = "$expected"
          file='Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs')
          s=p.read_text()
          old='''            Assert.That(special.transform.parent, Is.Not.Null);\n            Assert.That(special.transform.parent.name, Is.EqualTo("Audio"),\n                "EnterGame must remain owned by the persistent RokasAudio Audio root, not the disposed Main Menu.");'''
          new='''            Assert.That(special.gameObject.name, Is.EqualTo("Audio"),\n                "EnterGame must remain on the persistent RokasAudio Audio root, not the disposed Main Menu.");'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'test: correct EnterGame persistent owner assertion'
          git push origin HEAD:feature/main-menu-interaction-ui-audio-home-transition
          gh workflow run main-menu-interaction-audio-transition-tdd.yml --ref feature/main-menu-interaction-ui-audio-home-transition
