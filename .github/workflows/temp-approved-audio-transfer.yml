name: TEMP Dispatch Main Menu Regressions

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact feature head and dispatch existing regressions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api repos/${{ github.repository }}/branches/feature/main-menu-interaction-ui-audio-home-transition --jq .commit.sha)"
          test "$actual" = '510efc00846cf9c2b5b0261f88c3d6bf489691c9'
          gh workflow run story-intro-main-menu-tdd.yml --ref feature/main-menu-interaction-ui-audio-home-transition
          gh workflow run unity-ci.yml --ref feature/main-menu-interaction-ui-audio-home-transition
          echo "DISPATCH_FEATURE_HEAD=$actual"
