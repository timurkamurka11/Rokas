name: TEMP Dispatch Post-Fix Regressions

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing regressions on exact fixed feature
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          actual="$(gh api repos/$repo/branches/feature/main-menu-interaction-ui-audio-home-transition --jq .commit.sha)"
          test "$actual" = '6193ad82f059aca60a57fefea4a8d8e0baae6026'
          gh workflow run story-intro-main-menu-tdd.yml --repo "$repo" --ref feature/main-menu-interaction-ui-audio-home-transition
          gh workflow run unity-ci.yml --repo "$repo" --ref feature/main-menu-interaction-ui-audio-home-transition
          echo "DISPATCH_FEATURE_HEAD=$actual"
