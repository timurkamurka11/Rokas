name: TEMP EnterGame Direct Replay Diagnostic

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature
        uses: actions/checkout@v4
        with:
          ref: feature/main-menu-interaction-ui-audio-home-transition
          fetch-depth: 1
      - name: Probe direct replay on assigned EnterGame source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='03240a40fb13af6760bb4eedd61c6ee675b21d50'
          test "$(git rev-parse HEAD)" = "$expected"
          file='Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs')
          s=p.read_text()
          old='''            Assert.That(special.isPlaying, Is.True,\n                "EnterGame source is assigned and loaded but playback did not start or already stopped.");'''
          new='''            if (!special.isPlaying)\n            {\n                special.Play();\n                yield return null;\n                Assert.Fail("EnterGame production playback was false; directReplay=" + special.isPlaying +\n                    "; length=" + special.clip.length + "; samples=" + special.clip.samples +\n                    "; frequency=" + special.clip.frequency + "; timeSamples=" + special.timeSamples);\n            }'''
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'test: isolate EnterGame direct replay'
          git push origin HEAD:feature/main-menu-interaction-ui-audio-home-transition
          gh workflow run main-menu-interaction-audio-transition-tdd.yml --ref feature/main-menu-interaction-ui-audio-home-transition
