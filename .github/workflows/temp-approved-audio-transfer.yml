name: TEMP Approved Audio Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact approved WAV hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Assets/Rokas/Audio/ButtonClick.wav Assets/Rokas/Audio/EnterGame.wav
          test "$(sha256sum Assets/Rokas/Audio/ButtonClick.wav | awk '{print $1}')" = '34f94b176a7ab7ce57c267e2b04b1632283fb996b1f4ba1412efb1350bfc4e96'
          test "$(sha256sum Assets/Rokas/Audio/EnterGame.wav | awk '{print $1}')" = '6e918a601a51a91457fded9451f3535a11c393b175039c5d113c712c10f55809'
