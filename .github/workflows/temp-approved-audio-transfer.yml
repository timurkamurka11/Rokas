name: TEMP Dispatch Laptop Click TDD RED

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch focused RED on exact feature test head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          actual="$(gh api repos/$repo/branches/feature/main-menu-interaction-ui-audio-home-transition --jq .commit.sha)"
          test "$actual" = 'a88de288cada42a92da3626a8ada4569caab86f3'
          gh workflow run main-menu-interaction-audio-transition-tdd.yml --repo "$repo" --ref feature/main-menu-interaction-ui-audio-home-transition
          echo "DISPATCH_FEATURE_HEAD=$actual"
