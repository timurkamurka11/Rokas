name: TEMP Approved Audio Transfer

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve firestorage API origin
        shell: bash
        run: |
          set -euo pipefail
          share='2A7x61dQsx57'
          curl --fail --location --silent --show-error "https://firestorage.ai/ja/f/${share}" -o /tmp/share.html
          grep -Eo 'src="[^"]+\.js"' /tmp/share.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/scripts.txt
          : > /tmp/all.js
          while IFS= read -r src; do
            case "$src" in
              http*) url="$src" ;;
              *) url="https://firestorage.ai$src" ;;
            esac
            curl --fail --location --silent --show-error "$url" >> /tmp/all.js
            printf '\n' >> /tmp/all.js
          done < /tmp/scripts.txt
          echo '--- absolute HTTPS strings near API/download/share code ---'
          python3 - <<'PY'
          import re
          s=open('/tmp/all.js',encoding='utf-8',errors='ignore').read()
          for pat in [r'https://[^"\'`\\ ]+', r'.{0,220}/files\?maxResults.{0,220}', r'.{0,300}/download.{0,300}']:
              seen=set()
              for m in re.finditer(pat,s):
                  v=m.group(0)
                  if v not in seen:
                      seen.add(v); print(v[:900])
          PY
          echo '--- candidate f assignments / API constants ---'
          grep -Eo '.{0,180}([A-Za-z_$][A-Za-z0-9_$]*=["'"'"']https?://[^"'"'"']+|api[^,;]{0,160}|downloadUrl.{0,220}).{0,180}' /tmp/all.js | head -200 || true
          exit 1
