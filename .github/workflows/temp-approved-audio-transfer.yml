name: TEMP Diagnose EnterGame Handoff State

on:
  push:
    branches:
      - wip/main-menu-interaction-ui-audio-home-transition
    paths:
      - .github/workflows/temp-approved-audio-transfer.yml

permissions:
  contents: write
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature
        uses: actions/checkout@v4
        with:
          ref: feature/main-menu-interaction-ui-audio-home-transition
          fetch-depth: 1
      - name: Add handoff-state diagnostics without changing assertion logic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='2880db81e1a644c773a9f133ca05dc08650a054e'
          test "$(git rev-parse HEAD)" = "$expected"
          file='Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Rokas/Tests/PlayMode/MainMenuInteractionAudioTransitionPlayModeTests.cs')
          s=p.read_text()
          old='''            Assert.That(special != null && (special.isPlaying || completedNaturally), Is.True,\n                "EnterGame SFX must survive Main Menu cleanup; headless CI may naturally consume the full clip in one frame, but truncation/Stop must not reset it.");'''
          new='''            Assert.That(special != null && (special.isPlaying || completedNaturally), Is.True,\n                "EnterGame SFX must survive Main Menu cleanup; headless CI may naturally consume the full clip in one frame, but truncation/Stop must not reset it." +\n                " isPlaying=" + (special != null && special.isPlaying) +\n                "; timeSamples=" + (special != null ? special.timeSamples : -1) +\n                "; samples=" + (special != null && special.clip != null ? special.clip.samples : -1) +\n                "; time=" + (special != null ? special.time : -1f) +\n                "; length=" + (special != null && special.clip != null ? special.clip.length : -1f) +\n                "; active=" + (special != null && special.gameObject.activeInHierarchy) +\n                "; enabled=" + (special != null && special.enabled));'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'test: diagnose EnterGame handoff state'
          git push origin HEAD:feature/main-menu-interaction-ui-audio-home-transition
          gh workflow run main-menu-interaction-audio-transition-tdd.yml --ref feature/main-menu-interaction-ui-audio-home-transition
