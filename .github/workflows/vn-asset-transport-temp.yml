name: ROKAS VN Asset Transport Temp

on:
  push:
    branches:
      - feature/vn-intro-yarn-flow
    paths:
      - .github/workflows/vn-asset-transport-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vn-asset-transport-temp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/vn-intro-yarn-flow
          fetch-depth: 0

      - name: Download exact one-hour asset pack
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/dev/file'
          share='zpmNA5oZtjPe'
          expected_zip_sha='1c0be252521d008881ffa7413c32d045f1263924438e7b1e45fd1bade0e0f2ce'
          curl -L --fail --max-time 30 "$api/shares/$share/files?maxResults=1000" -o /tmp/files.json
          file_id=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/files.json'))
          matches=[f for f in d['files'] if f.get('fileName')=='ROKAS_VN_Intro_Asset_Pack(2).zip']
          assert len(matches)==1, d
          print(matches[0]['fileId'])
          PY
          )
          curl -L --fail --max-time 30 -X POST "$api/shares/$share/files/$file_id/download" -o /tmp/download.json
          url=$(python3 -c "import json; print(json.load(open('/tmp/download.json'))['downloadUrl'])")
          curl -L --fail --max-time 120 "$url" -o /tmp/ROKAS_VN_Intro_Asset_Pack.zip
          actual=$(sha256sum /tmp/ROKAS_VN_Intro_Asset_Pack.zip | awk '{print $1}')
          echo "VN_ZIP_SHA256=$actual"
          test "$actual" = "$expected_zip_sha"

      - name: Verify exact 10/10 source set and hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vn-pack
          mkdir -p /tmp/vn-pack
          unzip -q /tmp/ROKAS_VN_Intro_Asset_Pack.zip -d /tmp/vn-pack
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          roots=list(Path('/tmp/vn-pack').rglob('Import_Recommended'))
          assert len(roots)==1, roots
          root=roots[0]
          expected={
              'Backgrounds/VN_BusStop_Rain_Night.png':'05075716b89159e8363819872bbdc11c5c58ecadc804bab18ab88a7e3c72b99b',
              'Backgrounds/VN_NightSky_Rain.png':'a44004677fb4f91ab7672287c546749a47f6b936b735e6aaaf6a48d63ea9afdd',
              'Characters/Keiko_CharacterSheet.png':'8c0790bdf572d77cf6ed049958cc8a5a56a18d7cffff763798879933954e450d',
              'Characters/Mina_CharacterSheet.png':'6c2000d56575f61d72047b90482c9ec9bb3c856960a9fb4899ef5131ca9686c4',
              'Scenes/VN_BusStop_PhoneMessage_Mina.png':'32d6ed87f12e84da93551a0b4bf69b419263f52738322cb8df276c067e137d90',
              'UI/Controls/VN_Icon_Mute.png':'3ad3dba67de8cf7e4c2c4a245603b7310b61ff79b4a91c55e5c0691c1e451cce',
              'UI/Controls/VN_Icon_Pause.png':'4796c6a1250613d089e0d56a8b50b4b5d8d362cd0cbbcbbf9d4a021b727053b6',
              'UI/Controls/VN_Icon_Skip.png':'dce53d56bb0c987f6ef18dae019ae19cf00bc43ebd17d12a9bdd5d9bf192dc28',
              'UI/Dialogue/VN_DialoguePanel_Keiko_Dark.png':'29b2b68b7129e3d0763edf7b251c13b866b6801906592f58899e8472acba9b26',
              'UI/Dialogue/VN_DialoguePanel_Mina_Light.png':'e619af1b2218264aa387b01cdcbf4fc61c4cd98aedbe6a5b771a3a86e21242ea',
          }
          actual={p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*.png')}
          assert set(actual)==set(expected), f'missing={sorted(set(expected)-set(actual))} extra={sorted(set(actual)-set(expected))}'
          assert actual==expected, [(k,actual[k],expected[k]) for k in expected if actual[k]!=expected[k]]
          print('VN_SOURCE_COUNT=10')
          for k in sorted(actual): print(actual[k], k)
          PY

      - name: Copy only Import_Recommended into ROKAS
        shell: bash
        run: |
          set -euo pipefail
          root=$(find /tmp/vn-pack -type d -path '*/Import_Recommended' | head -1)
          test -n "$root"
          rm -rf Assets/Rokas/Art/VN
          mkdir -p Assets/Rokas/Art/VN/{Characters,Backgrounds,Scenes,UI/Dialogue,UI/Controls}
          cp "$root/Characters/"*.png Assets/Rokas/Art/VN/Characters/
          cp "$root/Backgrounds/"*.png Assets/Rokas/Art/VN/Backgrounds/
          cp "$root/Scenes/"*.png Assets/Rokas/Art/VN/Scenes/
          cp "$root/UI/Dialogue/"*.png Assets/Rokas/Art/VN/UI/Dialogue/
          cp "$root/UI/Controls/"*.png Assets/Rokas/Art/VN/UI/Controls/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('Assets/Rokas/Art/VN')
          expected={
              'Backgrounds/VN_BusStop_Rain_Night.png':'05075716b89159e8363819872bbdc11c5c58ecadc804bab18ab88a7e3c72b99b',
              'Backgrounds/VN_NightSky_Rain.png':'a44004677fb4f91ab7672287c546749a47f6b936b735e6aaaf6a48d63ea9afdd',
              'Characters/Keiko_CharacterSheet.png':'8c0790bdf572d77cf6ed049958cc8a5a56a18d7cffff763798879933954e450d',
              'Characters/Mina_CharacterSheet.png':'6c2000d56575f61d72047b90482c9ec9bb3c856960a9fb4899ef5131ca9686c4',
              'Scenes/VN_BusStop_PhoneMessage_Mina.png':'32d6ed87f12e84da93551a0b4bf69b419263f52738322cb8df276c067e137d90',
              'UI/Controls/VN_Icon_Mute.png':'3ad3dba67de8cf7e4c2c4a245603b7310b61ff79b4a91c55e5c0691c1e451cce',
              'UI/Controls/VN_Icon_Pause.png':'4796c6a1250613d089e0d56a8b50b4b5d8d362cd0cbbcbbf9d4a021b727053b6',
              'UI/Controls/VN_Icon_Skip.png':'dce53d56bb0c987f6ef18dae019ae19cf00bc43ebd17d12a9bdd5d9bf192dc28',
              'UI/Dialogue/VN_DialoguePanel_Keiko_Dark.png':'29b2b68b7129e3d0763edf7b251c13b866b6801906592f58899e8472acba9b26',
              'UI/Dialogue/VN_DialoguePanel_Mina_Light.png':'e619af1b2218264aa387b01cdcbf4fc61c4cd98aedbe6a5b771a3a86e21242ea',
          }
          actual={p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*.png')}
          assert actual==expected
          assert not any('Source_All_Submissions' in str(p) for p in root.rglob('*'))
          print('VN_REPO_ASSET_GATE=10/10 PASS')
          PY

      - name: Commit exact binary import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rokas-checkpoint-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Assets/Rokas/Art/VN
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -c '\.png$')" -eq 10
          test "$(git diff --cached --name-only | grep -c 'Source_All_Submissions')" -eq 0
          git commit -m 'assets: import VN intro art pack'
          git push origin HEAD:feature/vn-intro-yarn-flow
