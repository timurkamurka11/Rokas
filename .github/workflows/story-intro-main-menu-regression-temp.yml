name: ROKAS Story Menu Regression Verification TEMP

on:
  push:
    branches:
      - feature/story-intro-main-menu
    paths:
      - .github/workflows/story-intro-main-menu-regression-temp.yml

permissions:
  contents: read
  checks: write

concurrency:
  group: story-menu-regression-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-structural-regressions:
    name: Structural regression ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RealStartGate
            filter: Rokas.Tests.StartupLaptopVideoPlayModeTests.RealStartDoesNotBuildHomeBeforeStartupVideoGate
          - name: LaptopBootGate
            filter: Rokas.Tests.StartupLaptopVideoPlayModeTests.LaptopOpeningShowsBootGateBeforeDesktop
          - name: LaptopCancelReopen
            filter: Rokas.Tests.StartupLaptopVideoPlayModeTests.ClosingLaptopDuringBootCancelsWithoutDesktopAndReopenIsReady
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7

      - name: Hide Linux-unsupported media only for structural gate timing
        shell: bash
        run: |
          set -euo pipefail
          mv Assets/StreamingAssets/RokasVideo/StartupPreview.mp4 Assets/StreamingAssets/RokasVideo/StartupPreview.mp4.linux-structural-hidden
          mv Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4 Assets/StreamingAssets/RokasVideo/LaptopBoot.mp4.linux-structural-hidden

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: StoryMenuStructural-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Assets/**/*.cs', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StoryMenuStructural-${{ runner.os }}-${{ matrix.name }}-
            StoryIntroMainMenu-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run structural PlayMode regression
        id: regression
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          testMode: PlayMode
          cliVersion: v0.1.60
          customParameters: -testFilter ${{ matrix.filter }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Story Menu Structural ${{ matrix.name }}

      - name: Require exactly one structural test green
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/playmode-results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse('artifacts/playmode-results.xml').getroot()
          values = tuple(int(r.attrib.get(k, '-1')) for k in ('total','passed','failed','skipped'))
          print('STRUCTURAL_XML total=%d passed=%d failed=%d skipped=%d' % values)
          if values != (1,1,0,0):
              raise SystemExit('Expected exactly 1/1 structural regression green')
          PY

      - name: Preserve structural evidence
        if: always()
        shell: bash
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git diff --check > verification/git-diff-check.txt || true
          if [ -f artifacts/playmode-results.xml ]; then cp artifacts/playmode-results.xml verification/${{ matrix.name }}-results.xml; fi

      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-menu-structural-${{ matrix.name }}
          path: |
            artifacts
            verification
          if-no-files-found: error
