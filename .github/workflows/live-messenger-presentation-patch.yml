name: Live Messenger Presentation Patch

on:
  push:
    branches:
      - feature/messages-system
    paths:
      - .github/workflows/live-messenger-presentation-patch.yml
      - Tools/apply_live_messenger_presentation.py
      - Tools/fix_live_messenger_presentation_patch.py

permissions:
  contents: write
  checks: write

jobs:
  playmode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/messages-system
          fetch-depth: 0

      - name: Migrate stale PlayMode identity assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing PlayMode migration anchor: {label} in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          guild = "Assets/Rokas/Tests/PlayMode/HunterGuildPlayModeTests.cs"
          replace_once(guild,
          '''            RokasBootstrap restoredBoot = Bootstrap();
            ConversationState restored = restoredBoot.Session.Messages.GetConversation("guild");
            Assert.That(restored.entries.Count, Is.EqualTo(2),
                "Stop/Play must preserve offer plus exactly one acceptance follow-up");
            MessageEntry restoredOffer = FindContractOffer(restored);
            Assert.That(restoredOffer.attachment.opened, Is.True);
            Button restoredCard = FindButton("MessagesAttachment_" + restoredOffer.attachment.id);
            Assert.That(restoredCard.IsInteractable(), Is.False);
            AssertGuildIdentity(restoredCard);
            Assert.That(restored.entries[1].eventId,
                Is.EqualTo("guild-contract-accepted:" + restoredBoot.Session.Contract.id));
            Assert.That(FindTextUnder("MessagesContactFace_guild", "Preview"), Is.EqualTo(AcceptedPreview));
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "historical Guild follow-up must not become a fresh notification after reload");
            LogAssert.NoUnexpectedReceived();
''',
          '''            RokasBootstrap restoredBoot = Bootstrap();
            ConversationState restored = restoredBoot.Session.Messages.GetConversation("guild");
            string offerEventId = "guild-contract-offer:" + restoredBoot.Session.Contract.id;
            string acceptedEventId = "guild-contract-accepted:" + restoredBoot.Session.Contract.id;
            string liveOfferEventId = "live:guild:offer:" + offerEventId + ":bubble:1";
            string liveAcceptedEventId = "live:guild:accepted:" + acceptedEventId + ":bubble:1";
            Assert.That(restored.entries.Count, Is.EqualTo(4),
                "Stop/Play must preserve the two core Guild events plus their two deterministic live continuations");
            Assert.That(CountEvent(restored, offerEventId), Is.EqualTo(1), "original Guild offer must remain exactly once");
            Assert.That(CountEvent(restored, acceptedEventId), Is.EqualTo(1), "core Guild acceptance must remain exactly once");
            Assert.That(CountEvent(restored, liveOfferEventId), Is.EqualTo(1), "live Guild offer continuation must recover exactly once");
            Assert.That(CountEvent(restored, liveAcceptedEventId), Is.EqualTo(1), "live Guild acceptance continuation must recover exactly once");
            Assert.That(restored.unreadCount, Is.EqualTo(0),
                "opening Guild after recovery must consume its legitimate recovered unread without duplicating it");
            MessageEntry restoredOffer = FindContractOffer(restored);
            Assert.That(restoredOffer.attachment.opened, Is.True);
            Button restoredCard = FindButton("MessagesAttachment_" + restoredOffer.attachment.id);
            Assert.That(restoredCard.IsInteractable(), Is.False);
            AssertGuildIdentity(restoredCard);
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "historical/recovered Guild content must not become a fresh popup after bootstrap");

            restoredBoot.SaveNow();
            yield return DestroyAndRecreate();
            Press("LaptopHotspot");
            Press("LaptopMessages");
            Press("MessagesContact_guild");
            for (int frame = 0; frame < 4; frame++) yield return null;

            ConversationState restoredAgain = Bootstrap().Session.Messages.GetConversation("guild");
            Assert.That(restoredAgain.entries.Count, Is.EqualTo(4), "a second reload must not append another Guild continuation");
            Assert.That(CountEvent(restoredAgain, offerEventId), Is.EqualTo(1));
            Assert.That(CountEvent(restoredAgain, acceptedEventId), Is.EqualTo(1));
            Assert.That(CountEvent(restoredAgain, liveOfferEventId), Is.EqualTo(1));
            Assert.That(CountEvent(restoredAgain, liveAcceptedEventId), Is.EqualTo(1));
            Assert.That(restoredAgain.unreadCount, Is.EqualTo(0));
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "second bootstrap must remain silent for already recovered Guild history");
            LogAssert.NoUnexpectedReceived();
''', "Guild save/load identity semantics")
          replace_once(guild,
          '''        private void Press(string name)
''',
          '''        private static int CountEvent(ConversationState conversation, string eventId)
        {
            int count = 0;
            if (conversation == null || conversation.entries == null) return count;
            for (int index = 0; index < conversation.entries.Count; index++)
            {
                MessageEntry entry = conversation.entries[index];
                if (entry != null && string.Equals(entry.eventId, eventId, StringComparison.Ordinal)) count++;
            }
            return count;
        }

        private void Press(string name)
''', "Guild CountEvent helper")

          yumiko = "Assets/Rokas/Tests/PlayMode/YumikoFoodPlayModeTests.cs"
          replace_once(yumiko,
          '''            ConversationState restored = Bootstrap().Session.Messages.GetConversation("yumiko");
            Assert.That(restored.entries.Count, Is.EqualTo(1), "reload must preserve exactly one historical purchase reaction");
            Assert.That(restored.unreadCount, Is.EqualTo(1), "historical unread state must survive without redelivery");
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "bootstrap must not turn historical unread into a fresh popup");
            LogAssert.NoUnexpectedReceived();
''',
          '''            RokasBootstrap restoredBoot = Bootstrap();
            ConversationState restored = restoredBoot.Session.Messages.GetConversation("yumiko");
            string purchaseEventId = "yumiko-food-first:" + FoodService.GreenTeaId;
            string livePurchaseEventId = "live:yumiko:purchase:" + purchaseEventId + ":bubble:1";
            Assert.That(restored.entries.Count, Is.EqualTo(2),
                "reload must preserve the authored purchase reaction plus one deterministic live continuation");
            Assert.That(CountEvent(restored, purchaseEventId), Is.EqualTo(1), "core first-purchase reaction must remain exactly once");
            Assert.That(CountEvent(restored, livePurchaseEventId), Is.EqualTo(1), "live Yumiko purchase continuation must recover exactly once");
            Assert.That(restored.unreadCount, Is.EqualTo(2),
                "one legitimate recovered continuation may add one unread, but bootstrap must not duplicate either event");
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "bootstrap recovery must not turn historical/live recovered unread into a fresh popup");

            restoredBoot.SaveNow();
            yield return DestroyAndRecreate();
            for (int frame = 0; frame < 4; frame++) yield return null;

            ConversationState restoredAgain = Bootstrap().Session.Messages.GetConversation("yumiko");
            Assert.That(restoredAgain.entries.Count, Is.EqualTo(2), "a second reload must not append another purchase continuation");
            Assert.That(CountEvent(restoredAgain, purchaseEventId), Is.EqualTo(1));
            Assert.That(CountEvent(restoredAgain, livePurchaseEventId), Is.EqualTo(1));
            Assert.That(restoredAgain.unreadCount, Is.EqualTo(2), "second reload must not increment historical unread again");
            Assert.That(FindRect("MessagesNotification"), Is.Null,
                "second bootstrap must remain silent for already recovered Yumiko history");
            LogAssert.NoUnexpectedReceived();
''', "Yumiko purchase save/load identity semantics")
          replace_once(yumiko,
          '''        private void Press(string name)
''',
          '''        private static int CountEvent(ConversationState conversation, string eventId)
        {
            int count = 0;
            if (conversation == null || conversation.entries == null) return count;
            for (int index = 0; index < conversation.entries.Count; index++)
            {
                MessageEntry entry = conversation.entries[index];
                if (entry != null && string.Equals(entry.eventId, eventId, StringComparison.Ordinal)) count++;
            }
            return count;
        }

        private void Press(string name)
''', "Yumiko CountEvent helper")

          lifecycle = "Assets/Rokas/Tests/PlayMode/MessagesLifecyclePlayModeTests.cs"
          replace_once(lifecycle,
          '''            ConversationState after = Bootstrap().Session.Messages.GetConversation("kaito");
            CollectionAssert.AreEqual(idsBefore, MessageIds(after),
                "reload must not append or reorder authored history while reconstructing the UI");
            Assert.That(FindButton("MessagesChoice_kaito_choice_details"), Is.Null,
                "a completed persisted dialogue must not expose its first choice set again");
            Assert.That(FindButton("MessagesChoice_kaito_choice_skeptic"), Is.Null,
                "a completed persisted dialogue must not visually restart from Kaito_Start");
            LogAssert.NoUnexpectedReceived();
''',
          '''            RokasBootstrap restoredBoot = Bootstrap();
            ConversationState after = restoredBoot.Session.Messages.GetConversation("kaito");
            string liveCoordinatesEventId = "live:kaito:coordinates:kaito_coordinates_attachment:bubble:1";
            string[] idsAfter = MessageIds(after);
            Assert.That(idsAfter.Length, Is.EqualTo(idsBefore.Length + 1),
                "reload may append only the one persisted deterministic Kaito coordinate continuation");
            for (int index = 0; index < idsBefore.Length; index++)
                Assert.That(idsAfter[index], Is.EqualTo(idsBefore[index]),
                    "reload must not append, reorder, or replace any pre-existing Yarn/dialogue entry at index " + index);
            Assert.That(CountEvent(after, "kaito_intro_01"), Is.EqualTo(1));
            Assert.That(CountEvent(after, "kaito_details_reply"), Is.EqualTo(1));
            Assert.That(CountEvent(after, "kaito_anomaly_01"), Is.EqualTo(1));
            Assert.That(CountEvent(after, "kaito_guild_details"), Is.EqualTo(1));
            Assert.That(CountEvent(after, "kaito_coordinates_01"), Is.EqualTo(1));
            Assert.That(CountEvent(after, "kaito_coordinates_attachment"), Is.EqualTo(1));
            Assert.That(CountChoice(after, "kaito_choice_details"), Is.EqualTo(1));
            Assert.That(CountChoice(after, "kaito_choice_guild"), Is.EqualTo(1));
            Assert.That(after.completedDialogueIds, Does.Contain("Kaito_Start"),
                "completed Yarn node must remain completed after recovery");
            Assert.That(CountEvent(after, liveCoordinatesEventId), Is.EqualTo(1),
                "pending Kaito coordinate continuation must recover exactly once");
            MessageEntry continuation = FindEvent(after, liveCoordinatesEventId);
            Assert.That(continuation, Is.Not.Null);
            Assert.That(continuation.messageId, Is.EqualTo("msg-9"));
            Assert.That(continuation.sequence, Is.EqualTo(9));
            Assert.That(continuation.outgoing, Is.False, "recovered continuation must remain an incoming Kaito bubble");
            Assert.That(continuation.chainId, Is.EqualTo("live:kaito:coordinates:kaito_coordinates_attachment"));
            Assert.That(continuation.text,
                Is.EqualTo("Если маркер сместится хотя бы на один сектор — не следуй за ним автоматически."));
            Assert.That(FindButton("MessagesChoice_kaito_choice_details"), Is.Null,
                "a completed persisted dialogue must not expose its first choice set again");
            Assert.That(FindButton("MessagesChoice_kaito_choice_skeptic"), Is.Null,
                "a completed persisted dialogue must not visually restart from Kaito_Start");

            restoredBoot.SaveNow();
            yield return DestroyAndRecreate();
            for (int frame = 0; frame < 4; frame++) yield return null;

            ConversationState afterSecondReload = Bootstrap().Session.Messages.GetConversation("kaito");
            Assert.That(afterSecondReload.entries.Count, Is.EqualTo(idsBefore.Length + 1),
                "a second reload must not append another Kaito coordinate continuation");
            Assert.That(CountEvent(afterSecondReload, liveCoordinatesEventId), Is.EqualTo(1));
            Assert.That(CountEvent(afterSecondReload, "kaito_coordinates_attachment"), Is.EqualTo(1));
            Assert.That(CountChoice(afterSecondReload, "kaito_choice_details"), Is.EqualTo(1));
            Assert.That(CountChoice(afterSecondReload, "kaito_choice_guild"), Is.EqualTo(1));
            Assert.That(afterSecondReload.completedDialogueIds, Does.Contain("Kaito_Start"));
            LogAssert.NoUnexpectedReceived();
''', "Kaito completed dialogue recovery semantics")
          replace_once(lifecycle,
          '''        private static string[] MessageIds(ConversationState conversation)
''',
          '''        private static int CountEvent(ConversationState conversation, string eventId)
        {
            int count = 0;
            if (conversation == null || conversation.entries == null) return count;
            for (int index = 0; index < conversation.entries.Count; index++)
            {
                MessageEntry entry = conversation.entries[index];
                if (entry != null && string.Equals(entry.eventId, eventId, StringComparison.Ordinal)) count++;
            }
            return count;
        }

        private static int CountChoice(ConversationState conversation, string choiceId)
        {
            int count = 0;
            if (conversation == null || conversation.entries == null) return count;
            for (int index = 0; index < conversation.entries.Count; index++)
            {
                MessageEntry entry = conversation.entries[index];
                if (entry != null && string.Equals(entry.choiceId, choiceId, StringComparison.Ordinal)) count++;
            }
            return count;
        }

        private static MessageEntry FindEvent(ConversationState conversation, string eventId)
        {
            if (conversation == null || conversation.entries == null) return null;
            for (int index = 0; index < conversation.entries.Count; index++)
            {
                MessageEntry entry = conversation.entries[index];
                if (entry != null && string.Equals(entry.eventId, eventId, StringComparison.Ordinal)) return entry;
            }
            return null;
        }

        private static string[] MessageIds(ConversationState conversation)
''', "Kaito lifecycle identity helpers")
          PY

      - name: Repair presentation patch anchor
        run: python3 Tools/fix_live_messenger_presentation_patch.py

      - name: Apply Live Messenger presentation patch
        run: python3 Tools/apply_live_messenger_presentation.py

      - name: Literal diff check
        run: git diff --check

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Unity-Live-Messenger-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Live-Messenger-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run PlayMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: PlayMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Live Messenger PlayMode Gate

      - name: Upload PlayMode artifacts
        if: always() && steps.unity-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: live-messenger-playmode-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn

      - name: Persist green presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Tools/apply_live_messenger_presentation.py \
            Assets/Rokas/Scripts/Presentation/LaptopMessagesView.cs \
            Assets/Rokas/Scripts/Presentation/LaptopView.cs \
            Assets/Rokas/Scripts/Presentation/HomeView.cs \
            Assets/Rokas/Scripts/Presentation/RokasView.cs \
            Assets/Rokas/Scripts/Presentation/RokasAudio.cs \
            Assets/Rokas/Tests/PlayMode/HunterGuildPlayModeTests.cs \
            Assets/Rokas/Tests/PlayMode/YumikoFoodPlayModeTests.cs \
            Assets/Rokas/Tests/PlayMode/MessagesLifecyclePlayModeTests.cs
          git commit -m "feat: add Live Messenger presentation and notification routing"
          git push origin HEAD:feature/messages-system
