name: ROKAS Story Menu Focused Visual Proof TEMP

# Focused rerun after MainMenuView-only visual polish. Reuses the proven launch/video path but skips long natural playback.
on:
  push:
    branches:
      - feature/story-intro-main-menu
    paths:
      - Assets/Rokas/Scripts/Presentation/MainMenuView.cs
      - Assets/Rokas/Scripts/Presentation/StoryMenuRuntimeProofObserver.cs
      - .github/workflows/story-intro-main-menu-player-proof-v3-temp.yml

permissions:
  contents: read

concurrency:
  group: story-menu-focused-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-player:
    name: Build Focused Windows Visual Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require exact source media and temporary observer
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/StoryIntro.mp4 | cut -d' ' -f1)" = '4f1cf02df5e52f8dd75645ceb1c6b0d5b55b0eb952eee1371d742ca54395c6d4'
          test "$(sha256sum Assets/StreamingAssets/RokasVideo/MainMenuLoop.mp4 | cut -d' ' -f1)" = 'bb2eb60336c4b1e63a5b2a177c0db904b6d32bee5f59c48568def81cfa8beef5'
          test -s Assets/Rokas/Scripts/Presentation/StoryMenuRuntimeProofObserver.cs
          test -s Assets/Rokas/Scripts/Presentation/StoryMenuRuntimeProofObserver.cs.meta
          test -z "$(git status --short --untracked-files=all)"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: StoryMenu-FocusedVisual-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            StoryMenu-WindowsBuildV3-${{ runner.os }}-
            StoryMenu-WindowsBuildV2-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Build Windows Development Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: Rokas
          buildMethod: Rokas.Editor.RokasVideoSmokeBuild.Build
          versioning: None

      - name: Require executable and exact packaged approved media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-proof
          EXE="$(find build -type f -iname 'Rokas.exe' -print -quit)"
          STORY="$(find build -type f -path '*/StreamingAssets/RokasVideo/StoryIntro.mp4' -print -quit)"
          MENU="$(find build -type f -path '*/StreamingAssets/RokasVideo/MainMenuLoop.mp4' -print -quit)"
          test -n "$EXE" && test -s "$EXE"
          test "$(sha256sum "$STORY" | cut -d' ' -f1)" = '4f1cf02df5e52f8dd75645ceb1c6b0d5b55b0eb952eee1371d742ca54395c6d4'
          test "$(sha256sum "$MENU" | cut -d' ' -f1)" = 'bb2eb60336c4b1e63a5b2a177c0db904b6d32bee5f59c48568def81cfa8beef5'
          {
            echo 'WINDOWS_BUILD=PASS'
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse HEAD^{tree})"
            echo 'STORY_PACKAGED_BYTE_IDENTICAL=PASS'
            echo 'MENU_PACKAGED_BYTE_IDENTICAL=PASS'
          } > build-proof/summary.txt

      - name: Upload focused Windows player
        uses: actions/upload-artifact@v7
        with:
          name: rokas-story-menu-focused-player
          path: build
          if-no-files-found: error

      - name: Upload focused build proof
        uses: actions/upload-artifact@v7
        with:
          name: story-menu-focused-build-proof
          path: build-proof
          if-no-files-found: error

  windows-runtime:
    name: Focused Main Menu Visual Runtime Proof
    needs: build-player
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Download focused Windows player
        uses: actions/download-artifact@v8
        with:
          name: rokas-story-menu-focused-player
          path: player

      - name: Run fast-to-menu visual + two-loop + cleanup proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path player -Filter Rokas.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Rokas.exe missing' }
          $work = $exe.Directory.FullName
          $log = Join-Path $work 'Player-story-menu-visual.log'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @('-rokasStoryMenuProof','visual','-screen-fullscreen','0','-screen-width','960','-screen-height','540','-logFile',$log) -WorkingDirectory $work -PassThru
          if (-not $p.WaitForExit(60000)) { try { $p.Kill($true) } catch {}; throw 'focused visual proof timeout' }
          $p.WaitForExit()
          $dir = Join-Path $work 'rokas-story-menu-proof-visual'
          New-Item -ItemType Directory -Force -Path windows-proof/visual | Out-Null
          if (Test-Path $dir) { Copy-Item "$dir/*" windows-proof/visual -Recurse -Force }
          if (Test-Path $log) { Copy-Item $log windows-proof/visual/Player.log -Force }
          if ($p.ExitCode -ne 0) { throw "focused visual proof failed: $($p.ExitCode)" }
          $proof = Get-Content windows-proof/visual/proof.txt -Raw
          foreach ($required in @('STARTUP_SKIP_TO_STORY=PASS','STORY_SKIP_TO_MENU=PASS','STORY_VIDEO_AUDIO_RT_CLEANUP=PASS','MENU_VISUAL_STATES_CAPTURED=PASS','MENU_TWO_FULL_LOOPS=PASS','MENU_LOOP_REUSES_PLAYER_AUDIO_RT=PASS','MENU_AUDIO_NO_VOLUME_STACKING=PASS','MENU_BUTTONS_INTERACTABLE_AFTER_TWO_LOOPS=PASS','ABOUT_CLICK_NOOP=PASS','SUPPORT_CLICK_NOOP=PASS','MENU_UI_STATIONARY_OVER_VIDEO=PASS','ENTER_WORLD_TO_EXISTING_HOME=PASS','MENU_AUDIO_STOP_NO_GHOST=PASS','RENDERTEXTURE_CLEANUP=PASS','FINAL_PASS=TRUE')) { if ($proof -notmatch [regex]::Escape($required)) { throw "missing focused visual proof: $required" } }
          foreach ($shot in @('menu-stable.png','menu-enter-selected.png','menu-about-selected.png','menu-support-selected.png','menu-loop-before.png','menu-loop-after.png')) { if (-not (Test-Path "windows-proof/visual/$shot")) { throw "missing screenshot $shot" } }

      - name: Upload focused visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-menu-focused-visual-proof
          path: windows-proof
          if-no-files-found: error
