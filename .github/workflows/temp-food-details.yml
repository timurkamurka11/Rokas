name: TEMP food detail generation
on:
  pull_request:
    branches: [development]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'fix/yomi-food-feedback-click'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate quality-pass detail assets
        run: python Tools/temp_generate_food_details.py
      - name: Commit generated assets to verification branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Rokas/Resources/Food/Details Assets/Rokas/Resources/Food/Details.meta
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'chore: generate YOMI food detail assets'
          git push origin HEAD:${{ github.head_ref }}
