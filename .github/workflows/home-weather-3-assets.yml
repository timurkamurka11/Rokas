name: Home Weather 3 Licensed Source Assets

on:
  push:
    branches: [ci/home-weather-3]
    paths:
      - .github/workflows/home-weather-3-assets.yml
      - Tools/CI/author_weather3_assets.py

permissions:
  contents: write

jobs:
  acquire-and-author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download exact CC0 source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Weather3Sources
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/rain_overlay_0.png' \
            -o Weather3Sources/rain_overlay.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/fog01.png' \
            -o Weather3Sources/fog01.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha02.png' \
            -o Weather3Sources/fx_cloudalpha02.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha05.png' \
            -o Weather3Sources/fx_cloudalpha05.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/RaindropsOnWindow.jpg' \
            -o Weather3Sources/RaindropsOnWindow.jpg
          cp Assets/Rokas/Art/Home/ApartmentNight.png Weather3Sources/ApartmentNight.png

      - name: Record source checksums and dimensions
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Weather3Sources/* | tee Weather3Sources/SHA256SUMS.txt
          file Weather3Sources/* | tee Weather3Sources/FILE_INFO.txt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic authoring dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy opencv-python-headless

      - name: Run existing deterministic Weather 3 authoring script
        shell: bash
        run: |
          set -euo pipefail
          python Tools/CI/author_weather3_assets.py | tee Weather3Sources/AUTHORING_OUTPUT.txt

      - name: Validate authored alpha resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('Assets/Rokas/Resources/Weather3')
          expected = {
              'RainStreakAuthored.png',
              'WetGlassDroplets.png',
              'WetGlassStreaks.png',
              'DistantHaze.png',
              'NearMist.png',
              'StormCloudMask.png',
              'WindowGlazingMask.png',
              'WarmPracticalMask.png',
              'ColdSpillMask.png',
              'StormRoomLiftMask.png',
          }
          actual = {p.name for p in root.glob('*.png')}
          assert actual == expected, (actual, expected)
          for path in sorted(root.glob('*.png')):
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              lo, hi = alpha.getextrema()
              assert hi > 0, f'{path.name}: empty alpha'
              assert lo == 0, f'{path.name}: alpha must contain transparent pixels, got {(lo, hi)}'
              corners = [alpha.getpixel((0, 0)), alpha.getpixel((image.width-1, 0)), alpha.getpixel((0, image.height-1)), alpha.getpixel((image.width-1, image.height-1))]
              assert max(corners) <= 12, f'{path.name}: hard visible outer corner alpha {corners}'
              meta = Path(str(path) + '.meta')
              assert meta.is_file(), f'{path.name}: missing meta'
              print(path.name, image.size, 'alpha', (lo, hi), 'bytes', path.stat().st_size)

          glazing = Image.open(root / 'WindowGlazingMask.png').convert('RGBA').getchannel('A')
          assert glazing.getpixel((100, 200)) >= 250, 'left glazing panel missing'
          assert glazing.getpixel((270, 200)) <= 5, 'left mullion gap must be transparent'
          assert glazing.getpixel((350, 200)) >= 250, 'middle glazing panel missing'
          assert glazing.getpixel((505, 200)) <= 5, 'right mullion gap must be transparent'
          assert glazing.getpixel((560, 200)) >= 250, 'right glazing panel missing'
          assert Path('Assets/Rokas/Resources/Weather3.meta').is_file()
          PY

      - name: Upload licensed source bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-licensed-sources-authored
          path: Weather3Sources
          if-no-files-found: error

      - name: Upload authored runtime resources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-authored-runtime-resources
          path: |
            Assets/Rokas/Resources/Weather3.meta
            Assets/Rokas/Resources/Weather3/**
          if-no-files-found: error

      - name: Publish production-ready assets to feature branch
        if: "${{ github.event.head_commit.message == 'ci: publish Weather 3 production assets' }}"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/home-weather-3
          rm -rf /tmp/rokas-weather3-production
          git worktree add --detach /tmp/rokas-weather3-production origin/feature/home-weather-3

          mkdir -p /tmp/rokas-weather3-production/Assets/Rokas/Resources/Weather3
          mkdir -p /tmp/rokas-weather3-production/Docs/ThirdParty
          cp Assets/Rokas/Resources/Weather3.meta /tmp/rokas-weather3-production/Assets/Rokas/Resources/Weather3.meta
          cp -a Assets/Rokas/Resources/Weather3/. /tmp/rokas-weather3-production/Assets/Rokas/Resources/Weather3/

          cat > /tmp/rokas-weather3-production/Docs/ThirdParty/Weather3.md <<'EOF'
          # Home Weather 3.0 third-party/source manifest

          This milestone uses a small set of CC0 source images plus project-owned spatial masks. The annotated `HOME_WEATHER_ZONES` and `HOME_LIGHTING_ZONES` design references are not runtime assets and are not redistributed in `Assets/`.

          ## Selected CC0 sources

          | Source material | Creator | License | Acquisition URL | Deterministic use | Committed derivative(s) |
          | --- | --- | --- | --- | --- | --- |
          | `rain_overlay.png` (`rain`) | gmason | CC0 | `https://opengameart.org/sites/default/files/rain_overlay_0.png` | Connected-component extraction of a natural authored streak; alpha dilation/normalization; compact 32x96 RGBA resize. The same source is independently sampled into sparse glass streak components with different selection, placement and transform logic. | `RainStreakAuthored.png`, `WetGlassStreaks.png` |
          | `fog01.png` (`Thick Fog`) | LFA | CC0 | `https://opengameart.org/sites/default/files/fog01.png` | Resize to 512x256, retain source alpha, apply transparent edge falloff and reduced opacity for distant exterior haze. | `DistantHaze.png` |
          | `fx_cloudalpha05.png` (`Clouds with Transparency`) | WickedInsignia | CC0 | `https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha05.png` | Crop, resize, alpha strengthen/blur and independent four-edge falloff for near exterior mist. | `NearMist.png` |
          | `fx_cloudalpha02.png` (`Clouds with Transparency`) | WickedInsignia | CC0 | `https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha02.png` | Independent crop, resize, alpha strengthen/blur and edge falloff for irregular exterior storm illumination. | `StormCloudMask.png` |
          | `RaindropsOnWindow.jpg` | Wikimedia Commons contributor/source file | CC0 | `https://commons.wikimedia.org/wiki/Special:Redirect/file/RaindropsOnWindow.jpg` | Background is discarded. Local contrast, high-pass and gradient structure are filtered into a transparent compact droplet-detail alpha resource. | `WetGlassDroplets.png` |

          ## Project-owned authored spatial resources

          `ApartmentNight.png` is existing ROKAS Home source art. It is used as an alignment invariant (1672x941) while the approved Home spatial design is encoded into compact masks. No pixels from the user annotation graphics are imported into runtime resources.

          - `WindowGlazingMask.png` — 605x396 RGBA alpha mask for the actual three glazing panels; mullion gaps are transparent.
          - `WarmPracticalMask.png` — 960x540 localized warm-practical regions for the floor lamp, workbench/hallway-side practical illumination and other authored warm sources.
          - `ColdSpillMask.png` — 960x540 feathered irregular cold exterior/window spill.
          - `StormRoomLiftMask.png` — 960x540 weak irregular room-side storm response.

          ## Deterministic authoring

          The source-of-truth authoring implementation is `Tools/CI/author_weather3_assets.py` on `ci/home-weather-3`. It validates the expected Home art size, emits the exact compact filenames above, encodes visible structure in RGBA alpha, and writes stable Unity `.meta` GUIDs derived from deterministic resource paths. CI validates transparent outer edges, non-empty alpha, exact output names, presence of `.meta` files, and opaque/transparent sample points across all three glazing panels and mullion gaps.

          ## Unity import/runtime compatibility

          Final PNGs are ordinary non-readable `Texture2D` resources with mipmaps disabled, bilinear filtering, alpha transparency enabled and max texture size 1024. They are consumed by the existing Built-in Render Pipeline-compatible Unity UI / `ParticleSystem` / `RenderTexture` Home architecture. No URP migration, Shader Graph, VFX Graph or third-party runtime weather framework is required.

          ## Redistribution

          The selected external source material is CC0, so the compact transformed derivatives may be redistributed with the project. Only the compact derivatives are committed to the production branch; original high-resolution/source downloads remain CI acquisition artifacts. Existing project-owned Home art and generated spatial masks remain under the project's own repository terms.
          EOF

          cd /tmp/rokas-weather3-production
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Rokas/Resources/Weather3.meta Assets/Rokas/Resources/Weather3 Docs/ThirdParty/Weather3.md

          unexpected="$(git status --porcelain | grep -Ev '^.. (Assets/Rokas/Resources/Weather3\.meta|Assets/Rokas/Resources/Weather3/|Docs/ThirdParty/Weather3\.md)' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected production diff:'
            echo "$unexpected"
            exit 1
          fi

          git diff --cached --check
          git commit -m 'assets: add licensed Weather 3.0 visual resources'
          git push origin HEAD:feature/home-weather-3
