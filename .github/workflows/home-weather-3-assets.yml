name: Home Weather 3 Licensed Source Assets

on:
  push:
    branches: [ci/home-weather-3]
    paths:
      - .github/workflows/home-weather-3-assets.yml
      - Tools/CI/author_weather3_assets.py

permissions:
  contents: read

jobs:
  acquire-and-author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7

      - name: Download exact CC0 source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Weather3Sources
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/rain_overlay_0.png' \
            -o Weather3Sources/rain_overlay.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/fog01.png' \
            -o Weather3Sources/fog01.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha02.png' \
            -o Weather3Sources/fx_cloudalpha02.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://opengameart.org/sites/default/files/oga-textures/136561/fx_cloudalpha05.png' \
            -o Weather3Sources/fx_cloudalpha05.png
          curl --fail --location --retry 3 --user-agent 'ROKAS Weather3 asset audit' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/RaindropsOnWindow.jpg' \
            -o Weather3Sources/RaindropsOnWindow.jpg
          cp Assets/Rokas/Art/Home/ApartmentNight.png Weather3Sources/ApartmentNight.png

      - name: Record source checksums and dimensions
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Weather3Sources/* | tee Weather3Sources/SHA256SUMS.txt
          file Weather3Sources/* | tee Weather3Sources/FILE_INFO.txt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic authoring dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy opencv-python-headless

      - name: Run existing deterministic Weather 3 authoring script
        shell: bash
        run: |
          set -euo pipefail
          python Tools/CI/author_weather3_assets.py | tee Weather3Sources/AUTHORING_OUTPUT.txt

      - name: Validate authored alpha resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('Assets/Rokas/Resources/Weather3')
          expected = {
              'RainStreakAuthored.png',
              'WetGlassDroplets.png',
              'WetGlassStreaks.png',
              'DistantHaze.png',
              'NearMist.png',
              'StormCloudMask.png',
              'WindowGlazingMask.png',
              'WarmPracticalMask.png',
              'ColdSpillMask.png',
              'StormRoomLiftMask.png',
          }
          actual = {p.name for p in root.glob('*.png')}
          assert actual == expected, (actual, expected)
          for path in sorted(root.glob('*.png')):
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              lo, hi = alpha.getextrema()
              assert hi > 0, f'{path.name}: empty alpha'
              assert lo == 0, f'{path.name}: alpha must contain transparent pixels, got {(lo, hi)}'
              corners = [alpha.getpixel((0, 0)), alpha.getpixel((image.width-1, 0)), alpha.getpixel((0, image.height-1)), alpha.getpixel((image.width-1, image.height-1))]
              assert max(corners) <= 12, f'{path.name}: hard visible outer corner alpha {corners}'
              meta = Path(str(path) + '.meta')
              assert meta.is_file(), f'{path.name}: missing meta'
              print(path.name, image.size, 'alpha', (lo, hi), 'bytes', path.stat().st_size)

          glazing = Image.open(root / 'WindowGlazingMask.png').convert('RGBA').getchannel('A')
          assert glazing.getpixel((100, 200)) >= 250, 'left glazing panel missing'
          assert glazing.getpixel((270, 200)) <= 5, 'left mullion gap must be transparent'
          assert glazing.getpixel((350, 200)) >= 250, 'middle glazing panel missing'
          assert glazing.getpixel((505, 200)) <= 5, 'right mullion gap must be transparent'
          assert glazing.getpixel((560, 200)) >= 250, 'right glazing panel missing'
          assert Path('Assets/Rokas/Resources/Weather3.meta').is_file()
          PY

      - name: Upload licensed source bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-licensed-sources-authored
          path: Weather3Sources
          if-no-files-found: error

      - name: Upload authored runtime resources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: home-weather-3-authored-runtime-resources
          path: |
            Assets/Rokas/Resources/Weather3.meta
            Assets/Rokas/Resources/Weather3/**
          if-no-files-found: error
