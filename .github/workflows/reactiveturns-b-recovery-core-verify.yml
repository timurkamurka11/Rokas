name: ReactiveTurns B firestorage URL probe
on:
  push:
    branches:
      - ci/reactiveturns-b-recovery-verify

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage share page
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail "https://firestorage.ai/en/f/MECiPfupweKT" -o /tmp/page.html
          echo "PAGE_BYTES=$(wc -c </tmp/page.html)"
          echo "--- URL CANDIDATES ---"
          python3 - <<'PY'
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          s=html.unescape(s)
          for x in sorted(set(re.findall(r'https?://[^"\'<> ]+',s))):
              print(x)
          print('--- HREF/SRC ---')
          for x in re.findall(r'(?:href|src)=["\']([^"\']+)',s):
              print(x)
          print('--- DOWNLOAD CONTEXT ---')
          for m in re.finditer('download',s,re.I):
              print(s[max(0,m.start()-300):m.start()+500].replace('\n',' ')[:800])
          PY
