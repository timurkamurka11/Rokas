name: ReactiveTurns B firestorage API probe 2
on:
  push:
    branches:
      - ci/reactiveturns-b-recovery-verify
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage client bundle
        shell: bash
        run: |
          set -euo pipefail
          url="https://firestorage.ai/_next/static/chunks/app/%28files%29/en/f/page-a7beb6e4a798ea0d.js"
          curl -sS -L -D /tmp/headers "$url" -o /tmp/page.js
          echo "--- HEADERS ---"
          cat /tmp/headers
          echo "--- BYTES ---"
          wc -c /tmp/page.js
          echo "--- CONTENT ---"
          cat /tmp/page.js
