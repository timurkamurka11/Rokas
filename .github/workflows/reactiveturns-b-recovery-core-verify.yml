name: ReactiveTurns B recovery core verify
on:
  push:
    branches:
      - ci/reactiveturns-b-recovery-verify

permissions:
  contents: read

jobs:
  core-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download recovered Milestone B core overlay
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.firestorage.ai/dev/file"
          share="MECiPfupweKT"
          metadata="$(curl -fsS "$api/shares/$share/files?maxResults=1000")"
          file_id="$(printf '%s' "$metadata" | jq -r '.files[] | select(.fileName=="reactiveturns_core_overlay_v2.tar.gz") | .fileId' | head -1)"
          test -n "$file_id" && test "$file_id" != "null"
          download_json="$(curl -fsS -X POST "$api/shares/$share/files/$file_id/download")"
          download_url="$(printf '%s' "$download_json" | jq -r '.downloadUrl')"
          test -n "$download_url" && test "$download_url" != "null"
          curl -L --fail --retry 3 --retry-delay 2 "$download_url" -o /tmp/reactiveturns_core_overlay_v2.tar.gz
          echo "730cfe684b34ece520fb4df047c1d746f62c34281b51a392e4cbc99ee9fad110  /tmp/reactiveturns_core_overlay_v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/reactiveturns_core_overlay_v2.tar.gz -C .

      - name: Recovery diff whitespace check
        run: git diff --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and run recovered Core suite
        run: dotnet run --project Tests/Core/Rokas.Core.Tests.csproj --configuration Release

      - name: Existing asset validator
        run: python3 Tools/validate_assets.py
