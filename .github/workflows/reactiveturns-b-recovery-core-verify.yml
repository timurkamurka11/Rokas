name: ReactiveTurns B firestorage API probe
on:
  push:
    branches:
      - ci/reactiveturns-b-recovery-verify
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage client bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://firestorage.ai"
          js="/_next/static/chunks/app/(files)/en/f/page-a7beb6e4a798ea0d.js"
          curl -L --fail "$base$js" -o /tmp/page.js
          echo "JS_BYTES=$(wc -c </tmp/page.js)"
          python3 - <<'PY'
          import re
          s=open('/tmp/page.js',encoding='utf-8',errors='replace').read()
          for pat in [r'/api/[^"'\' ]+', r'https?://[^"'\' ]+', r'fetch\([^)]{0,500}\)', r'download.{0,700}', r'share.{0,500}']:
              print('---',pat,'---')
              found=[]
              for m in re.finditer(pat,s,re.I):
                  v=m.group(0)
                  if v not in found:
                      found.append(v)
              for v in found[:100]:
                  print(v[:1200])
          PY
