name: ROKAS Argon - Local Root Bridge Geometry Candidate
on:
  push:
    branches: [codex/bedsleep-argon-import-candidate]
    paths: ['Assets/Rokas/BedSleep/ArgonIntegration/REQUEST_LOCAL_ROOT_BRIDGE_QA.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finger-root-quads:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Verify original FBX and correct patch script
        run: |
          python3 -m py_compile Tools/ROKAS/ArgonFingerRetopo/local_finger_root_bridge_candidate.py
          test -s Assets/Rokas/BedSleep/ArgonSource/Models/ROKAS_Keiko_FPS_Arm_Rigged.fbx
      - name: Install Blender and FBX numpy prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Candidate local finger root joins — preserve every source vertex and UV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts/ArgonFingerLocalBridge
          blender -b --factory-startup -t 4 \
            -P Tools/ROKAS/ArgonFingerRetopo/local_finger_root_bridge_candidate.py \
            -- Assets/Rokas/BedSleep/ArgonSource/Models/ROKAS_Keiko_FPS_Arm_Rigged.fbx \
            Artifacts/ArgonFingerLocalBridge \
            2>&1 | tee Artifacts/ArgonFingerLocalBridge/blender_qa_log.txt
          test -s Artifacts/ArgonFingerLocalBridge/local_root_bridge_report.json
          test -s Artifacts/ArgonFingerLocalBridge/ROKAS_Argon_LocalRootBridge_RIG_QA_ONLY.fbx
      - name: Keep private candidate until real Unity visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROKAS-Argon-LocalRootBridge-Candidate-PrivateQA
          path: Artifacts/ArgonFingerLocalBridge/*
          retention-days: 7
          if-no-files-found: warn
