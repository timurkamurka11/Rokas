name: Live Messenger 1.1 Asset Transfer Probe

on:
  push:
    branches: [feature/messages-system]
    paths:
      - .github/workflows/live-messenger-11-assets.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Resolve temporary user-asset API contract
        run: |
          python3 - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          base='https://firestorage.ai/ja/f/6mLjVEeLVYvQ'
          html=requests.get(base,timeout=30).text
          for src in re.findall(r'<script[^>]+src="([^"]+)"',html):
              url=urljoin(base,src); text=requests.get(url,timeout=30).text
              for needle in ('/files?maxResults=1000','download-url','downloadUrl','download-token','downloadToken','/download'):
                  pos=text.find(needle)
                  if pos>=0:
                      print('\nSCRIPT',url,'NEEDLE',needle)
                      print(text[max(0,pos-2200):pos+3200])
              for match in sorted(set(re.findall(r'https?://[^"\'`\\ ]+',text))):
                  if 'firestorage' in match.lower() or '/api' in match.lower(): print('URL',match[:500])
          PY
