name: Live Messenger 1.1 Asset Transfer Probe

on:
  push:
    branches: [feature/messages-system]
    paths:
      - .github/workflows/live-messenger-11-assets.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Discover temporary user-asset download API
        env:
          SHARE_URL: https://firestorage.ai/ja/f/6mLjVEeLVYvQ
        run: |
          python3 - <<'PY'
          import os, re, requests
          from urllib.parse import urljoin
          base = os.environ['SHARE_URL']
          html = requests.get(base, timeout=30).text
          scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
          print('scripts', len(scripts))
          needles = ('download', 'shareId', '/api/', 'file-download', 'signed')
          for src in scripts:
              url = urljoin(base, src)
              text = requests.get(url, timeout=30).text
              if not any(n in text for n in needles):
                  continue
              print('SCRIPT', url, 'bytes', len(text))
              for needle in needles:
                  start = 0
                  hits = 0
                  while hits < 8:
                      pos = text.find(needle, start)
                      if pos < 0: break
                      print('HIT', needle, text[max(0,pos-300):pos+500].replace('\n',' '))
                      hits += 1
                      start = pos + len(needle)
          PY
