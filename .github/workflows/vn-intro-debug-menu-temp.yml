name: ROKAS VN Intro Debug Menu TDD Temp

on:
  push:
    branches:
      - feature/vn-intro-debug-menu
    paths:
      - .github/workflows/vn-intro-debug-menu-temp.yml
      - Assets/Rokas/Editor/RokasVnIntroDebugMenu.cs
      - Assets/Rokas/Editor/RokasVnIntroDebugMenu.cs.meta
      - Assets/Rokas/Tests/EditMode/VnIntroDebugMenuTests.cs
      - Assets/Rokas/Tests/EditMode/VnIntroDebugMenuTests.cs.meta
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  debug-menu-editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Run VN debug menu EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          cliVersion: v0.1.60
          testMode: EditMode
          customParameters: -testFilter Rokas.Core.Tests.VnIntroDebugMenuTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Debug Menu EditMode
          artifactsPath: artifacts-debug-menu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vn-debug-menu-editmode-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 2

  vn-progress-editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Run existing VN progress EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.19f1
          cliVersion: v0.1.60
          testMode: EditMode
          customParameters: -testFilter Rokas.Core.Tests.VnIntroProgressTests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: VN Existing Progress EditMode
          artifactsPath: artifacts-vn-progress
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vn-existing-progress-editmode-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 2
