name: Live Messenger 1.1 Core Patch

on:
  push:
    branches: [feature/messages-system]
    paths:
      - .github/workflows/live-messenger-11-core.yml
      - Tools/apply_live_messenger_11_core.py
      - Tools/migrate_live_messenger_11_legacy_tests.py

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/messages-system
          fetch-depth: 0

      - name: Apply Live Messenger 1.1 core patch
        run: python3 Tools/apply_live_messenger_11_core.py

      - name: Migrate legacy Live Messenger assertions
        run: python3 Tools/migrate_live_messenger_11_legacy_tests.py

      - name: Literal diff check
        run: git diff --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run focused and full Core behavior harness
        run: dotnet run --project Tests/Core/Rokas.Core.Tests.csproj --configuration Release

      - name: Persist green Live Messenger 1.1 core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/Rokas/Scripts/Core/MessageService.cs Assets/Rokas/Scripts/Core/LiveMessengerService.cs Tests/Core/YumikoFoodIntegrationTests.cs
          git commit -m "fix: polish Live Messenger 1.1 core behavior"
          git push origin HEAD:feature/messages-system
