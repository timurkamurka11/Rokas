name: ROKAS VN Main-Game Final Validation
# Final parity validation trigger: 2026-09-26

on:
  push:
    branches:
      - codex/vn-intro-main-game-integration
    paths:
      - '.github/workflows/vn-main-game-integration-final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.3.19f1

jobs:
  all-unity-tests:
    name: Final Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: Library
          key: VN-MainGame-Final-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            VN-MainGame-Final-${{ runner.os }}-
            Unity-Library-${{ runner.os }}-

      - name: Run final Unity validation once
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: All
          cliVersion: v0.1.60
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ROKAS VN Main-Game Final Unity
          artifactsPath: artifacts-vn-main-game-final

      - name: Preserve validation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/head.txt
          git rev-parse HEAD^{tree} > verification/tree.txt
          git status --short --untracked-files=all > verification/post-unity-git-status.txt
          git diff --check > verification/git-diff-check.txt

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vn-main-game-final-validation
          path: |
            ${{ steps.unity-tests.outputs.artifactsPath }}
            verification
          if-no-files-found: warn

  exact-tree:
    name: Fresh exact candidate tree
    needs: all-unity-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require clean fresh checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short --untracked-files=all)"
          git diff --check
          printf 'HEAD=%s\nTREE=%s\nGIT_STATUS=CLEAN\nGIT_DIFF_CHECK=PASS\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
